/* ---------------- render ---------------- */
function render(j){
  /* the accent follows the view — panels and nav answer in its colour */
  $('#g').dataset.view=VIEW;
  /* villages filed per day, for the area chart */
  const byDay={}; j.month.rows.forEach(r=>{byDay[r.date]=(byDay[r.date]||0)+1;});
  j.att14x=j.att14.map(r=>({...r, filedN:byDay[r.date]||0}));
  const A=analyse(j); window.__ISS=A.iss;
  /* refreshes must not orphan an open drawer: keep prior registries, replace only what this render rebuilds */
  window.__ROWS=window.__ROWS||{}; window.__ROWS.att=[]; window.__ROWS.ins=[];
  /* the poll must not eat a half-typed question */
  const ai=$('#askIn'), aiVal=ai?ai.value:'', aiFoc=ai&&document.activeElement===ai;
  const keep={}; document.querySelectorAll('#g [data-k]').forEach(el=>keep[el.dataset.k]=el.scrollTop);
  $('#g').innerHTML = VIEW==='overview'?vOverview(j,A)
    : VIEW==='attendance'?vAttendance(j,A)
    : VIEW==='villages'?vVillages(j,A)
    : VIEW==='leave'?vLeave(j,A)
    : VIEW==='notices'?vNotices(j,A)
    : VIEW==='gpdp'?vGpdp(j,A)
    : VIEW==='advisory'?vAdvisory(j,A) : vMap(j,A);
  document.querySelectorAll('#g [data-k]').forEach(el=>{ if(keep[el.dataset.k]) el.scrollTop=keep[el.dataset.k]; });
  if(VIEW==='gpdp' && !GPDP) pullGpdp();
  if(VIEW==='advisory' && !ADV) pullAdv();
  if(VIEW==='overview') drawMap('map','main');
  if(VIEW==='map') drawMap('map2','full');
  const mf=$('#mFind'); if(mf) mf.onchange=()=>{ if(mf.value) flyTo(mf.value); };
  const mp=$('#mPick'); if(mp) mp.onchange=()=>{ if(mp.value) flyTo(mp.value); };
  const gq=$('#gpFind');
  if(gq) gq.oninput=()=>{const q=gq.value.toLowerCase();
    document.querySelectorAll('#gpBody tr').forEach(tr=>{
      tr.style.display = !q || tr.textContent.toLowerCase().indexOf(q)>=0 ? '' : 'none'; }); };
  const aq=$('#advFind');
  if(aq) aq.oninput=()=>{const q=aq.value.toLowerCase();
    document.querySelectorAll('#advBody tr').forEach(tr=>{
      tr.style.display = !q || tr.textContent.toLowerCase().indexOf(q)>=0 ? '' : 'none'; }); };

  const f=$('#attFind'); if(f) f.oninput=()=>{const q=f.value.toLowerCase();
    document.querySelectorAll('#attBody tr').forEach(tr=>tr.style.display=tr.dataset.f.includes(q)?'':'none');};
  const ni=$('#askIn');
  if(ni){
    if(aiVal&&!ni.value) ni.value=aiVal;
    if(aiFoc){ ni.focus(); try{ni.setSelectionRange(ni.value.length,ni.value.length);}catch(e2){} }
    ni.onkeydown=e2=>{ if(e2.key==='Enter'&&ni.value.trim()){ e2.preventDefault(); const q=ni.value; ni.value=''; sendAsk(q); } };
  }
  if(!DOWN){ $('#live').className='live'; $('#liveTx').textContent='updated now'; }
}


/* ---- the two registers, taken away as a file ---- */
function exportGpdpCsv(){
  if(!GPDP) return;
  const rows=[['Status','Mandal','Village','Officer','Role','Phone','Filed at','File','Link']];
  (GPDP.roll||[]).forEach(r=>rows.push([
    r.uploaded?'FILED':'NOT FILED', r.mandal||'', r.gp||'', r.name||'', r.role||'', r.phone||'',
    r.uploaded?docWhen(r.uploadedAt):'', r.fileName||'', r.url||'']));
  dlBlob('SJGP_GPDP_'+GPDP.year+'.csv','text/csv;charset=utf-8',csvText(rows));
}
function exportAdvCsv(){
  if(!ADV||!ADV.advisory) return;
  const rows=[['Status','Mandal','Village','Officer','Role','Phone','Acknowledged at']];
  (ADV.roll||[]).forEach(r=>rows.push([
    r.acknowledged?'READ':'PENDING', r.mandal||'', r.gp||'', r.name||'', r.role||'', r.phone||'',
    r.acknowledged?docWhen(r.ackAt):'']));
  dlBlob('SJGP_advisory_'+(ADV.advisory.id||'')+'.csv','text/csv;charset=utf-8',csvText(rows));
}

/* ---- publishing a circular ----
   The file rides as base64 in the request body, the same way an attendance
   photograph does. A circular is put in front of 280 officers, so the button
   states plainly what it is about to do before it does it. */
function publishAdvisory(){
  if(ADVBUSY) return;
  const title=($('#advTitle')&&$('#advTitle').value||'').trim();
  const msg=($('#advMsg')&&$('#advMsg').value||'').trim();
  const aud=($('#advAud')&&$('#advAud').value)||'ALL';
  const fi=$('#advFile'), file=fi&&fi.files&&fi.files[0];
  const note=$('#advNote');
  const say=(t,bad)=>{ if(note){ note.textContent=t; note.style.color=bad?'var(--red)':'var(--tx-3)'; } };
  if(!title){ say('Give the advisory a title first.',true); return; }
  if(!msg){ say('Write the line every officer will be shown.',true); return; }

  const send=b64=>{
    ADVBUSY=true; if(DATA) render(DATA); say('Publishing…');
    fetch(ST.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({kind:'advPublish',token:ST.token,title:title,message:msg,audience:aud,
        file:file?{name:file.name,b64:b64}:null})})
      .then(r=>r.json()).then(j=>{
        ADVBUSY=false;
        if(!j||j.ok===false){ say((j&&j.error)||'The district refused it.',true); if(DATA) render(DATA); return; }
        ADV=null; pullAdv().then(()=>{ if(DATA) render(DATA); });
      })
      .catch(err=>{ ADVBUSY=false; say('It did not get through: '+err,true); if(DATA) render(DATA); });
  };

  if(!file){
    if(!confirm('Publish this advisory to every officer with no document attached?\n\nThey will see the title and your line of instruction.')) return;
    send(null); return;
  }
  if(file.size > 12*1024*1024){ say('That file is '+(file.size/1048576).toFixed(1)+' MB. The limit is 12 MB.',true); return; }
  const fr=new FileReader();
  fr.onerror=()=>say('The file could not be read.',true);
  fr.onload=()=>{ const s=String(fr.result||''), i=s.indexOf(','); if(i<0){ say('The file could not be read.',true); return; }
    send(s.slice(i+1)); };
  fr.readAsDataURL(file);
}

/* ---------------- interactions ---------------- */
document.addEventListener('click',e=>{
  if(e.target.closest('[data-close]')){ $('#drawer').hidden=true; return; }
  const mt=e.target.closest('.mtab');
  if(mt){ MET=mt.dataset.met;
    document.querySelectorAll('.mtab').forEach(x=>x.setAttribute('aria-selected',x===mt));
    $('#area').innerHTML=areaChart(DATA.att14x,MET,metColor(MET));
    return; }
  const kp=e.target.closest('[data-act]');
  if(kp){ const [kind,arg]=kp.dataset.act.split(':');
    if(kind==='view'){ VIEW=arg; document.querySelectorAll('#nav [data-v]').forEach(x=>x.toggleAttribute('aria-current',x.dataset.v===arg)); if(DATA) render(DATA); }
    else if(arg==='absent'){ const ab=DATA.today.absent;
      openDrawer('Not marked today', ab.length+' officer'+(ab.length===1?'':'s'),
        ab.length?'<ul>'+ab.map(o=>'<li>'+esc(o.name)+' · '+esc(o.role)+' · '+esc(o.mandal||'—')+'</li>').join('')+'</ul>':'<p style="font-size:13px">Everyone is accounted for.</p>'); }
    else if(kind==='gp'){
      if(arg==='folder'){ if(GPDP&&GPDP.folderUrl) window.open(GPDP.folderUrl,'_blank','noopener'); return; }
      const list=(GPDP&&GPDP.roll||[]).filter(r=>arg==='filed'?r.uploaded:!r.uploaded);
      openDrawer(arg==='filed'?'Plans filed':'Still to file', list.length+' officer'+(list.length===1?'':'s'),
        list.length?'<ul>'+list.map(o=>'<li>'+esc(o.name)+' · '+esc(o.role)+' · '+esc(o.mandal||'—')+
          (o.uploaded&&o.url?' · <a href="'+esc(o.url)+'" target="_blank" rel="noopener">view</a>':'')+'</li>').join('')+'</ul>'
        :'<p style="font-size:13px">Nobody.</p>'); }
    else if(kind==='adv'){
      const list=(ADV&&ADV.roll||[]).filter(r=>arg==='ack'?r.acknowledged:!r.acknowledged);
      openDrawer(arg==='ack'?'Acknowledged':'Still pending', list.length+' officer'+(list.length===1?'':'s'),
        list.length?'<ul>'+list.map(o=>'<li>'+esc(o.name)+' · '+esc(o.role)+' · '+esc(o.mandal||'—')+'</li>').join('')+'</ul>'
        :'<p style="font-size:13px">Nobody.</p>'); }
    else if(arg==='flags'){ const fl=DATA.month.rows.filter(r=>String(r.rf||'').trim());
      window.__ROWS.fl=fl;
      openDrawer('Red-flagged villages', fl.length+' this month',
        fl.length?`<table><tbody>${fl.map((r,i)=>`<tr data-di="fl:${i}"><td>${esc(r.gp)}<span class="mut"> · ${esc(r.mandal)}</span></td><td class="num">${r.score}</td><td><span class="pill bad">RF ${esc(r.rf)}</span></td></tr>`).join('')}</tbody></table>`
        :'<p style="font-size:13px">None.</p>'); }
    return; }
  if(e.target.closest('#briefGo')){ writeBrief(); return; }
  const ex=e.target.closest('[data-exp]');
  if(ex){ doExport(ex.dataset.exp); return; }
  if(e.target.closest('#askGo')){ const inp=$('#askIn'); if(inp&&inp.value.trim()){ const q=inp.value; inp.value=''; sendAsk(q); } return; }
  const ac=e.target.closest('[data-ask]');
  if(ac){ sendAsk(ac.dataset.ask); return; }
  if(e.target.closest('#askClear')){ CHAT=[]; if(DATA) render(DATA); return; }
  const ck=e.target.closest('.ntcCk');
  if(ck){ if(ck.checked) delete NTC_UNCHK[ck.dataset.id]; else NTC_UNCHK[ck.dataset.id]=1; return; }
  if(e.target.closest('#ntcSend')){ decideNotices('approve'); return; }
  if(e.target.closest('#ntcDrop')){ decideNotices('drop'); return; }
  if(e.target.closest('#newsClear')){ NEWS=[]; if(DATA) render(DATA); return; }
  if(e.target.closest('#newsAsk')){ try{ Notification.requestPermission().then(()=>{ if(DATA) render(DATA); }); }catch(e2){} return; }
  const gf=e.target.closest('[data-gpf]');
  if(gf){ GPFILTER=gf.dataset.gpf; if(DATA) render(DATA); return; }
  const af=e.target.closest('[data-advf]');
  if(af){ ADVFILTER=af.dataset.advf; if(DATA) render(DATA); return; }
  if(e.target.closest('#gpCsv')){ exportGpdpCsv(); return; }
  if(e.target.closest('#advCsv')){ exportAdvCsv(); return; }
  if(e.target.closest('#advGo')){ publishAdvisory(); return; }

  const fc=e.target.closest('[data-mf]');
  if(fc){ MFILTER=fc.dataset.mf; if(DATA) render(DATA); return; }
  if(e.target.closest('#mFit')){ const m=MAP2&&document.getElementById('map2')?MAP2:MAP;
    if(m&&MARKERS.length) m.fitBounds(L.latLngBounds(MARKERS.map(x=>[x.p.lat,x.p.lng])).pad(0.25)); return; }
  const mk=e.target.closest('.mk');
  if(mk && MAP){ const r=DATA.today.present.slice().sort((a,b)=>String(b.at).localeCompare(String(a.at)))[+mk.dataset.mi];
    if(r&&r.lat&&r.lng){ MAP.setView([r.lat,r.lng],14);
      MLAYER.eachLayer(l=>{const ll=l.getLatLng(); if(Math.abs(ll.lat-r.lat)<1e-9&&Math.abs(ll.lng-r.lng)<1e-9) l.openPopup();}); }
    return; }
  const ir=e.target.closest('.iss[data-ii]');
  if(ir){ const x=window.__ISS[+ir.dataset.ii]; if(!x) return;
    openDrawer('P'+x.p+' · '+x.t,x.d,(x.list&&x.list.length?'<ul>'+x.list.map(v=>'<li>'+esc(v)+'</li>').join('')+'</ul>':'')+
      '<p style="font-size:13px;margin-top:12px;color:var(--seal);font-weight:600">→ '+esc(x.a)+'</p>'); return; }
  if(e.target.closest('#insSort')){ SORTD=!SORTD; if(DATA) render(DATA); return; }
  const md=e.target.closest('tr[data-md]');
  if(md){ const c=(window.__ROWS.mandal||[])[+md.dataset.md]; if(c) openMandal(c); return; }
  const dd=e.target.closest('tr[data-dd]');
  if(dd){ const d=(window.__ROWS.dayd||[])[+dd.dataset.dd]; if(!d) return;
    window.__ROWS.day=d.list;
    openDrawer(dm(d.date), d.present+' present · '+d.leave+' leave · '+d.absent+' missing',
      d.list.length?`<b class="dsec">Villages filed that day · tap one</b><table style="margin-top:6px"><tbody>${
        d.list.map((r,i)=>`<tr data-di="day:${i}"><td>${esc(r.gp)}<span class="mut"> · ${esc(r.mandal)}</span></td>
        <td class="num">${r.score}</td><td class="gr gr${esc(r.grade)}">${esc(r.grade)}</td></tr>`).join('')}</tbody></table>`
      :'<p style="font-size:13px;color:var(--tx-2)">Nothing was filed that day.</p>'+
       (d.avg!=null?'':'')); return; }
  const tr=e.target.closest('tr[data-di]');
  if(tr){ const [kind,i]=tr.dataset.di.split(':'); const r=(window.__ROWS[kind]||[])[+i]; if(!r) return;
    if(kind==='ntc'){ const g=(DATA.notices||{}).grace||3;
      const nth=x=>x+(x===1?'st':x===2?'nd':x===3?'rd':'th');
      const stLine=r.status==='ACK'?'Acknowledged '+esc(dm(r.ackAt)+' '+hm(r.ackAt))
        :r.status==='PENDING'?'<span class="pill warn">Served — awaiting acknowledgement; the officer\u2019s app is locked</span>'
        :r.status==='PROPOSED'?'<span class="pill">Proposed — not served; awaiting your word on the Notices view</span>'
        :r.status==='CURED'?'<span class="pill ok">Cured — the officer\u2019s attendance reached the district before service. Never served, no number taken.</span>'
        :r.status==='WITHDRAWN'?'<span class="pill ok">Withdrawn — attendance was on record; the notice was issued in error and any debit reversed.</span>'
        :'Dropped'+(r.decidedBy?' by '+esc(r.decidedBy):'')+' — never served, no number taken';
      openDrawer('Notice '+(r.no||'(unnumbered)'), r.name+' · '+r.role+' · '+(r.mandal||'—'),
        `<dl><dt>For the date</dt><dd>${esc(dm(r.date))}</dd>
         <dt>Standing</dt><dd>${r.seq?nth(r.seq)+' served notice of the month'+(r.seq>g?' · <span class="pill bad">debit band</span>':' · warning band'):'—'}</dd>
         <dt>Status</dt><dd>${stLine}</dd>
         ${r.decidedBy&&r.status!=='DROPPED'&&r.status!=='PROPOSED'?`<dt>Served by</dt><dd>${esc(r.decidedBy)}</dd>`:''}
         ${r.ackNote?`<dt>Officer\u2019s explanation</dt><dd style="white-space:pre-wrap">${esc(r.ackNote)}</dd>`:''}
         <dt>Leave debit</dt><dd>${r.clDebited?'<span class="pill bad">1 day debited</span> — entry on the Leave register (SYSTEM · SJSP attendance rule)':'none against this notice'}</dd></dl>`);
      return; }
    if(kind==='ins'||kind==='worst'||kind==='day'||kind==='mv'||kind==='fl'){ openVillage(r); return; }
    if(kind==='att') openDrawer(r.name,r.role+' · '+(r.mandal||'—'),
      `<dl><dt>Status</dt><dd>${r._s==='P'?'Present':r._s==='L'?'On leave ('+esc(r.leaveType||'')+')':'Not marked'}</dd>
       ${r._s==='P'?`<dt>Time</dt><dd>${esc(hm(r.at))}</dd><dt>Location</dt><dd>${r.verified?'verified':'no fix'}${r.acc?' · ±'+r.acc+' m':''}</dd>`:''}
       ${(r.marks||1)>1?`<dt>Marked</dt><dd>${r.marks}× today</dd>`:''}
       ${r.lat&&r.lng?`<dt>Coordinates</dt><dd>${r.lat.toFixed(5)}, ${r.lng.toFixed(5)}</dd>`:''}</dl>`+
      (r.lat&&r.lng?`<a class="mapsbtn" target="_blank" rel="noopener" href="https://maps.google.com/?q=${r.lat},${r.lng}">Open the pin in Google Maps</a>`:''));
    else openDrawer(r.gp,r.mandal+' · '+dm(r.date),
      `<dl><dt>Score</dt><dd>${r.score} · grade ${esc(r.grade)}</dd><dt>Red flags</dt><dd>${String(r.rf||'').trim()?esc(r.rf):'none'}</dd>
       <dt>Filed by</dt><dd>${esc(String(r.officer||''))}</dd>
       ${r.photos?`<dt>Photographs</dt><dd>${r.photos}</dd>`:''}</dl>
       ${photoLink(r)?`<a class="mapsbtn" target="_blank" rel="noopener" href="${esc(photoLink(r))}">View the evidence photographs</a>`:''}
       ${r.lat&&r.lng?`<a class="mapsbtn" target="_blank" rel="noopener" href="https://maps.google.com/?q=${r.lat},${r.lng}">Where it was inspected</a>`:''}
       <p style="font-size:12.5px;color:var(--tx-2);margin-top:12px">The clause-by-clause scorecard is on the district Sheet against this village and month.</p>`);
    return; }
});
/* The way to a filing's photographs: the album where one was made, else the
   Drive folder. The register stores the folder as a FULL url — building
   drive.google.com/drive/folders/<url> on top of it made a dead link, and
   the app never fills `album` at all, so the Villages drawer showed a
   photograph COUNT with nothing to press. */
const photoLink=r=>{const a=String(r.album||'').trim(); if(a) return a;
  const f=String(r.folder||r.photoFolder||'').trim(); if(!f) return '';
  return /^https?:/i.test(f)?f:'https://drive.google.com/drive/folders/'+f;};
/* The whole filed record: every clause with the mark it carried, the
   evidence notes, the photographs and the red flags. */
async function openVillage(r){
  const pl=photoLink(r);
  const head=`${pl?`<a class="mapsbtn" target="_blank" rel="noopener" href="${esc(pl)}" style="display:block;text-align:center;font-weight:700;background:var(--pri);color:#fff;border:0;margin:0 0 14px">Open the photographs${r.photos?' ('+r.photos+')':''}</a>`:''}
  <dl><dt>Score</dt><dd>${r.score} of 100 · grade <span class="gr gr${esc(r.grade)}">${esc(r.grade)}</span></dd>
    <dt>Red flags</dt><dd>${String(r.rf||'').trim()?'<span class="pill bad">RF '+esc(r.rf)+'</span>':'none'}</dd>
    <dt>Filed by</dt><dd>${esc(String(r.officer||''))}</dd><dt>Date</dt><dd>${esc(dm(r.date))}</dd>
    ${r.photos?`<dt>Photographs</dt><dd>${r.photos}${pl?'':' — the folder link has not reached the register yet'}</dd>`:''}</dl>
    ${r.lat&&r.lng?`<a class="mapsbtn" target="_blank" rel="noopener" href="https://maps.google.com/?q=${r.lat},${r.lng}">Where it was inspected</a>`:''}`;
  openDrawer(r.gp, r.mandal+' · '+dm(r.date), head+'<p style="margin-top:14px;color:var(--tx-3);font-size:13px">Reading the clause-by-clause record…</p>');
  const key=r.gp+'|'+DATA.ym;
  try{
    if(!REC[key]){
      const res=await fetch(ST.url+'?op=record&token='+encodeURIComponent(ST.token)+'&gp='+encodeURIComponent(r.gp)+'&ym='+encodeURIComponent(DATA.ym));
      REC[key]=await res.json();
    }
    const j=REC[key];
    if(!j.ok){ $('#dBody').innerHTML=head+'<p style="margin-top:14px;color:var(--tx-2);font-size:13px">'+esc(j.error||'The clause detail is not available.')+'</p>'; return; }
    $('#dBody').innerHTML=head+recordHTML(j.row);
  }catch(e){ $('#dBody').innerHTML=head+'<p style="margin-top:14px;color:var(--tx-2);font-size:13px">Could not read the clause detail: '+esc(e.message)+'</p>'; }
}
const SEC_NAMES={A:'A · Household & premises',B:'B · Drains and public places',C:'C · Waste collection',D:'D · Segregation shed',E:'E · Institutions',F:'F · Water bodies & tanks',G:'G · Records & staff',P:'Panchayat Secretary'};
function recordHTML(row){
  let p=null;
  try{ p=JSON.parse(row.payload||row.Payload||'{}'); }catch(e){}
  if(!p||!p.s) return '<p style="margin-top:14px;color:var(--tx-2);font-size:13px">The clause detail was not stored with this filing.</p>';
  const marks=Object.keys(p.s).filter(k=>!k.startsWith('p')).sort();
  const ps=Object.keys(p.s).filter(k=>k.startsWith('p')).sort();
  const ev=p.ev||{}, evp=p.evp||{};
  const line=k=>{
    const note=(ev[k]||'').trim(), shots=(evp[k]||[]).length;
    return `<tr><td><b>${esc(k.replace(/^p/,'').toUpperCase())}</b></td>
      <td class="num">${p.s[k]}</td>
      <td style="white-space:normal;font-size:12px;color:var(--tx-2);text-align:left">${note?esc(note):'<span style="color:var(--tx-3)">no note</span>'}${shots?` <span class="pill ok">${shots} photo${shots>1?'s':''}</span>`:''}</td></tr>`;};
  /* one table per section, with the section's own total */
  const bySec={}; marks.forEach(k=>{const g=k[0].toUpperCase();(bySec[g]=bySec[g]||[]).push(k);});
  let h='';
  Object.keys(bySec).sort().forEach(g=>{
    const ks=bySec[g], tot=ks.reduce((s2,k)=>s2+(Number(p.s[k])||0),0);
    h+=`<div style="margin-top:16px"><b class="dsec">${esc(SEC_NAMES[g]||('Section '+g))} · ${tot} marks</b>
      <table style="margin-top:7px"><thead><tr><th style="width:64px">Clause</th><th style="width:56px">Mark</th><th>Evidence recorded</th></tr></thead><tbody>${ks.map(line).join('')}</tbody></table></div>`;});
  if(ps.length) h+=`<div style="margin-top:16px"><b class="dsec">${esc(SEC_NAMES.P)}</b>
    <table style="margin-top:7px"><thead><tr><th style="width:64px">Clause</th><th style="width:56px">Mark</th><th>Evidence</th></tr></thead><tbody>${ps.map(line).join('')}</tbody></table></div>`;
  const noEv=marks.filter(k=>!(ev[k]||'').trim() && !((evp[k]||[]).length));
  h+=`<div style="margin-top:16px;font-size:12.5px;color:var(--tx-2);line-height:1.6">
    <b style="color:var(--tx)">${marks.length}</b> clauses scored ·
    <b style="color:${noEv.length?'var(--amber)':'var(--green)'}">${marks.length-noEv.length}</b> carry a note or a photograph
    ${p.tIn?` · visit ${esc(p.tIn)}–${esc(p.tOut||'')}`:''}
    ${p.workers&&p.workers.length?` · ${p.workers.filter(w=>w.name&&w.name.trim()).length} sanitation worker(s) checked`:''}
    ${p.photos?` · ${p.photos.length} of the 14 points photographed`:''}</div>`;
  if(p.rf&&p.rf.length) h+=`<div style="margin-top:12px"><span class="pill bad">Red flags: ${esc(p.rf.join(', '))}</span>
    ${p.rfNote?`<p style="margin-top:7px;font-size:12.5px;color:var(--tx-2)">${esc(p.rfNote)}</p>`:''}</div>`;
  return h;
}
/* the whole mandal on one sheet: officers today, villages filed, villages pending */
function openMandal(c){
  const m=c.mandal;
  const pres=DATA.today.present.filter(r=>r.mandal===m), lv=DATA.today.onLeave.filter(r=>r.mandal===m),
        abs=DATA.today.absent.filter(r=>r.mandal===m);
  const filed=DATA.month.rows.filter(r=>r.mandal===m).sort((a,b)=>a.score-b.score);
  const avg=filed.length?Math.round(filed.reduce((s2,r)=>s2+r.score,0)/filed.length):null;
  const rf=filed.filter(r=>String(r.rf||'').trim());
  window.__ROWS.mv=filed;
  const body=`<dl>
    <dt>Attendance today</dt><dd>${pres.length} present · ${lv.length} leave · <span style="color:${abs.length?'var(--red)':'var(--green)'}">${abs.length} not marked</span></dd>
    <dt>Coverage</dt><dd>${c.done} of ${c.total} villages (${pct(c.done,c.total)}%)</dd>
    <dt>Average score</dt><dd>${avg==null?'—':avg}</dd>
    <dt>Red flags</dt><dd>${rf.length?'<span class="pill bad">'+rf.length+'</span>':'none'}</dd></dl>
  ${abs.length?`<div style="margin-top:13px"><b class="dsec">Not marked today</b><ul>${abs.map(o=>'<li>'+esc(o.name)+' · '+esc(o.role)+'</li>').join('')}</ul></div>`:''}
  ${filed.length?`<div style="margin-top:13px"><b class="dsec">Villages evaluated · tap one</b>
    <table style="margin-top:6px"><tbody>${filed.map((r,i)=>`<tr data-di="mv:${i}"><td>${esc(r.gp)}</td>
      <td class="num">${r.score}</td><td class="gr gr${esc(r.grade)}">${esc(r.grade)}</td>
      <td>${String(r.rf||'').trim()?'<span class="pill bad">RF</span>':''}</td></tr>`).join('')}</tbody></table></div>`:''}
  ${(c.pending&&c.pending.length)?`<div style="margin-top:13px"><b class="dsec">Still to evaluate (${c.pending.length})</b>
    <p style="font-size:12.5px;color:var(--tx-2);line-height:1.7;margin-top:5px">${c.pending.map(esc).join(' · ')}</p></div>`:''}`;
  openDrawer(m+' mandal', pct(c.done,c.total)+'% covered · '+(pres.length+lv.length+abs.length)+' officers', body);
}
async function writeBrief(){
  if(BRIEFING||!DATA) return;
  BRIEFING=true; const btn=$('#briefGo'); if(btn){btn.textContent='Writing…';btn.disabled=true;}
  try{
    const A=analyse(DATA);
    const r=await fetch(ST.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({kind:'brief',token:ST.token,facts:briefFacts(DATA,A)})});
    const j=await r.json();
    if(j.ok) BRIEF={text:j.text,at:j.at};
    else{
      const e=String(j.error||'');
      let cure='';
      if(/UrlFetchApp|external_request|permission/i.test(e))
        cure='\n\nWHAT TO DO\nThe script has never been given permission to reach the internet, because it was authorised before the briefing existed.\n'+
             '1. Open the Sheet \u25b8 Extensions \u25b8 Apps Script.\n'+
             '2. In the function list at the top choose authoriseBriefing and press Run.\n'+
             '3. Google will show "Authorization required" \u2014 press Review permissions, choose your account, Advanced, Go to the project, Allow.\n'+
             '4. Deploy \u25b8 Manage deployments \u25b8 pencil \u25b8 Version: New version \u25b8 Deploy.\n'+
             'Then press this button again.';
      else if(/No briefing key/i.test(e))
        cure='\n\nWHAT TO DO\nApps Script \u25b8 open setBriefKey, paste your key into the KEY line, Run, then delete the key from the line and save.';
      BRIEF={text:'Could not write the briefing.\n\n'+e+cure, at:new Date().toISOString()};
    }
  }catch(e){ BRIEF={text:'Could not reach the district to write the briefing.\n\n'+e.message,at:new Date().toISOString()}; }
  BRIEFING=false; if(DATA) render(DATA);
}
function openDrawer(t,s,b){ $('#dTitle').textContent=t; $('#dSub').textContent=s; $('#dBody').innerHTML=b; $('#drawer').hidden=false; }
boot();
</script>
