<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SJGP · District Operations Center</title>
<style>
/* ============================================================
   SJGP DISTRICT OPERATIONS CENTER — Collectorate, Jangaon
   The NOC idiom in daylight: white panels on cool grey, one
   composite health score with its parts shown, and an issues
   feed where every line carries a suggested action.
   Self-contained: no fonts, no libraries, no CDNs.
   ============================================================ */
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --line:#D9DFE4; --line-2:#EAEEF1;
  --tx:#1B2733; --tx-2:#5B6770; --tx-3:#8A94A0;
  --blue:#1B67C1; --blue-2:#E8F0FA;
  --green:#2E8540; --green-2:#E7F3EA;
  --amber:#B25E09; --amber-2:#FCF0DF;
  --red:#C23934; --red-2:#FAE8E7;
  --seal:#14532D; --gold:#B8860B;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --sh:0 1px 2px rgba(27,39,51,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--tx);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:13px;
  padding:9px 18px;background:#fff;border-bottom:1px solid var(--line)}
.top .seal{width:30px;height:30px;border-radius:7px}
.top b{font-size:15px}
.top .crumb{color:var(--tx-3);font-size:12.5px}
.top .sp{flex:1}
.live{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;color:var(--tx-2)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--green)}
.live.stale i{background:var(--amber)} .live.down i{background:var(--red)}
.rsel,.tbtn{background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 10px;
  font-size:12.5px;color:var(--tx-2)}
.rsel{font-family:var(--mono);font-size:12px}
.rsel:hover,.tbtn:hover{border-color:#B9C2CB;color:var(--tx)}

/* ---------- grid & panels ---------- */
.wrap{max-width:1560px;margin:0 auto;padding:14px 18px 44px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--sh);min-width:0}
.panel .hd{display:flex;align-items:center;gap:8px;padding:10px 14px 7px;
  font-size:11px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--tx-2)}
.panel .hd .r{margin-left:auto;font-family:var(--mono);font-weight:400;text-transform:none;letter-spacing:0;color:var(--tx-3);font-size:11px}
.panel .bd{padding:4px 14px 14px}

/* stats with deltas */
.stat .bd{padding:2px 14px 14px}
.stat .v{font-family:var(--mono);font-size:32px;font-weight:700;line-height:1.05;color:var(--tx)}
.stat .s{font-size:11.5px;color:var(--tx-3);margin-top:3px}
.delta{font-family:var(--mono);font-size:11.5px;font-weight:700;margin-left:8px;vertical-align:6px}
.up{color:var(--green)} .dn{color:var(--red)} .fl{color:var(--tx-3)}
.g{color:var(--green)} .a{color:var(--amber)} .rd{color:var(--red)} .bl{color:var(--blue)}

/* health */
.healthwrap{display:flex;gap:16px;align-items:center}
.hcomp{flex:1;min-width:0}
.hrow{display:flex;align-items:center;gap:9px;margin:7px 0;font-size:12px;color:var(--tx-2)}
.hrow b{width:118px;font-weight:600;color:var(--tx)}
.hbar{flex:1;height:8px;border-radius:5px;background:var(--line-2);overflow:hidden}
.hbar i{display:block;height:100%}
.hrow .n{font-family:var(--mono);width:34px;text-align:right;color:var(--tx)}

/* issues feed */
.iss{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.iss:last-child{border-bottom:0}
.sev{flex:none;font-family:var(--mono);font-size:10.5px;font-weight:800;border-radius:5px;
  padding:2px 7px;height:fit-content;margin-top:2px}
.sev.p1{background:var(--red-2);color:var(--red);border:1px solid #EFC7C5}
.sev.p2{background:var(--amber-2);color:var(--amber);border:1px solid #F0D9B8}
.sev.p3{background:var(--blue-2);color:var(--blue);border:1px solid #C9DCF4}
.iss .t{min-width:0}
.iss .t b{display:block;font-size:13.5px;font-weight:650}
.iss .t span{display:block;font-size:12.5px;color:var(--tx-2);margin-top:2px;line-height:1.5}
.iss .t .act{color:var(--seal);font-weight:600;margin-top:3px}
.iss .t .act::before{content:"→ ";color:var(--gold)}
.allclear{padding:26px 12px;text-align:center;color:var(--green);font-weight:650}

/* charts */
svg{display:block;width:100%}
.axis{font-family:var(--mono);font-size:10px;fill:var(--tx-3)}
.gridln{stroke:var(--line-2);stroke-width:1}

/* tables */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:10.5px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--tx-3);
  text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
td{padding:7px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td.mut{color:var(--tx-2)} td.num{font-family:var(--mono);text-align:right}
tr:hover td{background:#F6F8FA}
.twrap{overflow:auto;max-height:330px}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;padding:1.5px 8px;border-radius:9px}
.pill.ok{color:var(--green);background:var(--green-2)}
.pill.warn{color:var(--amber);background:var(--amber-2)}
.pill.bad{color:var(--red);background:var(--red-2)}
.pill.mut{color:var(--tx-3);background:var(--line-2)}
.bar{height:7px;border-radius:4px;background:var(--line-2);overflow:hidden;min-width:90px}
.bar i{display:block;height:100%}
.gr{font-family:var(--mono);font-weight:700}
.grA{color:var(--green)} .grB{color:#5E9732} .grC{color:var(--amber)} .grD{color:var(--red)}
.empty{padding:22px 12px;color:var(--tx-3);font-size:13px;text-align:center}

.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}
.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}
.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:1150px){.c2,.c3{grid-column:span 4}.c4,.c5{grid-column:span 6}.c6,.c7,.c8{grid-column:span 12}}
@media(max-width:680px){.c2,.c3,.c4,.c5{grid-column:span 6}.wrap{padding:10px 10px 30px}}

/* gate */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}
.gate .card{max-width:440px;text-align:center;border:1px solid var(--line);border-radius:10px;
  background:#fff;padding:34px 30px;box-shadow:var(--sh)}
.gate img{width:64px;height:64px;border-radius:14px;margin-bottom:16px}
.gate h1{font-size:19px;margin-bottom:8px}
.gate p{color:var(--tx-2);font-size:13.5px;line-height:1.6}
.gate .rd{color:var(--red)}
.gate a.tbtn{display:inline-block;margin-top:18px}
#err{position:fixed;left:0;right:0;bottom:0;background:#FDF3F3;border-top:1px solid #EFC7C5;
  color:var(--red);font-size:13px;padding:9px 18px;font-family:var(--mono);display:none}
</style>
</head>
<body>

<div id="gate" class="gate"><div class="card">
  <img src="icons/icon-192.png" alt="">
  <h1>SJGP · District Operations Center</h1>
  <p id="gateMsg">Checking your sign-in&hellip;</p>
</div></div>

<div id="app" hidden>
  <div class="top">
    <img class="seal" src="icons/icon-192.png" alt="">
    <b>District Operations Center</b><span class="crumb">SJGP · Jangaon · <span id="who"></span></span>
    <span class="sp"></span>
    <span class="live" id="live"><i></i><span id="liveTx">connecting</span></span>
    <select class="rsel" id="every">
      <option value="30000">30s</option>
      <option value="60000" selected>1m</option>
      <option value="300000">5m</option>
    </select>
    <button class="tbtn" id="now">Refresh</button>
    <a class="tbtn" href="./">Open the app</a>
  </div>
  <div class="wrap"><div class="grid" id="g"></div></div>
</div>
<div id="err"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
let ST=null, TIMER=null, LASTOK=0, EVERY=60000, NEXT=0, INFLIGHT=false;

function boot(){
  let d=null; try{ d=JSON.parse(localStorage.getItem('sjf5')||'null'); }catch(e){}
  if(!d || !d.session || !d.session.token || !d.url){
    gate('Sign in once in the SJGP app on this device, then open this page again. The console uses that sign-in.', true); return; }
  if((d.session.user||{}).role!=='COLLECTOR'){
    gate('<span class="rd">The monitoring console is available to the Collector alone.</span> This device is signed in as '+esc((d.session.user||{}).name||'another officer')+'.', true); return; }
  ST={url:d.url, token:d.session.token, user:d.session.user};
  $('#who').textContent=ST.user.name;
  pull(); TIMER=setInterval(tick, 1000);
  $('#every').onchange=()=>{ EVERY=+$('#every').value; NEXT=Date.now()+EVERY; };
  $('#now').onclick=()=>pull();
}
function gate(msg, link){ $('#gateMsg').innerHTML=msg+(link?'<br><a class="tbtn" href="./">Open the SJGP app</a>':''); }

function tick(){
  if(Date.now()>=NEXT && !INFLIGHT) pull();
  else if(LASTOK){
    const age=Math.round((Date.now()-LASTOK)/1000);
    $('#liveTx').textContent='updated '+(age<5?'now':age+'s ago')+' · next in '+Math.max(0,Math.ceil((NEXT-Date.now())/1000))+'s';
    $('#live').className='live'+(age>EVERY/500?' stale':'');
  }
}
async function pull(){
  if(!ST||INFLIGHT) return; INFLIGHT=true;
  try{
    const res=await fetch(ST.url+'?op=dashboard&token='+encodeURIComponent(ST.token));
    const j=await res.json();
    if(!j.ok) throw new Error(j.error||'refused');
    LASTOK=Date.now(); NEXT=Date.now()+EVERY;
    $('#err').style.display='none';
    if($('#app').hidden){ $('#gate').style.display='none'; $('#app').hidden=false; }
    render(j);
  }catch(e){
    if(/alone/i.test(e.message)){ $('#app').hidden=true; $('#gate').style.display='grid'; gate('<span class="rd">'+esc(e.message)+'</span>', true); clearInterval(TIMER); }
    else{
      NEXT=Date.now()+Math.min(EVERY,30000);
      $('#err').textContent='Could not reach the district ('+esc(e.message)+') — showing the last picture; retrying.';
      $('#err').style.display='block';
      $('#live').className='live down'; $('#liveTx').textContent='connection lost';
    }
  }finally{ INFLIGHT=false; }
}

/* ---------------- helpers ---------------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm=iso=>{ const d=new Date(iso); return isNaN(d)?'':d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}); };
const dm=s=>{ const d=new Date(String(s).length>10?s:s+'T00:00:00'); return isNaN(d)?String(s||''):d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}); };
const pct=(a,b)=>b?Math.round(a*100/b):0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function daysLeftInMonth(){ const d=new Date(); const last=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); return Math.max(1, last-d.getDate()+1); }
function delta(now, prev, goodUp){
  if(prev==null||now==null) return '';
  const d=now-prev; if(!d) return '<span class="delta fl">·0</span>';
  const up=d>0, good=goodUp?up:!up;
  return `<span class="delta ${good?'up':'dn'}">${up?'▲':'▼'}${Math.abs(d)}</span>`;
}

/* ---------------- the analytics ---------------- */
function analyse(j){
  const officersDue=j.totals.officers-1;                               /* the Collector is not counted */
  const present=j.today.present.length, onLeave=j.today.onLeave.length, absent=j.today.absent.length;
  const accounted=present+onLeave;
  const attPct=pct(accounted, Math.max(1,officersDue));
  const cov=j.coverage.reduce((s,c)=>({t:s.t+c.total,d:s.d+c.done}),{t:0,d:0});
  const covPct=pct(cov.d, cov.t);
  const dLeft=daysLeftInMonth();
  const needPerDay=Math.ceil(Math.max(0, cov.t-cov.d)/dLeft);
  const avg=j.month.avg;
  const prevAvg=j.trend.length>1 ? j.trend[j.trend.length-2].avg : null;
  const att7=j.att14.slice(-7).reduce((s,r)=>s+r.present+r.leave,0)/7;

  /* the composite: five parts, each 0–100, weighted and shown */
  const parts=[
    {k:'Attendance',  w:25, v:attPct,                                        why:accounted+' of '+officersDue+' accounted'},
    {k:'Coverage',    w:25, v:clamp(Math.round(covPct/Math.max(1,pct(new Date().getDate(), new Date().getDate()+dLeft-1))*100),0,100),
                      why:cov.d+' of '+cov.t+' against the days gone'},
    {k:'Scores',      w:30, v:avg==null?0:avg,                               why:avg==null?'nothing filed':'district average '+avg},
    {k:'Red flags',   w:10, v:clamp(100-j.month.rfCount*25,0,100),           why:j.month.rfCount+' flagged village'+(j.month.rfCount===1?'':'s')},
    {k:'Leave desk',  w:10, v:clamp(100-j.leave.pending.length*20,0,100),    why:j.leave.pending.length+' awaiting orders'}
  ];
  const health=Math.round(parts.reduce((s,p)=>s+p.v*p.w,0)/100);

  /* the issues feed: severity, what, where, and what to do about it */
  const iss=[];
  const hourNow=new Date().getHours();
  if(absent>0 && hourNow>=11){
    const byM={}; j.today.absent.forEach(o=>{ byM[o.mandal||'—']=(byM[o.mandal||'—']||0)+1; });
    const worst=Object.entries(byM).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([m,n])=>m+' ('+n+')').join(', ');
    iss.push({p:1, t:absent+' officer'+(absent>1?'s':'')+' not marked by '+hm(new Date().toISOString()),
      d:'Heaviest: '+worst+'.', a:'Have the MPDOs account for each by phone; unexplained absence goes on record.'});
  }
  j.month.rows.filter(r=>String(r.rf||'').trim()).forEach(r=>{
    iss.push({p:1, t:r.gp+' carries red flag '+r.rf+' — grade capped at D',
      d:'Score '+r.score+', filed by '+String(r.officer||'').replace(/\s*\(\d+\)$/,'')+' on '+dm(r.date)+'.',
      a:'Call for the photographic evidence and order rectification with a dated compliance report.'});
  });
  const dNoFlag=j.month.rows.filter(r=>r.grade==='D' && !String(r.rf||'').trim());
  if(dNoFlag.length) iss.push({p:2, t:dNoFlag.length+' village'+(dNoFlag.length>1?'s':'')+' at grade D without a red flag',
    d:dNoFlag.slice(0,4).map(r=>r.gp+' ('+r.score+')').join(', ')+(dNoFlag.length>4?'…':'')+'.',
    a:'Direct the mandal officers to a fortnightly re-visit; deficiencies to be carried into next month\u2019s G1.'});
  if(cov.d<cov.t && needPerDay>0){
    const sev=needPerDay>3?2:3;
    iss.push({p:sev, t:(cov.t-cov.d)+' villages still to evaluate · '+dLeft+' day'+(dLeft>1?'s':'')+' left',
      d:'The month closes at the present pace only if '+needPerDay+' evaluation'+(needPerDay>1?'s are':' is')+' filed each day.',
      a:'Set a per-mandal daily quota in the evening review; the coverage table below shows who is behind.'});
  }
  const oldPend=j.leave.pending.filter(l=>Date.now()-new Date(l.appliedAt).getTime()>48*3600e3);
  if(oldPend.length) iss.push({p:2, t:oldPend.length+' leave application'+(oldPend.length>1?'s':'')+' waiting beyond 48 hours',
    d:oldPend.slice(0,3).map(l=>l.name+' ('+l.type+' '+l.days+'d)').join(', ')+'.',
    a:'Pass orders today — days held against balances block fresh applications.'});
  const dups=j.today.present.filter(r=>(r.marks||1)>1);
  if(dups.length) iss.push({p:2, t:dups.length+' officer'+(dups.length>1?'s':'')+' marked attendance more than once today',
    d:dups.slice(0,4).map(r=>r.name+' ('+r.marks+'×)').join(', ')+(dups.length>4?'…':'')+'. One row stands per officer; the count is on record.',
    a:'Usually a second device or a re-login. A pattern on the same names each day warrants a word.'});
  const noFix=j.today.present.filter(r=>!r.verified);
  if(noFix.length) iss.push({p:3, t:noFix.length+' attendance mark'+(noFix.length>1?'s':'')+' without a location fix today',
    d:noFix.slice(0,4).map(r=>r.name).join(', ')+'.',
    a:'A pattern on the same names warrants a word; a one-off is usually weak signal.'});
  if(prevAvg!=null && avg!=null && avg<prevAvg-3)
    iss.push({p:3, t:'District average has slipped: '+prevAvg+' → '+avg,
      d:'Against last month, on '+j.month.rows.length+' filings so far.',
      a:'Read the bottom-five list before the next review; the slippage usually lives in two or three villages.'});
  iss.sort((a,b)=>a.p-b.p);
  return {health, parts, attPct, covPct, cov, dLeft, needPerDay, avg, prevAvg, att7, iss, accounted, officersDue, absent, present, onLeave};
}

/* ---------------- drawing ---------------- */
function gauge(v){
  const col=v>=80?'var(--green)':v>=60?'var(--amber)':'var(--red)';
  const C=2*Math.PI*54, f=C*clamp(v,0,100)/100;
  return `<svg viewBox="0 0 150 150" style="max-width:150px">
    <circle cx="75" cy="75" r="54" fill="none" stroke="var(--line-2)" stroke-width="13"/>
    <circle cx="75" cy="75" r="54" fill="none" stroke="${col}" stroke-width="13"
      stroke-dasharray="${f} ${C-f}" stroke-linecap="round" transform="rotate(-90 75 75)"/>
    <text x="75" y="72" text-anchor="middle" font-family="var(--mono)" font-size="34" font-weight="700" fill="var(--tx)">${v}</text>
    <text x="75" y="94" text-anchor="middle" class="axis" font-size="10">DISTRICT HEALTH</text></svg>`;
}
function bars14(rows){
  const W=560,H=150,P=26,n=rows.length,bw=Math.floor((W-P-8)/n)-4;
  const mx=Math.max(1,...rows.map(r=>r.present+r.leave));
  let g='';
  [0,.5,1].forEach(f=>{const y=H-18-(H-34)*f;
    g+=`<line class="gridln" x1="${P}" x2="${W-4}" y1="${y}" y2="${y}"/><text class="axis" x="${P-5}" y="${y+3}" text-anchor="end">${Math.round(mx*f)}</text>`;});
  rows.forEach((r,i)=>{const x=P+6+i*(bw+4);
    const hp=(H-34)*r.present/mx, hl=(H-34)*r.leave/mx;
    g+=`<rect x="${x}" y="${H-18-hp}" width="${bw}" height="${hp}" fill="#2E8540" rx="1.5" opacity=".85"/>`;
    if(r.leave) g+=`<rect x="${x}" y="${H-18-hp-hl}" width="${bw}" height="${hl}" fill="#E0A93F" rx="1.5"/>`;
    if(i%2===0) g+=`<text class="axis" x="${x+bw/2}" y="${H-5}" text-anchor="middle">${r.date.slice(8)}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function line6(rows){
  const W=560,H=150,P=26;
  if(!rows.length) return '<div class="empty">No months on record yet.</div>';
  let g=''; [0,50,100].forEach(v=>{const y=H-18-(H-34)*v/100;
    g+=`<line class="gridln" x1="${P}" x2="${W-4}" y1="${y}" y2="${y}"/><text class="axis" x="${P-5}" y="${y+3}" text-anchor="end">${v}</text>`;});
  const step=(W-P-16)/Math.max(1,rows.length-1);
  const pt=rows.map((r,i)=>[P+8+i*step, H-18-(H-34)*Math.min(100,r.avg)/100]);
  if(pt.length>1) g+=`<polyline fill="none" stroke="#1B67C1" stroke-width="2.2" points="${pt.map(p=>p.join(',')).join(' ')}"/>`;
  pt.forEach((p,i)=>{g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.6" fill="#1B67C1"/>
    <text class="axis" x="${p[0]}" y="${p[1]-8}" text-anchor="middle" fill="var(--tx)">${rows[i].avg}</text>
    <text class="axis" x="${p[0]}" y="${H-5}" text-anchor="middle">${rows[i].ym.slice(5)}/${rows[i].ym.slice(2,4)}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function donutG(g){
  const total=g.A+g.B+g.C+g.D;
  if(!total) return '<div class="empty">Nothing graded yet this month.</div>';
  const C=['#2E8540','#5E9732','#E0A93F','#C23934'],K=['A','B','C','D'];
  let a0=-90,seg='';
  K.forEach((k,i)=>{const f=g[k]/total; if(!f) return;
    const a1=a0+f*360,big=f>.5?1:0;
    const p=a=>[70+52*Math.cos(a*Math.PI/180),78+52*Math.sin(a*Math.PI/180)];
    const [x0,y0]=p(a0),[x1,y1]=p(a1);
    seg+= f===1?`<circle cx="70" cy="78" r="52" fill="none" stroke="${C[i]}" stroke-width="16"/>`
      :`<path d="M ${x0} ${y0} A 52 52 0 ${big} 1 ${x1} ${y1}" fill="none" stroke="${C[i]}" stroke-width="16"/>`;
    a0=a1;});
  const leg=K.map((k,i)=>`<tspan x="150" dy="${i?18:0}" fill="${C[i]}">●</tspan><tspan dx="6" fill="var(--tx)">${k}</tspan><tspan dx="8" fill="var(--tx-2)">${g[k]}</tspan>`).join('');
  return `<svg viewBox="0 0 300 150"><g>${seg}</g>
    <text x="70" y="83" text-anchor="middle" font-family="var(--mono)" font-size="19" font-weight="700" fill="var(--tx)">${total}</text>
    <text class="axis" y="55" font-size="12">${leg}</text></svg>`;
}

function stat(span,title,val,cls,sub,dlt){
  return `<div class="panel stat ${span}"><div class="hd">${title}</div>
    <div class="bd"><div class="v ${cls||''}">${val}${dlt||''}</div><div class="s">${sub||''}</div></div></div>`;
}
function panel(span,title,right,body){
  return `<div class="panel ${span}"><div class="hd">${title}<span class="r">${right||''}</span></div><div class="bd">${body}</div></div>`;
}

function render(j){
  const A=analyse(j);
  let h='';

  /* row 1: health · issues · pace */
  h+=panel('c4','District health · '+j.ym,'weighted of five parts',
    `<div class="healthwrap">${gauge(A.health)}<div class="hcomp">`+
    A.parts.map(p=>{const col=p.v>=80?'var(--green)':p.v>=60?'var(--amber)':'var(--red)';
      return `<div class="hrow"><b>${p.k} <span style="color:var(--tx-3);font-weight:400">·${p.w}%</span></b>
        <div class="hbar"><i style="width:${clamp(p.v,0,100)}%;background:${col}"></i></div>
        <span class="n">${p.v}</span></div>
        <div style="font-size:11px;color:var(--tx-3);margin:-4px 0 4px 127px">${esc(p.why)}</div>`;}).join('')+
    `</div></div>`);

  h+=panel('c5','Needs your attention', A.iss.length+' item'+(A.iss.length===1?'':'s'),
    A.iss.length ? `<div style="max-height:262px;overflow:auto">`+A.iss.map(x=>
      `<div class="iss"><span class="sev p${x.p}">P${x.p}</span><div class="t"><b>${esc(x.t)}</b>
       <span>${esc(x.d)}</span><span class="act">${esc(x.a)}</span></div></div>`).join('')+`</div>`
    : '<div class="allclear">All clear — nothing needs orders right now.</div>');

  h+=panel('c3','Month pace', A.dLeft+' day'+(A.dLeft>1?'s':'')+' left',
    `<div style="padding:6px 0 2px">
      <div class="hrow"><b>Covered</b><div class="hbar"><i style="width:${A.covPct}%;background:${A.covPct>=70?'var(--green)':A.covPct>=40?'var(--amber)':'var(--red)'}"></i></div><span class="n">${A.covPct}%</span></div>
      <div style="font-family:var(--mono);font-size:30px;font-weight:700;margin:12px 0 2px">${A.needPerDay}<span style="font-size:13px;color:var(--tx-3);font-weight:400"> / day</span></div>
      <div style="font-size:12px;color:var(--tx-2)">evaluations needed each remaining day to close the month at 100% — ${A.cov.t-A.cov.d} villages outstanding.</div>
    </div>`);

  /* row 2: the tiles, with deltas where a prior period exists */
  h+=stat('c2','Present today', A.present, 'g', A.accounted+' of '+A.officersDue+' accounted');
  h+=stat('c2','On sanctioned leave', A.onLeave, A.onLeave?'a':'', 'today');
  h+=stat('c2','Not marked', A.absent, A.absent?'rd':'g', 'as of now');
  h+=stat('c2','GPs reported', j.month.rows.length, 'bl', 'of '+j.totals.gps+' · '+j.ym);
  h+=stat('c2','District average', A.avg==null?'—':A.avg, A.avg>=70?'g':A.avg>=55?'a':'rd',
    A.prevAvg!=null?'last month '+A.prevAvg:'SJ-SCORE this month', delta(A.avg, A.prevAvg, true));
  h+=stat('c2','Red flags', j.month.rfCount, j.month.rfCount?'rd':'g', 'villages this month');

  /* row 3: charts */
  h+=panel('c6','Attendance · last 14 days','<span style="color:#2E8540">■</span> present&nbsp;&nbsp;<span style="color:#E0A93F">■</span> leave · 7-day mean '+Math.round(A.att7), bars14(j.att14));
  h+=panel('c3','Score trend','district average', line6(j.trend));
  h+=panel('c3','Grades this month', j.ym, donutG(j.month.grades));

  /* row 4: worst five + attendance */
  const worst=[...j.month.rows].sort((a,b)=>a.score-b.score).slice(0,5);
  h+=panel('c4','Bottom five villages','call these out first',
    `<div class="twrap"><table><thead><tr><th>Village</th><th>Score</th><th>Grade</th><th>Flags</th></tr></thead><tbody>`+
    (worst.length?worst.map(r=>`<tr><td>${esc(r.gp)}<span class="mut"> · ${esc(r.mandal)}</span></td>
      <td class="num">${r.score}</td><td class="gr gr${esc(r.grade)}">${esc(r.grade)}</td>
      <td>${String(r.rf||'').trim()?'<span class="pill bad">RF '+esc(r.rf)+'</span>':'<span class="pill mut">—</span>'}</td></tr>`).join('')
      :'<tr><td colspan="4" class="empty">Nothing filed yet.</td></tr>')+`</tbody></table></div>`);

  const attRows=[...j.today.present.map(r=>({...r,_s:'P'})),...j.today.onLeave.map(r=>({...r,_s:'L'})),...j.today.absent.map(r=>({...r,_s:'A'}))];
  h+=panel('c8','Attendance today · officer by officer', A.present+' present · '+A.onLeave+' leave · '+A.absent+' not marked',
    `<div class="twrap"><table><thead><tr><th>Officer</th><th>Role</th><th>Mandal</th><th>Time</th><th>Location</th><th>Status</th></tr></thead><tbody>`+
    (attRows.length?attRows.map(r=>`<tr><td>${esc(r.name)}</td><td class="mut">${esc(r.role)}</td><td class="mut">${esc(r.mandal)}</td>`+
      `<td class="num">${r._s==='P'?esc(hm(r.at)):'—'}</td>`+
      `<td>${r._s==='P'?(r.verified?'<span class="pill ok">verified</span>':'<span class="pill warn">no fix</span>')+((r.marks||1)>1?' <span class="pill bad">'+r.marks+'×</span>':''):'—'}</td>`+
      `<td>${r._s==='P'?'<span class="pill ok">present</span>':r._s==='L'?'<span class="pill warn">'+esc(r.leaveType||'leave')+'</span>':'<span class="pill bad">not marked</span>'}</td></tr>`).join('')
      :'<tr><td colspan="6" class="empty">No officer yet today.</td></tr>')+`</tbody></table></div>`);

  /* row 5: coverage league + leave + full filings */
  h+=panel('c4','Coverage · mandal league', A.cov.d+' of '+A.cov.t+' villages',
    `<div class="twrap"><table><thead><tr><th>Mandal</th><th>Done</th><th style="width:42%">Progress</th><th>%</th></tr></thead><tbody>`+
    [...j.coverage].sort((a,b)=>pct(a.done,a.total)-pct(b.done,b.total)).map(c=>{const p2=pct(c.done,c.total);
      return `<tr><td>${esc(c.mandal)}</td><td class="num">${c.done}/${c.total}</td>
      <td><div class="bar"><i style="width:${p2}%;background:${p2>=100?'var(--green)':p2>=50?'#5E9732':'var(--amber)'}"></i></div></td>
      <td class="num mut">${p2}%</td></tr>`;}).join('')+`</tbody></table></div>`);

  const lp=j.leave.pending, lr=j.leave.recent.filter(r=>r.status!=='PENDING');
  h+=panel('c4','Leave register', lp.length+' awaiting orders',
    `<div class="twrap"><table><thead><tr><th>Officer</th><th>Kind</th><th>Days</th><th>From</th><th>Status</th></tr></thead><tbody>`+
    (lp.length+lr.length? lp.map(lvRow).join('')+lr.slice(0,14).map(lvRow).join('')
      :'<tr><td colspan="5" class="empty">No application on record.</td></tr>')+`</tbody></table></div>`);

  const mr=[...j.month.rows].sort((a,b)=>a.score-b.score);
  h+=panel('c4','Inspections filed · '+j.ym, j.month.rows.length+' villages',
    `<div class="twrap"><table><thead><tr><th>Village</th><th>Score</th><th>Officer</th><th>Date</th></tr></thead><tbody>`+
    (mr.length?mr.map(r=>`<tr><td>${esc(r.gp)}<span class="mut"> · ${esc(r.mandal)}</span></td><td class="num">${r.score} <span class="gr gr${esc(r.grade)}">${esc(r.grade)}</span></td>`+
      `<td class="mut">${esc(String(r.officer||'').replace(/\s*\(\d+\)$/,''))}</td><td class="num mut">${esc(dm(r.date))}</td></tr>`).join('')
      :'<tr><td colspan="4" class="empty">Nothing filed yet this month.</td></tr>')+`</tbody></table></div>`);

  $('#g').innerHTML=h;
  $('#live').className='live'; $('#liveTx').textContent='updated now';
}
function lvRow(r){
  const st=r.status==='PENDING'?'<span class="pill warn">waiting</span>'
    :r.status==='APPROVED'?'<span class="pill ok">sanctioned</span>'
    :r.status==='REJECTED'?'<span class="pill bad">refused</span>':'<span class="pill mut">withdrawn</span>';
  return `<tr><td>${esc(r.name)}<span class="mut"> · ${esc(r.mandal)}</span></td><td class="num">${esc(r.type)}</td>`+
    `<td class="num">${r.days}</td><td class="num mut">${esc(dm(r.from))}</td><td>${st}</td></tr>`;
}
boot();
</script>
</body>
</html>
