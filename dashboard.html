<style>/* Leaflet 1.9.4 (BSD-2-Clause, (c) Vladimir Agafonkin) — inlined, because a district
   network that blocks outside scripts was taking the whole map with it */
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;
	}
.leaflet-touch .leaflet-bar a:last-child {
	border-bottom-left-radius: 2px;
	border-bottom-right-radius: 2px;
	}

/* zoom control */

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {
	font: bold 18px 'Lucida Console', Monaco, monospace;

	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}


/* layers control */

.leaflet-control-layers {
	box-shadow: 0 1px 5px rgba(0,0,0,0.4);
	background: #fff;
	border-radius: 5px;
	}
.leaflet-control-layers-toggle {

.leaflet-retina .leaflet-control-layers-toggle {

	}
.leaflet-touch .leaflet-control-layers-toggle {

.leaflet-control-layers .leaflet-control-layers-list,

	}
.leaflet-control-layers-expanded .leaflet-control-layers-list {

	}

	font-size: 1.08333em;
	}
.leaflet-control-layers-separator {
	height: 0;
	border-top: 1px solid #ddd;
	margin: 5px -10px 5px -6px;
	}

/* Default icon URLs */

	background-image: url(images/marker-icon.png);
	}


/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;
	background: rgba(255, 255, 255, 0.8);

	}
.leaflet-control-attribution,
.leaflet-control-scale-line {
	padding: 0 5px;

.leaflet-control-scale-line:not(:first-child) {

.leaflet-control-scale-line:not(:first-child):not(:last-child) {

.leaflet-popup {

	}
.leaflet-popup-content-wrapper {

	-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";
	filter: progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678);

.leaflet-oldie .leaflet-control-zoom,

/* div icon */

.leaflet-div-icon {

/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;

/* Directions */

.leaflet-tooltip-bottom {

}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {

	margin-left: -6px;
	}
.leaflet-tooltip-top:before {

.leaflet-tooltip-bottom:before {

.leaflet-tooltip-left {

}
.leaflet-tooltip-right {

}
.leaflet-tooltip-left:before,

@media print {

		print-color-adjust: exact;

<style>
/* ============================================================
   SJGP DISTRICT OPERATIONS CENTER · Collectorate, Jangaon
   White rail · KPI deltas · list-beside-live-map · one big
   area chart · donuts · dense numbers. Leaflet + OSM for the
   map: the console is online-only by definition, so real tiles
   are honest here (the field app stays dependency-free).
   ============================================================ */
:root{
  /* -------- 8px spacing grid -------- */
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:40px; --s6:48px;
  /* -------- neo multi-accent ground: white cards on cool paper --------
     The soft-UI embossing is retired. Cards are white with a crisp 1px
     ring and a light drop; wells are flat recesses. The old --nm-* names
     are KEPT and redefined, so every component that wore the embossing
     wears the ring instead without touching each rule. */
  --bg:#EEF1F7; --panel:#FFFFFF; --well:#F3F5FA; --line:#DFE3EE; --line-2:#E9EDF4;
  --nm-out:0 0 0 1px var(--line), 0 8px 22px rgba(30,41,70,.07);
  --nm-out-sm:0 0 0 1px var(--line), 0 2px 6px rgba(30,41,70,.06);
  --nm-in:inset 0 0 0 1px var(--line);
  --nm-in-sm:inset 0 0 0 1px var(--line-2);
  /* -------- ink: AA on this ground (contrast noted) -------- */
  --tx:#1A2437;      /* 13.9:1 on white */
  --tx-2:#46536B;    /* 6.9:1  */
  --tx-3:#57647D;    /* 5.0:1 — smallest text never lighter than this */
  /* -------- accents: the district's indigo leads, teal seconds it,
     and each view of the console carries its own accent colour -------- */
  --pri:#4A40CE; --pri-strong:#3A32A5; --pri-2:#E7E5F9;
  --teal:#0F766E; --teal-2:#D8EEEB;
  --blue:#1D4ED8; --blue-2:#DEE8FB; --seal:#14532D;
  --green:#15803D; --green-2:#DCEFE2; --amber:#B45309; --amber-2:#F6E8D2;
  --red:#B91C1C; --red-2:#F7DFDF; --gold:#8A6508; --violet:#6D28D9; --violet-2:#EAE2F8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --sh:var(--nm-out-sm); --r:14px;
  /* -------- surfaces that used to be written as literal hex --------
     Every one of these was a hardcoded colour somewhere below. They are
     tokens now for one reason: a hardcoded #F8FAFC is invisible on a dark
     card, and nobody notices until the console is opened in a dark room
     in front of the district. */
  --row-hover:#F8FAFC; --row-hover-2:#E9EDF6; --chat-a:#F1F4F8; --chat-err-line:#F0C6C6;
  --pill-ok-ink:#14532D; --pill-warn-ink:#7C3E06; --pill-bad-ink:#8F1D1D; --pill-info-ink:#1E3A8A;
  --grade-b:#65A30D;
  --scrim:rgba(23,35,59,.38); --shine:rgba(255,255,255,.55);
  --drawer-sh:-14px 0 34px rgba(100,116,139,.4);
  --grad-a:#4A40CE; --grad-b:#0F766E;

  /* ================= CHART SYSTEM =================
     Series colours are TOKENS, never literals, so the theme toggle recolours
     every chart without a re-render — and so an SVG can pick them up through
     style="" (a presentation attribute cannot resolve a var()).

     WHY THEY ARE NAMED --cs*, NOT --s*. The reference implementation calls
     them --s1…--s8; in this console --s1…--s6 have meant the 8px spacing
     grid since the first screen was drawn. Taking those names would have
     silently rewritten every margin in the building.

     THE PALETTE WAS COMPUTED, NOT CHOSEN. The obvious move — build the
     series from the district's own accents — was tried first and FAILED the
     validator on three counts: the house teal #0F766E and cyan #0E7490 fall
     under the chroma floor and render grey, and the house red and amber sit
     ΔE 9.1 apart for NORMAL vision, well under the floor of 15. Two of the
     five figures on the attendance screen would have been a colour most
     readers cannot separate. The full run is in prompt/palette-validation.txt.
     Slot order is fixed and never cycled: violet sits between amber and red
     because that adjacency is what the colourblind check measures. */
  --ch-ink:#1A2437; --ch-muted:#57647D; --ch-grid:#E9EDF4; --ch-axis:#DFE3EE;
  --ch-surface:#FFFFFF;
  --cs1:#4f5ce5; --cs2:#0ca38a; --cs3:#e8a020; --cs4:#8b5cf6;
  --cs5:#d13438; --cs6:#2aa7d8; --cs7:#7c8a12; --cs8:#a62b52;
  /* ordinal: ONE hue, least → most. Ordered bands (hours of the morning,
     ten-mark score bands) are one axis, not eight identities. */
  --co1:#a3aaf1; --co2:#8b93ee; --co3:#6f7ae9; --co4:#5462d8; --co5:#3a46c4;
  /* reserved. These mean good / warning / bad and are never series 4. */
  --st-ok:#15803D; --st-warn:#B45309; --st-bad:#B91C1C; --st-idle:#8E97AE;
}

/* ================= DARK: A SECOND PALETTE, NOT AN INVERSION =================
   Every series step below was validated against THIS card (#171B2D), not
   flipped from the light set — the light steps measure outside the dark
   lightness band. The ordinal ramp inverts with the surface: on a dark card
   the least value is the darkest step. */
body.dark{
  --bg:#0E1120; --panel:#171B2D; --well:#1E2338; --line:#2B3149; --line-2:#242A3F;
  --nm-out:0 0 0 1px var(--line), 0 8px 22px rgba(0,0,0,.45);
  --nm-out-sm:0 0 0 1px var(--line), 0 2px 6px rgba(0,0,0,.35);
  --tx:#E6E9F2; --tx-2:#B3BACD; --tx-3:#8E97AE;
  --pri:#9AA0F5; --pri-strong:#B4B8F9; --pri-2:#232748;
  --teal:#3EC5AC; --teal-2:#10352F;
  --blue:#89A9F7; --blue-2:#16244A; --seal:#7FD4A0;
  --green:#5BD68A; --green-2:#123726; --amber:#E9A93C; --amber-2:#3A2A10;
  --red:#F1737A; --red-2:#3B1A1E; --gold:#D9B25C; --violet:#A98BF2; --violet-2:#271B44;
  --row-hover:#1E2338; --row-hover-2:#262C42; --chat-a:#1E2338; --chat-err-line:#5A2A2E;
  --pill-ok-ink:#A7F3C6; --pill-warn-ink:#F5CE8E; --pill-bad-ink:#FBB6BA; --pill-info-ink:#B9CDFA;
  --grade-b:#9BCB3A;
  --scrim:rgba(3,6,16,.62); --shine:rgba(255,255,255,.06);
  --drawer-sh:-14px 0 34px rgba(0,0,0,.55);
  --grad-a:#6B78EA; --grad-b:#17A98F;
  --ch-ink:#E6E9F2; --ch-muted:#9AA1B8; --ch-grid:#242A3F; --ch-axis:#2F3654;
  --ch-surface:#171B2D;
  --cs1:#6b78ea; --cs2:#17a98f; --cs3:#bf8718; --cs4:#8f6ff0;
  --cs5:#d9484c; --cs6:#2f9fce; --cs7:#8a9a20; --cs8:#b8446a;
  --co1:#3a46c4; --co2:#5866e0; --co3:#7b87ec; --co4:#a0a9f3; --co5:#c3c9f9;
  --st-ok:#5BD68A; --st-warn:#E9A93C; --st-bad:#F1737A; --st-idle:#8B93AB;
}
body.dark .msg.q{color:#0E1120}
/* The tiles come from OpenStreetMap and are drawn light. Dimming them keeps
   the map from glaring out of a dark console; the pins are drawn by us and
   are deliberately left at full strength on top. */
body.dark .leaflet-tile-pane{filter:brightness(.72) contrast(1.06) saturate(.85)}
/* one focus language everywhere: visible ring, never removed */
:focus{outline:none}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--tx);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{background:var(--panel);border-right:1px solid var(--line);box-shadow:none;padding:var(--s3) var(--s2);position:sticky;top:0;height:100vh}
.rail .brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px;border-bottom:1px solid var(--line-2);margin-bottom:14px}
.rail .brand img{width:38px;height:38px;border-radius:10px}
.rail .brand b{font-size:16px;letter-spacing:-.01em}
.rail .brand span{display:block;font-size:10.5px;color:var(--tx-3)}
.nav button{display:flex;align-items:center;gap:var(--s1);width:100%;min-height:48px;padding:0 var(--s2);border-radius:14px;
  font-size:13.5px;font-weight:650;color:var(--tx-2);margin-bottom:var(--s1)}
.nav button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current]{background:var(--pri-2);color:var(--pri);font-weight:750}
.nav button:hover:not([aria-current]){background:var(--well)}
/* each view answers in its own colour — the accent follows you around */
.nav [data-v="attendance"][aria-current]{background:var(--teal-2);color:var(--teal)}
.nav [data-v="villages"][aria-current]{background:var(--violet-2);color:var(--violet)}
.nav [data-v="leave"][aria-current]{background:var(--amber-2);color:var(--amber)}
.nav [data-v="notices"][aria-current]{background:var(--red-2);color:var(--red)}
.nav [data-v="map"][aria-current]{background:var(--blue-2);color:var(--blue)}
.nav [data-v="gpdp"][aria-current]{background:var(--teal-2);color:var(--teal)}
.nav [data-v="advisory"][aria-current]{background:var(--amber-2);color:var(--gold)}
.railfoot{position:absolute;left:14px;right:14px;bottom:16px;font-size:11px;color:var(--tx-3);line-height:1.6}

/* ---------- top ---------- */
.main{min-width:0;padding:0 26px 44px}
.top{display:flex;align-items:center;gap:14px;padding:18px 0 14px;position:sticky;top:0;background:var(--bg);z-index:8;flex-wrap:wrap}
.top>div:first-child{flex:1 1 210px;min-width:0}
@media(max-width:760px){.top{gap:9px}.top .sp{display:none}.top .rsel,.top .tbtn{min-height:40px;padding:0 12px}}
.top h1{font-size:21px;letter-spacing:-.015em}
.top .sub{font-size:12.5px;color:var(--tx-3)}
.top .sp{flex:1}
.live{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;color:var(--tx-2)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--green)}
.live.stale i{background:var(--amber)} .live.down i{background:var(--red)}
.rsel,.tbtn{background:var(--panel);border:0;border-radius:12px;min-height:44px;padding:0 var(--s2);font-size:13px;color:var(--tx-2);box-shadow:var(--nm-out-sm)}
.rsel:active,.tbtn:active{box-shadow:var(--nm-in-sm)}
/* the one indigo→teal gradient this screen is allowed */
.tbtn.pri{background:linear-gradient(135deg,var(--grad-a),var(--grad-b));color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(74,64,206,.3)}
.rsel:hover,.tbtn:hover{color:var(--tx)} .tbtn.pri:hover{color:#fff;filter:brightness(1.06)}

/* ---------- grid & panels ---------- */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--s3)}
.panel{background:var(--panel);border:0;border-top:3px solid var(--acc,var(--pri));border-radius:var(--r);box-shadow:var(--nm-out);min-width:0}
#g[data-view="attendance"] .panel{--acc:var(--teal)}
#g[data-view="villages"] .panel{--acc:var(--violet)}
#g[data-view="leave"] .panel{--acc:var(--amber)}
#g[data-view="notices"] .panel{--acc:var(--red)}
#g[data-view="map"] .panel{--acc:var(--blue)}
#g[data-view="gpdp"] .panel{--acc:var(--teal)}
#g[data-view="advisory"] .panel{--acc:var(--gold)}
.panel .hd{display:flex;align-items:center;gap:var(--s1);padding:var(--s2) var(--s2) var(--s1);font-size:14px;font-weight:750;letter-spacing:-.01em}
.panel .hd .r{margin-left:auto;font-size:11.5px;font-weight:500;color:var(--tx-3);font-family:var(--mono)}
.panel .bd{padding:var(--s1) var(--s2) var(--s2)}

/* KPI cards */
.kpi{background:var(--panel);border:0;border-radius:var(--r);box-shadow:var(--nm-out);padding:var(--s2);position:relative;min-height:112px}
.kpi .hd{font-size:12.5px;font-weight:650;color:var(--tx-2);display:flex;align-items:center;gap:8px}
.kpi .ic{margin-left:auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--pri-2)}
.kpi .ic svg{width:18px;height:18px;fill:none;stroke:var(--pri);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.kpirow{gap:var(--s3)}
/* the KPI row wears the whole accent family — a tinted chip per card */
.kpirow .kpi:nth-child(2) .ic{background:var(--red-2)} .kpirow .kpi:nth-child(2) .ic svg{stroke:var(--red)}
.kpirow .kpi:nth-child(3) .ic{background:var(--teal-2)} .kpirow .kpi:nth-child(3) .ic svg{stroke:var(--teal)}
.kpirow .kpi:nth-child(4) .ic{background:var(--violet-2)} .kpirow .kpi:nth-child(4) .ic svg{stroke:var(--violet)}
.kpirow .kpi:nth-child(5) .ic{background:var(--amber-2)} .kpirow .kpi:nth-child(5) .ic svg{stroke:var(--amber)}
.kpi .v{font-family:var(--mono);font-size:29px;font-weight:750;margin-top:7px;letter-spacing:-.01em}
.kpi .foot{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:11.5px;color:var(--tx-3)}
.kpi.tapk{cursor:pointer} .kpi.tapk:hover{box-shadow:var(--nm-out),0 0 0 2px var(--pri-2)}
.kpi.tapk:active{box-shadow:var(--nm-in)}
.delta{font-family:var(--mono);font-size:11.5px;font-weight:750;padding:1px 7px;border-radius:8px}
.delta.up{color:var(--green);background:var(--green-2)} .delta.dn{color:var(--red);background:var(--red-2)}
.delta.fl{color:var(--tx-3);background:var(--line-2)}

/* list beside map */
.marks{max-height:372px;overflow:auto;padding:var(--s1);border-radius:14px;box-shadow:var(--nm-in-sm)}
.mk{display:flex;gap:var(--s1);align-items:center;border:0;border-radius:14px;min-height:56px;padding:var(--s1) var(--s2);margin-bottom:var(--s1);cursor:pointer;background:var(--panel);box-shadow:var(--nm-out-sm)}
.mk:hover{box-shadow:var(--nm-out-sm),0 0 0 2px var(--pri-2)} .mk:active{box-shadow:var(--nm-in-sm)}
.mk .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:750;font-size:13px;flex:none;
  background:var(--green-2);color:var(--green)}
.mk.nofix .av{background:var(--amber-2);color:var(--amber)}
.mk b{display:block;font-size:13px}
.mk span{display:block;font-size:11.5px;color:var(--tx-3)}
.mk .t{margin-left:auto;text-align:right;font-family:var(--mono);font-size:12px;color:var(--tx-2);flex:none}
#map{height:372px;border-radius:14px;border:0;box-shadow:var(--nm-in-sm)}
#map2{height:calc(100vh - 210px);min-height:430px;border-radius:14px;border:0;box-shadow:var(--nm-in-sm)}
.leaflet-container{font:11px var(--sans)}

/* charts */
svg{display:block;width:100%}
/* …but never Leaflet's own overlay SVG: stretched to 100%, its coordinate
   space tears away from the map and every pin lands outside the visible
   pane — which is why the map sat pinless while the layer held them all */
.leaflet-container svg{width:auto}
.axis{font-family:var(--mono);font-size:10.5px;fill:var(--tx-3)}
.gridln{stroke:var(--line-2);stroke-width:1}
.mtabs{display:flex;gap:20px;padding:2px 0 8px;border-bottom:1px solid var(--line-2);margin-bottom:8px}
.mtab{min-height:44px;padding:var(--s1) var(--s1) var(--s1) var(--s1);font-size:12.5px;color:var(--tx-3);border-bottom:3px solid transparent;margin-bottom:-9px;border-radius:10px 10px 0 0}
.mtab b{display:block;font-family:var(--mono);font-size:19px;color:var(--tx);font-weight:750}
.mtab[aria-selected=true]{border-color:var(--pri)} .mtab[aria-selected=true] b{color:var(--pri)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:10.5px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--tx-2);
  text-align:center;padding:8px 10px;border:1px solid var(--line);position:sticky;top:0;background:var(--well);z-index:1}
th:first-child{text-align:left}
td{padding:7.5px 10px;border:1px solid var(--line-2);white-space:nowrap;text-align:center}
td:first-child{text-align:left}
td.mut{color:var(--tx-2)} td.num{font-family:var(--mono);text-align:center}
tr[data-di]{cursor:pointer} tr:hover td{background:var(--row-hover)}
.twrap{overflow:auto;max-height:352px;border-radius:14px;box-shadow:var(--nm-in-sm);background:var(--well)}
th{background:var(--well)}
tr[data-di]:hover td,tr[data-md]:hover td,tr[data-dd]:hover td{background:var(--row-hover-2)}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;padding:1.5px 8px;border-radius:9px}
/* pill ink darkened for AA on tinted grounds */
.pill{box-shadow:var(--nm-in-sm)}
.pill.ok{color:var(--pill-ok-ink);background:var(--green-2)} .pill.warn{color:var(--pill-warn-ink);background:var(--amber-2)}
.pill.bad{color:var(--pill-bad-ink);background:var(--red-2)} .pill.mut{color:var(--tx-2);background:var(--line-2)}
.bar{height:7px;border-radius:4px;background:var(--line-2);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%}
.gr{font-family:var(--mono);font-weight:750}
.grA{color:var(--green)} .grB{color:var(--grade-b)} .grC{color:var(--amber)} .grD{color:var(--red)}
/* -------- EMPTY state: an inset well that says what absence means -------- */
.empty{margin:var(--s1);padding:var(--s4) var(--s2);color:var(--tx-2);font-size:13px;text-align:center;
  border-radius:14px;box-shadow:var(--nm-in-sm);background:var(--well)}
.empty::before{content:'\2014  ';color:var(--tx-3)}
.empty::after{content:'  \2014';color:var(--tx-3)}
.find{width:100%;max-width:280px;border:0;border-radius:12px;min-height:44px;padding:0 var(--s2);font:13px var(--sans);color:var(--tx);background:var(--well);box-shadow:var(--nm-in-sm)}
.find::placeholder{color:var(--tx-3)}

/* issues */
.iss{display:flex;gap:var(--s1);min-height:48px;padding:var(--s1);border-bottom:1px solid var(--line-2);cursor:pointer;border-radius:10px}
.iss:hover{background:var(--well)}
.iss:last-child{border-bottom:0}
.sev{flex:none;font-family:var(--mono);font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 7px;height:fit-content;margin-top:2px}
.sev{min-width:44px;text-align:center;box-shadow:var(--nm-in-sm)}
.sev.p1{background:var(--red-2);color:var(--pill-bad-ink)} .sev.p2{background:var(--amber-2);color:var(--pill-warn-ink)} .sev.p3{background:var(--blue-2);color:var(--pill-info-ink)}
.iss b{display:block;font-size:13px;font-weight:650}
.iss span{display:block;font-size:12px;color:var(--tx-2);margin-top:2px;line-height:1.5}
.iss .act{color:var(--seal);font-weight:600} .iss .act::before{content:"→ ";color:var(--gold)}
.allclear{padding:20px;text-align:center;color:var(--green);font-weight:650}

/* what's new */
.newsbar{background:var(--panel);border:0;border-left:6px solid var(--pri);border-radius:14px;
  padding:var(--s2);display:flex;gap:var(--s1);align-items:center;flex-wrap:wrap;box-shadow:var(--nm-out)}
.newsbar>b{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--tx-3)}
.newspill{font-size:12.5px;background:var(--blue-2);color:var(--blue);border-radius:9px;padding:5px 11px;font-weight:650}
.newspill.leave{background:var(--amber-2);color:var(--amber)}
.newspill i{font-style:normal;font-weight:400;color:var(--tx-2);margin-left:7px}
/* map tools */
.mtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 0 10px}
.mtools .msp{flex:1}
.fchip{border:0;border-radius:12px;min-height:44px;padding:0 var(--s2);font-size:12.5px;color:var(--tx-2);background:var(--panel);box-shadow:var(--nm-out-sm)}
.fchip b{font-family:var(--mono);color:var(--tx)}
.fchip[aria-pressed=true]{box-shadow:var(--nm-in-sm);background:var(--pri-2);color:var(--pri);font-weight:700}
.fchip:hover{color:var(--tx)}
/* export bar */
.expbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.expbar .tbtn{min-height:40px}
.expnote{font-size:12px;color:var(--tx-3)}

/* the ask desk */
.chat{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.chatlog{max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:2px 2px 6px}
.msg{max-width:88%;padding:9px 13px;border-radius:14px;font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.msg.q{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--chat-a);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.err{align-self:flex-start;background:var(--red-2);border:1px solid var(--chat-err-line);color:var(--pill-bad-ink);border-bottom-left-radius:4px}
.msg.wait{align-self:flex-start;background:transparent;color:var(--tx-3);padding:2px 4px}
.askrow{display:flex;gap:8px;margin-top:10px}
.askrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font:inherit;font-size:13.5px;background:var(--panel);color:var(--tx)}
.askrow input:focus{outline:2px solid var(--seal);outline-offset:1px}
.askrow input:disabled{opacity:.6}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}

/* briefing */
.brief{font-size:13.5px;line-height:1.7;white-space:pre-wrap;max-height:330px;overflow:auto}
.brief b{display:block;margin:12px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx-3)}
.briefbar{display:flex;gap:9px;align-items:center;padding-bottom:9px;flex-wrap:wrap}
/* drawer */
#drawer{position:fixed;inset:0;z-index:60}
#drawer .scrim{position:absolute;inset:0;background:var(--scrim)}
#drawer .sheet{position:absolute;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--panel);
  padding:var(--s3);overflow:auto;box-shadow:var(--drawer-sh)}
#drawer h2{font-size:17px;margin-bottom:3px} #drawer .sub{color:var(--tx-3);font-size:12.5px;margin-bottom:13px}
#drawer dl{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13px}
#drawer dt{color:var(--tx-3)} #drawer dd{font-weight:600;word-break:break-word}
#drawer .x{position:absolute;right:var(--s1);top:var(--s1);font-size:22px;color:var(--tx-2);min-width:44px;min-height:44px;border-radius:12px;box-shadow:var(--nm-out-sm)}
#drawer .x:active{box-shadow:var(--nm-in-sm)}
#drawer ul{margin:8px 0 0 18px;font-size:13px;line-height:1.75}
#drawer .dsec{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx-3)}
#drawer table td{padding:5.5px 8px;cursor:pointer}
#drawer .mapsbtn{display:inline-block;margin-top:14px;border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:13px}

.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}
.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
.kpirow{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;grid-column:span 12}
@media(max-width:1180px){.kpirow{grid-template-columns:repeat(3,1fr)}.c3,.c4,.c5{grid-column:span 6}.c6,.c7,.c8,.c9{grid-column:span 12}}
@media(max-width:760px){.shell{grid-template-columns:1fr}.rail{position:static;height:auto}.kpirow{grid-template-columns:repeat(2,1fr)}.c3,.c4,.c5,.c6{grid-column:span 12}
  /* the rail no longer scrolls with the page here, so its footer must live
     in the flow — absolutely positioned, it was landing on the KPI cards */
  .railfoot{position:static;margin-top:10px}}
#g.dim{opacity:.55;filter:grayscale(.4)}
/* -------- LOADING state: same surfaces, breathing -------- */
.skel{position:relative;overflow:hidden}
.skel::after{content:'';position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(100deg,transparent 30%,var(--shine) 50%,transparent 70%);
  animation:shine 1.6s infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
/* -------- ERROR states -------- */
#err{position:fixed;left:var(--s2);right:var(--s2);bottom:var(--s2);z-index:50;background:var(--panel);
  border:0;border-left:6px solid var(--red);border-radius:14px;box-shadow:var(--nm-out);
  color:var(--pill-bad-ink);font-size:13px;padding:var(--s2);font-family:var(--mono);display:none}
.bigerr{grid-column:span 12;text-align:center;padding:var(--s6) var(--s3)}
.bigerr .tbtn{margin-top:var(--s2)}

/* gate */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}
.gate .card{max-width:440px;text-align:center;border:0;border-radius:24px;background:var(--panel);padding:var(--s5) var(--s4);box-shadow:var(--nm-out)}
.gate img{width:64px;height:64px;border-radius:14px;margin-bottom:16px}
.gate h1{font-size:19px;margin-bottom:8px}
.gate p{color:var(--tx-2);font-size:13.5px;line-height:1.6}
.gate .rd{color:var(--red)}
.gate a.tbtn{display:inline-block;margin-top:18px}

/* ================= CHART LAYER =================
   WHY THE MAGNITUDE CHARTS ARE HTML AND NOT SVG. A bar chart drawn into a
   scaled viewBox ties its row height to its row COUNT: the mandal chart with
   twelve rows and the score chart with ten ended up with visibly different
   bar thicknesses and baselines, side by side, because each was stretched to
   the same card width and took its height from its own aspect ratio. That is
   what made this console read as ragged. Laid out in HTML at exact pixel
   sizes, a row is 22px whether there are three of them or thirty.
   SVG is kept for arcs and lines, where the geometry actually needs it.

   The 12-column editorial grid is NOT replaced — the map beside the marks
   list, the briefing running full width, are deliberate and stay. The
   alignment rule is applied INSIDE it: every chart sits in a .plot box of
   the same minimum height, centred, so two charts in neighbouring panels sit
   on the same optical line and a panel showing "nothing filed yet" is
   exactly as tall as the chart beside it. */
.plot{
  display:flex; align-items:center; justify-content:center;
  min-height:212px; min-width:0; width:100%;
}
.plot>*{width:100%}
.plot .chart-empty{
  color:var(--tx-2); font-size:13px; text-align:center; width:100%;
  padding:var(--s3) var(--s2); border-radius:14px;
  box-shadow:var(--nm-in-sm); background:var(--well);
}

/* ---- SVG ink: classes, never hardcoded hex, or dark mode renders the
        axis labels at near-invisible contrast ---- */
.c-grid{stroke:var(--ch-grid);stroke-width:1}
.c-tick{fill:var(--ch-muted);font-size:10.5px;font-family:var(--mono)}
.c-endlab{fill:var(--ch-ink);font-size:11.5px;font-weight:700;font-family:var(--mono)}
.c-enddot{stroke:var(--ch-surface);stroke-width:2}
.c-line{width:100%;height:auto;max-height:248px;display:block}
.c-linewrap{width:100%}

/* ---- columns ---- */
.c-cols{display:flex;align-items:flex-end;justify-content:center;gap:12px;height:200px;width:100%;padding:0 4px}
.c-col{flex:1 1 0;max-width:88px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0}
/* cap the MARK at 24px; the BAND stays wide so the labels below never collide */
.c-colbar{width:24px;max-width:100%;border-radius:4px 4px 0 0;min-height:2px;display:block}
.c-colv{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ch-ink);margin-bottom:4px;white-space:nowrap}
.c-collab{font-size:10.5px;color:var(--ch-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:center}

/* ---- horizontal rows: 22px each, whatever the row count ---- */
.c-rowswrap{width:100%}
.c-rows{width:100%;display:flex;flex-direction:column;gap:5px}
.c-row{display:grid;grid-template-columns:104px 1fr 68px;align-items:center;gap:9px;height:22px}
.c-rowlab{font-size:11.5px;color:var(--ch-muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-track{background:var(--ch-grid);border-radius:4px;height:13px;overflow:hidden;display:flex}
.c-fill{display:block;height:100%;border-radius:4px}
.c-rowv{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ch-ink);text-align:right;font-variant-numeric:tabular-nums}
/* stacked rows: segments parted by a 2px gap in the SURFACE, never by a
   border drawn round the mark — a stroke there is ink that isn't data */
.c-seg{display:block;min-width:0}
.c-track .c-seg+.c-seg{margin-left:2px}
.c-rowv.ok{color:var(--st-ok)} .c-rowv.bad{color:var(--st-bad);font-weight:800}

/* ---- meter: the honest form for one ratio against a limit ---- */
.c-meter{width:100%}
.c-meterhead{display:flex;align-items:baseline;gap:11px;margin-bottom:11px;flex-wrap:wrap}
.c-meterv{font-family:var(--mono);font-size:42px;font-weight:750;color:var(--ch-ink);line-height:1;letter-spacing:-.02em}
.c-metersub{font-size:12.5px;color:var(--ch-muted)}
.c-metertrack{background:var(--ch-grid);border-radius:999px;height:14px;overflow:hidden}
.c-meterfill{height:100%;border-radius:999px;min-width:3px}
.c-meterfoot{margin-top:11px;font-size:12.5px;color:var(--ch-muted);line-height:1.55}

/* ---- stacked share ---- */
.c-stackwrap{width:100%}
.c-stacktotal{font-family:var(--mono);font-size:34px;font-weight:750;color:var(--ch-ink);line-height:1.1;margin-bottom:11px}
.c-stacktotal span{display:block;font-family:var(--sans);font-size:11px;font-weight:400;color:var(--ch-muted);letter-spacing:.06em;text-transform:uppercase}
.c-stack{display:flex;height:19px;border-radius:5px;overflow:hidden;gap:2px}
.c-stacklegend{margin-top:13px}

/* ---- donut ---- */
.c-donutwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.c-donut{width:150px;height:150px;flex:0 0 auto}
.c-donutv{fill:var(--ch-ink);font-size:24px;font-weight:750;font-family:var(--mono)}
.c-donutk{fill:var(--ch-muted);font-size:8px;letter-spacing:.1em;text-transform:uppercase}

/* ---- legend. Identity comes from the swatch; the TEXT never wears the
        data colour, or the label starts encoding a value it doesn't hold ---- */
.legend{font-size:12.5px;color:var(--ch-muted);flex:1;min-width:170px}
.legend div{display:flex;align-items:center;gap:8px;margin:5px 0}
.legend b{color:var(--ch-ink);font-family:var(--mono);margin-left:auto}
.legend .pc{color:var(--ch-muted);font-family:var(--mono);width:38px;text-align:right}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px}
.legend-row div{margin:0}
.c-spark{width:90px;height:22px;display:inline-block;vertical-align:middle}

/* ---- the theme switch ---- */
.tbtn.thm{min-width:44px;padding:0 12px}
.tbtn.thm svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:inline-block}
</style>
</head>
