<script>
'use strict';
const $=s=>document.querySelector(s);
let ST=null,TIMER=null,LASTOK=0,EVERY=60000,NEXT=0,INFLIGHT=false,DOWN=false,DATA=null,VIEW='overview',MET='present',MONTH='',SORTD=true;
let MAP=null,MLAYER=null,MAP2=null,M2LAYER=null,GEO=[],MARKERS=[],MFILTER='all',BRIEF=null,BRIEFING=false,NEWS=[],REC={};
let CHAT=[],ASKING=false,XLSXP=null,NTC_UNCHK={},NTC_DECIDING=false;

/* ---------------- session ---------------- */
/* LIGHT OR DARK. Default is the light console the district already knows —
   a Collector who has never asked for anything sees exactly what he saw
   yesterday. The choice is remembered on the device, and the charts follow it
   with no re-render because every series colour is a custom property. */
const SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2 12h2.4M19.6 12H22M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>';
const MOON='<svg viewBox="0 0 24 24"><path d="M20 14.4A8.5 8.5 0 0 1 9.6 4a8.5 8.5 0 1 0 10.4 10.4z"/></svg>';
function paintTheme(){
  const dark=document.body.classList.contains('dark');
  const b=$('#thm'); if(b) b.innerHTML=dark?SUN:MOON;
  if(MAP) setTimeout(()=>{try{MAP.invalidateSize();}catch(e){}},60);
  if(MAP2) setTimeout(()=>{try{MAP2.invalidateSize();}catch(e){}},60);
}
function initTheme(){
  let t=null; try{ t=localStorage.getItem('sjgp-theme'); }catch(e){}
  document.body.classList.toggle('dark', t==='dark');
  paintTheme();
}
function boot(){
  initTheme();
  const tb=$('#thm');
  if(tb) tb.onclick=()=>{
    const dark=!document.body.classList.contains('dark');
    document.body.classList.toggle('dark',dark);
    try{ localStorage.setItem('sjgp-theme',dark?'dark':'light'); }catch(e){}
    paintTheme();
  };
  let d=null; try{ d=JSON.parse(localStorage.getItem('sjf5')||'null'); }catch(e){}
  if(!d||!d.session||!d.session.token||!d.url){ gate('Sign in once in the SJGP app on this device, then open this page again. The console uses that sign-in.',true); return; }
  if((d.session.user||{}).role!=='COLLECTOR'){ gate('<span class="rd">The monitoring console is available to the Collector alone.</span> This device is signed in as '+esc((d.session.user||{}).name||'another officer')+'.',true); return; }
  ST={url:d.url,token:d.session.token,user:d.session.user};
  const h=new Date().getHours();
  $('#hi').textContent=(h<12?'Good morning':h<17?'Good afternoon':'Good evening')+', '+String(ST.user.name||'').replace(/,.*$/,'').split(' ').slice(0,2).join(' ');
  pull(); TIMER=setInterval(tick,1000);
  $('#every').onchange=()=>{EVERY=+$('#every').value;NEXT=Date.now()+EVERY;};
  $('#now').onclick=()=>pull();
  $('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-v]'); if(!b) return;
    VIEW=b.dataset.v; document.querySelectorAll('#nav [data-v]').forEach(x=>x.toggleAttribute('aria-current',x===b));
    if(DATA) render(DATA);});
}
function gate(m,l){ $('#gateMsg').innerHTML=m+(l?'<br><a class="tbtn" href="./">Open the SJGP app</a>':''); }

/* ---------------- polling: the dot never lies ---------------- */
function tick(){
  if(Date.now()>=NEXT&&!INFLIGHT){ pull(); return; }
  if(DOWN){ const age=LASTOK?Math.round((Date.now()-LASTOK)/1000)+'s ago':'never';
    $('#live').className='live down'; $('#liveTx').textContent='LINK LOST · showing '+age; return; }
  if(LASTOK){ const age=Math.round((Date.now()-LASTOK)/1000);
    $('#liveTx').textContent='updated '+(age<5?'now':age+'s ago')+' · next in '+Math.max(0,Math.ceil((NEXT-Date.now())/1000))+'s';
    $('#live').className='live'+(age>EVERY/500?' stale':''); }
}
async function pull(){
  if(!ST||INFLIGHT) return; INFLIGHT=true;
  try{
    /* A request Google sits on must not wedge the console: 45 seconds and it
       is abandoned, so the retry clock actually runs. "LINK LOST · showing
       never" was a fetch that hung for minutes while INFLIGHT stood true. */
    const ctl=new AbortController(); const tmo=setTimeout(()=>ctl.abort(),45000);
    let res, body;
    try{
      res=await fetch(ST.url+'?op=dashboard&token='+encodeURIComponent(ST.token)+(MONTH?'&ym='+encodeURIComponent(MONTH):''),{signal:ctl.signal});
      body=await res.text();
    }finally{ clearTimeout(tmo); }
    let j;
    try{ j=JSON.parse(body); }
    catch(pe){
      /* the reply was not the district's JSON — SAY what it was, because
         Google's error page and a network's block page need different cures */
      throw new Error('the reply was not the district’s own (HTTP '+(res?res.status:'?')+'): “'+
        String(body||'').slice(0,110).replace(/\s+/g,' ')+'…”');
    }
    if(!j.ok) throw new Error(j.error||'refused');
    LASTOK=Date.now(); NEXT=Date.now()+EVERY; DOWN=false; DATA=j;
    $('#err').style.display='none'; $('#g').classList.remove('dim');
    if($('#app').hidden){ $('#gate').style.display='none'; $('#app').hidden=false; }
    $('#g').removeAttribute('aria-busy');
    $('#hisub').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · Jangaon District'
      +(j.off&&j.off.today?' · HOLIDAY — '+(j.off.why||''):'')
      +(MONTH&&MONTH!==new Date().toISOString().slice(0,7)?' · REVIEWING '+monName(MONTH):'');
    monPick(j);
    whatsNew(j);
    render(j);
  }catch(e){
    const msg = (e&&e.name==='AbortError') ? 'no answer within 45 seconds' : ((e&&e.message)||String(e));
    if(/alone/i.test(msg)){ $('#app').hidden=true; $('#gate').style.display='grid'; gate('<span class="rd">'+esc(msg)+'</span>',true); clearInterval(TIMER); }
    else{ DOWN=true; NEXT=Date.now()+Math.min(EVERY,30000)+Math.floor(Math.random()*8000);   /* jitter, so many consoles do not knock together */
      if(!DATA){ $('#gate').style.display='none'; $('#app').hidden=false;
        $('#g').innerHTML='<div class="panel bigerr"><div style="font-size:40px">\u26a0</div>'+
        '<h2 style="margin:8px 0 4px">The district could not be reached</h2>'+
        '<p style="color:var(--tx-2);font-size:13.5px">'+esc(msg)+' \u2014 it will retry by itself, or press Refresh.</p>'+
        '<button class="tbtn pri" onclick="pull()">Try again now</button></div>'; }
      $('#err').textContent='Could not reach the district ('+msg+') — showing the last picture; retrying.';
      $('#err').style.display='block'; $('#g').classList.add('dim');
      $('#live').className='live down'; $('#liveTx').textContent='LINK LOST'; }
  }finally{ INFLIGHT=false; }
}

/* What is new since the Collector last looked. The browser's own
   notification is used where permission is given — it is not a push
   service and only fires while this page is open, which is honest about
   what a Sheet-backed system can do. */
const SEEN_KEY='sjgp_seen_v1';
function seen(){ try{ return JSON.parse(localStorage.getItem(SEEN_KEY)||'{}'); }catch(e){ return {}; } }
function setSeen(o){ try{ localStorage.setItem(SEEN_KEY, JSON.stringify(o)); }catch(e){} }
function notify(title, body){
  try{
    if(!('Notification' in window)) return;
    if(Notification.permission==='granted') new Notification(title,{body:body,icon:'icons/icon-192.png',tag:'sjgp'});
    else if(Notification.permission!=='denied') Notification.requestPermission();
  }catch(e){}
}
function whatsNew(j){
  const was=seen(), now={leave:(j.leave.pending||[]).length, filed:(j.month.rows||[]).length,
    lastLeave:(j.leave.pending[0]||{}).appliedAt||'', ym:j.ym};
  const msgs=[];
  if(was.ym===now.ym){
    const nl=now.leave-(was.leave||0), nf=now.filed-(was.filed||0);
    if(nl>0){ const who=(j.leave.pending||[]).slice(0,3).map(l=>l.name+' ('+l.type+' '+l.days+'d)').join(', ');
      msgs.push({k:'leave', t:nl+' new leave application'+(nl>1?'s':''), d:who}); }
    if(nf>0){ const v=[...j.month.rows].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,3)
        .map(r=>r.gp+' '+r.score+'/100'+(String(r.rf||'').trim()?' RF':'')).join(', ');
      msgs.push({k:'filed', t:nf+' new village evaluation'+(nf>1?'s':''), d:v}); }
  }
  setSeen(now);
  if(msgs.length && was.ym){
    NEWS=msgs.concat(NEWS).slice(0,6);
    msgs.forEach(m=>notify('SJGP · '+m.t, m.d));
  }
  return msgs;
}
/* ---------------- helpers ---------------- */
const monName=ym=>{const d=new Date(ym+'-02T00:00:00');return isNaN(d)?ym:d.toLocaleDateString('en-IN',{month:'long',year:'numeric'});};
function monPick(j){
  const sel=$('#monPick'); if(!sel) return;
  const cur=new Date().toISOString().slice(0,7);
  const set={}; set[cur]=1; (j.trend||[]).forEach(t=>set[t.ym]=1); if(j.ym) set[j.ym]=1;
  const yms=Object.keys(set).sort().reverse();
  const want=yms.map(y=>y+'|'+(MONTH||cur)).join(',');
  if(sel.dataset.k===want) return; sel.dataset.k=want;
  sel.innerHTML=yms.map(y=>`<option value="${y}" ${(MONTH||cur)===y?'selected':''}>${y===cur?'This month':monName(y)}</option>`).join('');
  sel.onchange=()=>{ MONTH=sel.value===cur?'':sel.value; DATA=null; $('#g').setAttribute('aria-busy','true'); pull(); };
}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm=iso=>{const d=new Date(iso);return isNaN(d)?'':d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});};
const dm=s=>{const d=new Date(String(s).length>10?s:s+'T00:00:00');return isNaN(d)?String(s||''):d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});};
const pct=(a,b)=>b?Math.round(a*100/b):0;
/* the hour of a mark as the district reads it — the same hour Code.gs uses
   when it writes the evening mail */
function istHour(iso){
  const d=new Date(iso); if(isNaN(d)) return -1;
  try{ return Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',hour:'2-digit',hour12:false}).format(d)); }
  catch(e){ return d.getHours(); }
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const inits=n=>String(n||'').split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();
function delta(now,prev,goodUp,suffix){
  if(prev==null||now==null||isNaN(prev)) return '';
  const d=now-prev; if(!d) return '<span class="delta fl">= 0'+(suffix||'')+'</span>';
  const up=d>0, good=goodUp?up:!up;
  return `<span class="delta ${good?'up':'dn'}">${up?'▲':'▼'} ${Math.abs(d)}${suffix||''}</span>`;
}

/* ---------------- analytics (honest math kept) ---------------- */
/* a handset more than two minutes out is worth naming: it is why a mark can
   read 10:49 when the clock on the wall says 10:38 */
const SKEW_TOL=120;
function skewPill(r){
  const s=Number(r&&r.skew)||0;
  if(Math.abs(s)<=SKEW_TOL) return '';
  const m=Math.round(Math.abs(s)/60);
  return ' <span class="pill warn" title="This phone\u2019s clock is '+m+' minute(s) '+(s>0?'fast':'slow')+
    '. The district\u2019s own clock has been used.">clock '+m+'m '+(s>0?'fast':'slow')+'</span>';
}
function analyse(j){
  /* THE DISTRICT DECIDES WHO IS DUE, NOT THIS SCREEN. officers-1 counted every
     active row bar the Collector — including the MSOs, whose attendance is
     voluntary by the order of 19.08.2026. The console therefore read "of 114"
     while the evening mail, correctly, read "of 102", and the same morning
     carried two different figures. The server sends the number now; the
     subtraction is kept only so an older deployment still renders. */
  const officersDue=(j.totals&&j.totals.due!=null)?j.totals.due:j.totals.officers-1;
  const present=j.today.present.length,onLeave=j.today.onLeave.length,absent=j.today.absent.length;
  const accounted=present+onLeave, attPct=pct(accounted,Math.max(1,officersDue));
  const cov=j.coverage.reduce((s,c)=>({t:s.t+c.total,d:s.d+c.done}),{t:0,d:0});
  const now=new Date(), sunday=now.getDay()===0, filed=j.month.rows.length;
  const off=(j.off&&j.off.today&&(j.off.why||'Holiday'))||(sunday?'Sunday':'');
  const wd=(a,b)=>{let n=0;for(let d=a;d<=b;d++){if(new Date(now.getFullYear(),now.getMonth(),d).getDay()!==0)n++;}return n;};
  const last=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const wdGone=wd(1,now.getDate()), wdAll=wd(1,last), wdLeft=Math.max(1,wdAll-wdGone+1);
  const expected=Math.max(0,Math.round(cov.t*Math.max(0,wdGone-3)/Math.max(1,wdAll)));
  const needPerDay=Math.ceil(Math.max(0,cov.t-cov.d)/wdLeft);
  const avg=j.month.avg;
  const prevAvg=(()=>{const t=j.trend||[];if(!t.length)return null;const c=t[t.length-1];
    return (c&&c.ym===j.ym)?(t.length>1?t[t.length-2].avg:null):c.avg;})();
  const oldestH=j.leave.pending.length?Math.max(...j.leave.pending.map(l=>(Date.now()-new Date(l.appliedAt).getTime())/36e5)):0;
  const y=j.att14[j.att14.length-2]||{present:0,leave:0};
  const attY=y.present+y.leave;
  /* THE CUTOFF IS THE DISTRICT'S HOUR, NOT THE BROWSER'S. getHours() reads
     the machine the console happens to be open on; the evening mail reads
     Asia/Kolkata, and a Collector opening this from anywhere else would have
     been shown a different figure from the one on paper for the same morning. */
  const by10=j.today.present.filter(r=>istHour(r.at)<10).length;
  const parts=[
    {k:'Attendance',w:25,v:off?null:attPct,why:off?off+' — not counted':accounted+' of '+officersDue+' accounted'},
    {k:'Coverage',w:25,v:expected===0?null:clamp(Math.round(cov.d*100/Math.max(1,expected)),0,100),
      why:expected===0?'month opening — grace':cov.d+' filed against '+expected+' expected by now'},
    {k:'Scores',w:30,v:avg==null?null:avg,why:avg==null?'nothing filed yet':'district average '+avg},
    {k:'Red flags',w:20,v:filed?clamp(Math.round(100-(j.month.rfCount*100/filed)*2),0,100):null,
      why:filed?j.month.rfCount+' of '+filed+' filings flagged':'nothing filed yet'},
    {k:'Leave desk',w:10,v:clamp(Math.round(100-Math.max(0,oldestH-24)*2),0,100),
      why:j.leave.pending.length?'oldest waiting '+Math.round(oldestH)+' h':'nothing waiting'}];
  const wSum=parts.reduce((s,p)=>s+(p.v==null?0:p.w),0);
  const health=wSum<45?null:Math.round(parts.reduce((s,p)=>s+(p.v==null?0:p.v*p.w),0)/wSum);

  const iss=[];
  if(absent>0&&!off&&now.getHours()>=11){
    const byM={}; j.today.absent.forEach(o=>byM[o.mandal||'—']=(byM[o.mandal||'—']||0)+1);
    const worst=Object.entries(byM).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([m,n])=>m+' ('+n+')').join(', ');
    iss.push({p:1,t:absent+' officer'+(absent>1?'s':'')+' not marked as of '+hm(new Date().toISOString()),
      d:'Heaviest: '+worst+'.',a:'Have the MPDOs account for each by phone; unexplained absence goes on record.',
      list:j.today.absent.map(o=>o.name+' · '+o.role+' · '+(o.mandal||'—'))});
  }
  const flagged=j.month.rows.filter(r=>String(r.rf||'').trim());
  if(flagged.length) iss.push({p:1,t:flagged.length+' village'+(flagged.length>1?'s carry':' carries')+' a red flag — grade capped at D',
    d:flagged.slice(0,4).map(r=>r.gp+' (RF '+r.rf+')').join(', ')+(flagged.length>4?'…':'')+'.',
    a:'Call for the photographic evidence and order rectification with a dated compliance report.',
    list:flagged.map(r=>r.gp+' · RF '+r.rf+' · '+r.score+'/100 · '+String(r.officer||'').replace(/\s*\(\d+\)$/,''))});
  const dups=j.today.present.filter(r=>(r.marks||1)>1);
  if(dups.length) iss.push({p:2,t:dups.length+' officer'+(dups.length>1?'s':'')+' marked attendance more than once today',
    d:'One row stands per officer; the count is on record.',a:'Usually a second device or a re-login; a pattern on the same names warrants a word.',
    list:dups.map(r=>r.name+' · '+r.marks+'× · '+(r.mandal||'—'))});
  const dNoFlag=j.month.rows.filter(r=>r.grade==='D'&&!String(r.rf||'').trim());
  if(dNoFlag.length) iss.push({p:2,t:dNoFlag.length+' village'+(dNoFlag.length>1?'s':'')+' at grade D without a red flag',
    d:dNoFlag.slice(0,4).map(r=>r.gp+' ('+r.score+')').join(', ')+(dNoFlag.length>4?'…':'')+'.',
    a:'Direct a fortnightly re-visit; deficiencies carry into next month\u2019s G1.',
    list:dNoFlag.map(r=>r.gp+' · '+r.score+'/100 · '+r.mandal)});
  if(cov.d<cov.t&&needPerDay>0) iss.push({p:needPerDay>3?2:3,
    t:(cov.t-cov.d)+' villages still to evaluate · '+wdLeft+' working day'+(wdLeft>1?'s':'')+' left',
    d:'The month closes at the present pace only if '+needPerDay+' evaluation'+(needPerDay>1?'s are':' is')+' filed each day.',
    a:'Set a per-mandal daily quota in the evening review; the league below shows who is behind.'});
  const oldPend=j.leave.pending.filter(l=>Date.now()-new Date(l.appliedAt).getTime()>48*3600e3);
  if(oldPend.length) iss.push({p:2,t:oldPend.length+' leave application'+(oldPend.length>1?'s':'')+' waiting beyond 48 hours',
    d:'The oldest has waited '+Math.round(oldestH)+' hours.',a:'Pass orders today — held days block fresh applications.',
    list:oldPend.map(l=>l.name+' · '+l.type+' '+l.days+'d from '+dm(l.from))});
  const badClocks=(j.today.present||[]).filter(r=>Math.abs(Number(r.skew)||0)>SKEW_TOL);
  if(badClocks.length) iss.push({p:3,
    t:badClocks.length+' phone'+(badClocks.length>1?'s have clocks':' has a clock')+' set wrong',
    d:'Their marks were recorded against the district\u2019s clock, so nothing is lost \u2014 but the officer sees the wrong time on his own screen, and a phone running fast can look late when it is not.',
    a:'Ask them to set date and time to automatic on the handset.',
    list:badClocks.map(r=>r.name+' · '+(r.mandal||'—')+' · '+Math.round(Math.abs(r.skew)/60)+' min '+(r.skew>0?'fast':'slow'))});
  if(j.notices&&(j.notices.proposed||[]).length) iss.push({p:1,
    t:(j.notices.proposed.length)+' proposed notice'+(j.notices.proposed.length>1?'s':'')+' await your approval',
    d:'Nothing has been served — the morning pass only proposes.',
    a:'Open Notices, untick any that should not go, and press Send.',
    list:j.notices.proposed.slice(0,40).map(n=>n.name+' · '+(n.mandal||'—')+' · '+dm(n.date))});
  if(j.notices&&j.notices.pending) iss.push({p:2,
    t:j.notices.pending+' served notice'+(j.notices.pending>1?'s':'')+' awaiting acknowledgement',
    d:'Each locks that officer\u2019s app until acknowledged; persistence means the app is not being opened at all.',
    a:'Have the MPDO put the officer on the phone; the Notices view carries the register.',
    list:(j.notices.rows||[]).filter(n=>n.status==='PENDING').slice(0,40).map(n=>(n.no||'—')+' · '+n.name+' · '+(n.mandal||'—')+' · '+dm(n.date))});
  /* A mark is implausible if the fix is coarse enough to cover a mandal, if
     the phone is not on Indian time, or if the coordinates fall outside a
     generous box around the district. Any one of those means the location
     proves nothing. */
  const OUT=r=>r.lat!=null&&r.lng!=null&&(r.lat<16.4||r.lat>19.2||r.lng<77.6||r.lng>80.9);
  const bad=j.today.present.filter(r=>OUT(r)||(r.acc&&r.acc>250)||(r.tz&&!/Calcutta|Kolkata/i.test(r.tz)));
  if(bad.length) iss.push({p:1,t:bad.length+' attendance mark'+(bad.length>1?'s':'')+' cannot be trusted as proof of presence',
    d:'Coarse fix, a phone not on Indian time, or coordinates outside the district.',
    a:'Ask each officer to mark again from the field with location switched on. A repeat warrants an explanation in writing.',
    list:bad.map(r=>r.name+' \u00b7 '+(r.mandal||'\u2014')+' \u00b7 '+
      (OUT(r)?'outside the district ('+r.lat.toFixed(2)+', '+r.lng.toFixed(2)+')':'')+
      (r.acc&&r.acc>250?' \u00b1'+Math.round(r.acc)+' m':'')+
      (r.tz&&!/Calcutta|Kolkata/i.test(r.tz)?' \u00b7 '+r.tz:''))});
  const noFix=j.today.present.filter(r=>!r.verified&&!bad.includes(r));
  if(noFix.length) iss.push({p:3,t:noFix.length+' attendance mark'+(noFix.length>1?'s':'')+' without a location fix today',
    d:'A one-off is weak signal; a pattern on the same names is not.',a:'Check the fortnight before raising it.',
    list:noFix.map(r=>r.name+' · '+(r.mandal||'—'))});
  if(prevAvg!=null&&avg!=null&&avg<prevAvg-3) iss.push({p:3,t:'District average has slipped: '+prevAvg+' → '+avg,
    d:'Against last month, on '+filed+' filings so far.',a:'Read the bottom five before the next review.'});
  iss.sort((a,b)=>a.p-b.p);
  return {health,parts,wSum,attPct,cov,needPerDay,wdLeft,avg,prevAvg,iss,accounted,officersDue,absent,present,onLeave,filed,by10,attY,sunday,off};
}

/* ---------------- charts ---------------- */
/* ================= THE CHART TOOLKIT =================
   Dependency-free, no CDN, no build step — the console has to open on a
   filtered government network.

   Rule 0, in order: pick the form for the data's JOB, assign colour by the
   job that colour is doing, validate the palette, apply the mark specs, then
   render it and look at it. Colour comes last. The palette here was run
   through the validator against this console's own two surfaces; the record,
   including the palette that FAILED, is in prompt/palette-validation.txt.

   Every colour below is a CSS custom property, so the theme switch recolours
   every chart with no re-render and no redraw. */
const Charts = (() => {
  /* Categorical — identity. Fixed order, assigned by slot, never cycled and
     never generated. Past slot 8 the tail folds into "Other". */
  const PAL = ['var(--cs1)','var(--cs2)','var(--cs3)','var(--cs4)',
               'var(--cs5)','var(--cs6)','var(--cs7)','var(--cs8)'];
  /* Ordinal — magnitude or rank on ONE axis: hours of the morning, ten-mark
     score bands. One hue, least → most. A rainbow here would claim these are
     eight different things when they are one thing at eight levels. */
  const ORD = ['var(--co1)','var(--co2)','var(--co3)','var(--co4)','var(--co5)'];
  /* Reserved. Good / warning / bad, never re-used as "series 4", and always
     shipped with a word beside them so colour never carries the meaning. */
  const ST = {ok:'var(--st-ok)', warn:'var(--st-warn)', bad:'var(--st-bad)', idle:'var(--st-idle)'};

  let uid = 0; const nextId = () => 'cg' + (++uid);
  const fmt = n => (typeof n === 'number' && isFinite(n))
    ? (Math.abs(n) >= 1000 ? n.toLocaleString('en-IN') : String(n)) : String(n);
  const empty = m => '<div class="chart-empty">' + esc(m || 'Nothing yet.') + '</div>';
  function niceMax(v){
    if(v <= 5) return 5;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    for(const m of [1,2,5,10]) if(m*p >= v) return m*p;
    return 10*p;
  }
  /* A gradient must never introduce a SECOND hue, or the fill starts implying
     a value the data does not hold — which is exactly what the old score
     trend did, running indigo to teal across a single series. This is one
     colour fading toward the surface. Declared twice so a browser without
     color-mix() still gets the right solid hue instead of no fill at all. */
  const grad = (c, dir) => {
    const d = dir || '180deg';
    return 'background:linear-gradient(' + d + ',' + c + ' 0%,' + c + ' 100%);' +
           'background:linear-gradient(' + d + ',' + c + ' 0%,color-mix(in srgb,' + c + ' 62%,transparent) 100%)';
  };

  /* ---- columns (HTML) ----
     One series gets ONE colour. Colouring each bar of a single series by its
     own height encodes height twice and spends the only free channel saying
     nothing — pass ord:true only when the bars are an ordered scale. */
  function bar(items, opts){
    opts = opts || {};
    if(!items || !items.length) return empty(opts.emptyMsg);
    const max = opts.pct ? 100 : niceMax(Math.max(1, ...items.map(i => i.value)));
    const base = opts.color || PAL[0];
    return '<div class="c-cols">' + items.map((it, i) => {
      const c = it.color || (opts.ord ? ORD[Math.min(ORD.length - 1, Math.floor(i * ORD.length / items.length))] : base);
      const pc = Math.max(0, Math.min(100, (it.value / max) * 100));
      return '<div class="c-col" title="' + esc(it.title || (it.label + ': ' + it.value)) + '">' +
        '<span class="c-colv">' + esc(fmt(it.value) + (opts.pct ? '%' : '')) + '</span>' +
        '<span class="c-colbar" style="height:' + pc.toFixed(1) + '%;' + grad(c) + '"></span>' +
        '<span class="c-collab">' + esc(it.label) + '</span></div>';
    }).join('') + '</div>';
  }

  /* ---- stacked rows (HTML) ----
     One row per item, each row parted into status segments. Every row is
     exactly 22px, so this lines up with any other chart beside it however
     many mandals the district has. */
  function stackRows(rows, opts){
    opts = opts || {};
    if(!rows || !rows.length) return empty(opts.emptyMsg);
    return '<div class="c-rowswrap"><div class="c-rows">' + rows.map(r => {
      const total = r.parts.reduce((s, p) => s + p.value, 0) || 1;
      const segs = r.parts.filter(p => p.value > 0).map(p =>
        '<span class="c-seg" style="flex:' + p.value + ';' + grad(p.color, '90deg') + '"></span>').join('');
      return '<div class="c-row" title="' + esc(r.title || r.label) + '">' +
        '<span class="c-rowlab">' + esc(r.label) + '</span>' +
        '<span class="c-track">' + segs + '</span>' +
        '<span class="c-rowv ' + esc(r.tone || '') + '">' + esc(r.right == null ? total : r.right) + '</span></div>';
    }).join('') + '</div>' + (opts.legend ? legendRow(opts.legend) : '') + '</div>';
  }

  /* ---- meter (HTML) ----
     One ratio against a limit. This replaces the gauge donut the health panel
     carried: a two-slice ring is a stat tile in a costume, and it reads worse
     than the number it is hiding. */
  function meter(value, total, opts){
    opts = opts || {};
    if(!total) return empty(opts.emptyMsg);
    const pc = Math.max(0, Math.min(100, (value / total) * 100));
    const c = opts.color || PAL[0];
    return '<div class="c-meter">' +
      '<div class="c-meterhead"><b class="c-meterv">' + Math.round(opts.show == null ? pc : opts.show) +
        (opts.unit === '' ? '' : esc(opts.unit || '%')) + '</b>' +
        '<span class="c-metersub">' + esc(opts.sub || (fmt(value) + ' of ' + fmt(total))) + '</span></div>' +
      '<div class="c-metertrack" title="' + esc(fmt(value) + ' of ' + fmt(total)) + '">' +
        '<div class="c-meterfill" style="width:' + pc.toFixed(1) + '%;' + grad(c, '90deg') + '"></div></div>' +
      (opts.foot ? '<div class="c-meterfoot">' + opts.foot + '</div>' : '') + '</div>';
  }

  /* ---- stacked share (HTML) ----
     Part-to-whole, <= 6 parts, as one bar with the total as the hero number.
     Segments are parted by a 2px gap in the surface, never by a stroke. */
  function stack(parts, opts){
    opts = opts || {};
    const live = parts.filter(p => p.value > 0);
    const total = parts.reduce((s, p) => s + p.value, 0);
    if(!total) return empty(opts.emptyMsg);
    const segs = live.map((p, i) => '<span class="c-seg" style="flex:' + p.value + ';' +
      grad(p.color || PAL[i % PAL.length], '90deg') + '" title="' + esc(p.label + ': ' + fmt(p.value) +
      ' (' + Math.round(p.value / total * 100) + '%)') + '"></span>').join('');
    return '<div class="c-stackwrap">' +
      (opts.center != null ? '<div class="c-stacktotal">' + esc(fmt(opts.center)) +
        (opts.centerLabel ? '<span>' + esc(opts.centerLabel) + '</span>' : '') + '</div>' : '') +
      '<div class="c-stack">' + segs + '</div>' +
      '<div class="legend c-stacklegend">' + parts.map((p, i) =>
        '<div><i style="background:' + (p.color || PAL[i % PAL.length]) + '"></i>' + esc(p.label) +
        '<b>' + esc(fmt(p.value)) + '</b><span class="pc">' + Math.round(p.value / total * 100) + '%</span></div>').join('') +
      '</div></div>';
  }

  /* ---- donut (SVG) ---- part-to-whole at a glance, <= 6 segments. */
  function donut(parts, opts){
    opts = opts || {};
    const live = parts.filter(p => p.value > 0);
    const total = parts.reduce((s, p) => s + p.value, 0);
    if(!total) return empty(opts.emptyMsg);
    const R = 46, SW = 17, C = 2 * Math.PI * R, GAP = live.length > 1 ? 3 : 0;
    let off = 0, s = '', defs = '';
    live.forEach((p, i) => {
      const col = p.color || PAL[i % PAL.length], arc = (p.value / total) * C, gid = nextId();
      defs += '<linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" style="stop-color:' + col + '"/>' +
        '<stop offset="100%" style="stop-color:' + col + ';stop-opacity:.72"/></linearGradient>';
      s += '<circle r="' + R + '" cx="60" cy="60" fill="none" stroke="url(#' + gid + ')" stroke-width="' + SW +
        '" stroke-dasharray="' + Math.max(0.5, arc - GAP).toFixed(2) + ' ' + C.toFixed(2) +
        '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 60 60)"><title>' +
        esc(p.label + ': ' + fmt(p.value) + ' (' + Math.round(p.value / total * 100) + '%)') + '</title></circle>';
      off += arc;
    });
    return '<div class="c-donutwrap"><svg class="c-donut" viewBox="0 0 120 120" role="img"><defs>' + defs + '</defs>' + s +
      '<text class="c-donutv" x="60" y="' + (opts.centerLabel ? 58 : 66) + '" text-anchor="middle">' +
        esc(fmt(opts.center != null ? opts.center : total)) + '</text>' +
      (opts.centerLabel ? '<text class="c-donutk" x="60" y="74" text-anchor="middle">' + esc(opts.centerLabel) + '</text>' : '') +
      '</svg><div class="legend">' + parts.map((p, i) =>
        '<div><i style="background:' + (p.color || PAL[i % PAL.length]) + '"></i>' + esc(p.label) +
        '<b>' + esc(fmt(p.value)) + '</b><span class="pc">' + Math.round(p.value / total * 100) + '%</span></div>').join('') +
      '</div></div>';
  }

  /* ---- line / area (SVG) ----
     A value is direct-labelled at the END, not on every point; every point
     still carries a hover title, so nothing the reader could ask for is lost.
     The end dot wears a 2px ring in the surface colour so it stays legible
     wherever it lands. */
  function line(labels, series, opts){
    opts = opts || {};
    const n = labels.length;
    if(!n || !series.length) return empty(opts.emptyMsg);
    const W = opts.w || 720, H = opts.h || 232, PB = 26, PT = 20, PL = 40;
    const max = opts.max || niceMax(Math.max(1, ...series.flatMap(s => s.values.filter(v => v != null))));
    const x = i => PL + (n === 1 ? 0 : (i / (n - 1)) * (W - PL - 16));
    const y = v => PT + (1 - v / max) * (H - PB - PT);
    let s = '', defs = '';
    [0, .25, .5, .75, 1].forEach(f => {
      const vy = PT + f * (H - PB - PT);
      /* solid, hairline, recessive — a DASHED gridline reads as a threshold */
      s += '<line class="c-grid" x1="' + PL + '" y1="' + vy.toFixed(1) + '" x2="' + (W - 8) + '" y2="' + vy.toFixed(1) + '"/>' +
        '<text class="c-tick" x="' + (PL - 7) + '" y="' + (vy + 3.5).toFixed(1) + '" text-anchor="end">' +
        esc(fmt(Math.round(max * (1 - f))) + (opts.unit || '')) + '</text>';
    });
    series.forEach((sr, si) => {
      const col = sr.color || PAL[si % PAL.length];
      let d = '', open = false;
      sr.values.forEach((v, i) => {
        if(v == null){ open = false; return; }
        d += (open ? ' L' : ' M') + x(i).toFixed(1) + ',' + y(v).toFixed(1); open = true;
      });
      if(sr.area){
        let firstI = sr.values.findIndex(v => v != null), lastI = -1;
        sr.values.forEach((v, i) => { if(v != null) lastI = i; });
        if(firstI >= 0){
          const gid = nextId();
          defs += '<linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0%" style="stop-color:' + col + ';stop-opacity:.30"/>' +
            '<stop offset="100%" style="stop-color:' + col + ';stop-opacity:0"/></linearGradient>';
          s += '<path d="' + d + ' L' + x(lastI).toFixed(1) + ',' + y(0).toFixed(1) + ' L' +
            x(firstI).toFixed(1) + ',' + y(0).toFixed(1) + ' Z" fill="url(#' + gid + ')"/>';
        }
      }
      s += '<path d="' + d + '" fill="none" style="stroke:' + col + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
      sr.values.forEach((v, i) => {
        if(v == null) return;
        s += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="10" fill="transparent"><title>' +
          esc(labels[i] + ' — ' + sr.name + ': ' + fmt(v) + (opts.unit || '')) + '</title></circle>';
      });
      let lastI = -1;
      sr.values.forEach((v, i) => { if(v != null) lastI = i; });
      if(lastI >= 0){
        s += '<circle class="c-enddot" cx="' + x(lastI).toFixed(1) + '" cy="' + y(sr.values[lastI]).toFixed(1) +
          '" r="4.5" style="fill:' + col + '"/>';
        if(series.length === 1){
          const lx = x(lastI), anchor = lx > W - 64 ? 'end' : 'start';
          /* flip the label below the point when it has run to the top of the
             plot, or it renders outside the viewBox and simply vanishes */
          const ly = y(sr.values[lastI]), above = ly - 11 > PT + 4;
          s += '<text class="c-endlab" x="' + (lx + (anchor === 'end' ? -8 : 8)).toFixed(1) + '" y="' +
            (above ? ly - 11 : ly + 16).toFixed(1) + '" text-anchor="' + anchor + '">' +
            esc(fmt(sr.values[lastI]) + (opts.unit || '')) + '</text>';
        }
      }
    });
    /* first and last ticks anchor start/end — anchored middle, the last one
       is clipped at the viewBox edge */
    const step = Math.max(1, Math.ceil(n / 9));
    labels.forEach((l, i) => {
      if(i % step && i !== n - 1) return;
      const a = i === 0 ? 'start' : (i === n - 1 ? 'end' : 'middle');
      s += '<text class="c-tick" x="' + x(i).toFixed(1) + '" y="' + (H - 7) + '" text-anchor="' + a + '">' + esc(l) + '</text>';
    });
    /* one series is already named by the card title; a one-swatch legend
       only restates it */
    const leg = series.length < 2 ? '' : legendRow(series.map((sr, si) =>
      ({label: sr.name, color: sr.color || PAL[si % PAL.length]})));
    return '<div class="c-linewrap"><svg class="c-line" viewBox="0 0 ' + W + ' ' + H + '" role="img"><defs>' +
      defs + '</defs>' + s + '</svg>' + leg + '</div>';
  }

  function legendRow(items){
    return '<div class="legend legend-row">' + items.map(i =>
      '<div><i style="background:' + i.color + '"></i>' + esc(i.label) + '</div>').join('') + '</div>';
  }

  function spark(values, color){
    const W = 90, H = 22, vals = values.map(v => v == null ? 0 : v);
    const max = Math.max(1, ...vals);
    const x = i => 2 + (i / Math.max(1, vals.length - 1)) * (W - 4);
    const y = v => H - 3 - (v / max) * (H - 6);
    let d = '';
    vals.forEach((v, i) => { d += (i ? ' L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1); });
    return '<svg class="c-spark" viewBox="0 0 ' + W + ' ' + H + '"><path d="' + d +
      '" fill="none" style="stroke:' + (color || PAL[0]) + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  }

  return {bar, stackRows, meter, stack, donut, line, spark, legendRow, empty, fmt, grad, PAL, ORD, ST};
})();

/* ================= THE CHARTS THIS CONSOLE DRAWS =================
   Each keeps the name and the signature it had, so every call site and every
   behaviour that hung off it — the metric tabs, the tap-through, the export —
   is untouched. What changed is the FORM, and only where the form was wrong. */

/* The activity chart shows ONE measure at a time, named by the tab above it.
   Three of the four are states of an officer's day, so they wear the reserved
   status colours; villages filed is not a state and takes the lead series
   slot. Nothing here is a rank, so nothing is coloured by one. */
function metColor(met){
  return met === 'absent' ? Charts.ST.bad
    : met === 'leave' ? Charts.ST.warn
    : met === 'filed' ? 'var(--cs1)'
    : Charts.ST.ok;
}

/* District activity over the fortnight. Was a smooth spline whose curve
   invented values between the days it had; a working day is a reading, not a
   continuum, so the line is straight between readings now. */
function areaChart(rows, key, color){
  const due = () => Math.max(0, (DATA.totals.officers - 1));
  const val = r => key === 'present' ? r.present
    : key === 'leave' ? r.leave
    : key === 'absent' ? Math.max(0, due() - r.present - r.leave)
    : (r.filedN || 0);
  const name = key === 'present' ? 'Present' : key === 'leave' ? 'On leave'
    : key === 'absent' ? 'Not marked' : 'Villages filed';
  return Charts.line(rows.map(r => dm(r.date)),
    [{name: name, values: rows.map(val), color: color, area: true}],
    {emptyMsg: 'No days on record yet.'});
}

/* Grades and the like: part-to-whole, four parts, total in the hole. */
function donut(segs, center, sub){
  return Charts.donut(segs.map(x => ({label: x.k, value: x.v, color: x.c})),
    {center: center, centerLabel: sub});
}

/* WHEN THE DISTRICT MARKS IN. Thirteen hours of one morning are an ORDERED
   scale, not thirteen identities — so they get one hue running least to most,
   not the green/olive/amber ramp they wore, which coloured a single series by
   its own height and said nothing twice. */
function histMarkIn(rows){
  const buckets = Array(13).fill(0);
  rows.forEach(r => { const h2 = new Date(r.at).getHours(); if(h2 >= 6 && h2 <= 18) buckets[h2 - 6]++; });
  if(!buckets.some(Boolean)) return Charts.empty('No officer has marked yet today.');
  return Charts.bar(buckets.map((v, i) => ({
    label: String(i + 6), value: v,
    title: v + ' mark' + (v === 1 ? '' : 's') + ' between ' + (i + 6) + ':00 and ' + (i + 7) + ':00'
  })), {ord: true});
}

/* The district average, month by month. The line used to run indigo→teal —
   a gradient carrying a SECOND hue across a single series, which implies a
   change the numbers do not hold — and every point wore its grade colour,
   which is colour assigned by rank. One hue now; the grade of each month is
   in its tooltip and in the villages table below. */
function trendLine(rows){
  if(!rows.length) return Charts.empty('No months on record yet.');
  return Charts.line(rows.map(r => r.ym.slice(5) + '/' + r.ym.slice(2, 4)),
    [{name: 'District average', values: rows.map(r => Math.min(100, r.avg)),
      color: 'var(--cs1)', area: true}],
    {max: 100, emptyMsg: 'No months on record yet.',
     labels: rows.map(r => monName(r.ym))});
}

/* Attendance by mandal — where the gaps actually are. Was an SVG whose height
   followed its row count, so it never lined up with anything beside it. Rows
   are 22px in HTML now. The three parts are STATUS, which is the one job that
   licenses these colours, and each row carries the count in words. */
function mandalAtt(j){
  const m = {};
  j.coverage.forEach(c => m[c.mandal] = {p: 0, l: 0, a: 0});
  j.today.present.forEach(r => { if(m[r.mandal]) m[r.mandal].p++; });
  j.today.onLeave.forEach(r => { if(m[r.mandal]) m[r.mandal].l++; });
  j.today.absent.forEach(r => { if(m[r.mandal]) m[r.mandal].a++; });
  const rows = Object.entries(m).map(([k, v]) => ({k, ...v, t: v.p + v.l + v.a}))
    .filter(r => r.t).sort((a, b) => (b.a / b.t) - (a.a / a.t));
  if(!rows.length) return Charts.empty('No officers on the roll yet.');
  return Charts.stackRows(rows.map(r => ({
    label: r.k.length > 16 ? r.k.slice(0, 15) + '…' : r.k,
    title: r.k + ' — ' + r.p + ' present · ' + r.l + ' on leave · ' + r.a + ' not marked, of ' + r.t,
    parts: [{value: r.p, color: Charts.ST.ok}, {value: r.l, color: Charts.ST.warn},
            {value: r.a, color: Charts.ST.bad}],
    right: r.a ? r.a + ' missing' : 'all in',
    tone: r.a ? 'bad' : 'ok'
  })));
}

/* Where the scores sit. Ten-mark bands are an ordered scale — one hue. */
function scoreDist(rows){
  if(!rows.length) return Charts.empty('Nothing filed yet.');
  const b = Array(10).fill(0);
  rows.forEach(r => { b[clamp(Math.floor(r.score / 10), 0, 9)]++; });
  return Charts.bar(b.map((v, i) => ({
    label: String(i * 10), value: v,
    title: v + ' village' + (v === 1 ? '' : 's') + ' scored ' + (i * 10) + '–' + (i * 10 + 9)
  })), {ord: true});
}

/* who files, and how well — the officer ledger */
function officerTable(rows){
  const by={};
  rows.forEach(r=>{const o=String(r.officer||'—').replace(/\s*\(\d+\)$/,'');
    by[o]=by[o]||{n:0,sum:0,rf:0,d:0};
    by[o].n++; by[o].sum+=r.score; if(String(r.rf||'').trim())by[o].rf++; if(r.grade==='D')by[o].d++;});
  const list=Object.entries(by).map(([k,v])=>({k,n:v.n,avg:Math.round(v.sum/v.n),rf:v.rf,d:v.d}))
    .sort((a,b)=>b.n-a.n);
  if(!list.length) return '<div class="empty">Nothing filed yet this month.</div>';
  return `<div class="twrap"><table><thead><tr><th>Officer</th><th>Filed</th><th>Avg score</th><th>Grade D</th><th>Red flags</th></tr></thead><tbody>`+
    list.map(o=>`<tr><td>${esc(o.k)}</td><td class="num">${o.n}</td>
      <td class="num" style="color:${o.avg>=70?'var(--green)':o.avg>=55?'var(--amber)':'var(--red)'}">${o.avg}</td>
      <td class="num">${o.d||'—'}</td><td class="num">${o.rf?'<span class="pill bad">'+o.rf+'</span>':'—'}</td></tr>`).join('')+
    `</tbody></table></div>`;
}
/* ---------------- building blocks ---------------- */
const IC={u:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c1.2-3.6 4-5.4 7.5-5.4s6.3 1.8 7.5 5.4"/></svg>',
  h:'<svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V9l7-5 7 5v12M9.5 21v-6h5v6"/></svg>',
  s:'<svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8L3.5 9.2l5.9-.8z"/></svg>',
  f:'<svg viewBox="0 0 24 24"><path d="M6 21V4m0 1h11l-2.5 3.5L17 12H6"/></svg>',
  c:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>'};
function kpi(title,ic,val,dlt,foot,act){
  return `<div class="kpi${act?' tapk':''}"${act?' data-act="'+act+'"':''}><div class="hd">${title}<span class="ic">${ic}</span></div>
    <div class="v">${val}</div><div class="foot">${dlt||''}<span>${foot||''}</span></div></div>`;}
function panel(span,title,right,body,k){
  return `<div class="panel ${span}"><div class="hd">${title}<span class="r">${right||''}</span></div><div class="bd"${k?' data-k="'+k+'"':''}>${body}</div></div>`;}

/* ---------------- maps ---------------- */
function suspect(p){ return (p.lat!=null&&(p.lat<16.4||p.lat>19.2||p.lng<77.6||p.lng>80.9))
  || (p.acc&&p.acc>250) || (p.tz&&!/Calcutta|Kolkata/i.test(p.tz)); }
function marker(p){
  if(p._s==='V'){ const c=p.grade==='A'?'#16A34A':p.grade==='B'?'#65A30D':p.grade==='C'?'#D97706':'#DC2626';
    return L.circleMarker([p.lat,p.lng],{radius:8,color:'#fff',weight:2,fillColor:c,fillOpacity:.9})
      .bindPopup(`<b>${esc(p.gp)}</b> &middot; village<br>${esc(p.mandal)}<br>Score ${p.score} &middot; grade ${esc(p.grade)}${String(p.rf||'').trim()?' &middot; <span style="color:#DC2626">RF '+esc(p.rf)+'</span>':''}<br>${esc(String(p.officer||''))}${photoLink(p)?'<br><a target="_blank" rel="noopener" href="'+esc(photoLink(p))+'">View the evidence</a>':''}`); }
  if(p._s==='L') return L.circleMarker([p.lat,p.lng],{radius:7,color:'#fff',weight:2,fillColor:'#8B99AF',fillOpacity:.9})
      .bindPopup(`<b>${esc(p.name)}</b><br>on sanctioned leave`);
  /* not marked today. A SOLID ring is fresh — the app was opened here today
     (the seen ping, which the officer is told about on screen). A DASHED
     ring is history — the place he LAST marked, on the date shown. Neither
     is ever dressed up as attendance. */
  if(p._s==='A'){
    const fresh=!!p.seenAt;
    return L.circleMarker([p.lat,p.lng],{radius:8.5,color:'#DC2626',weight:2.2,dashArray:fresh?null:'4 3',fillColor:'#DC2626',fillOpacity:fresh?.2:.1})
      .bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.role)} · ${esc(p.mandal||'—')}<br><span style="color:#DC2626;font-weight:700">not marked today</span><br>${fresh?'app opened here at '+esc(hm(p.seenAt))+' today':'last marked here on '+esc(dm(p.lastDate||''))}`);
  }
  const col=suspect(p)?'#DC2626':p.verified?'#16A34A':'#D97706';
  return L.circleMarker([p.lat,p.lng],{radius:(p.marks||1)>1?9:7,color:'#fff',weight:2,fillColor:col,fillOpacity:.95})
    .bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.role)} · ${esc(p.mandal||'—')}<br>${esc(hm(p.at))} · ${suspect(p)?'<span style="color:#DC2626">location not trustworthy</span>':p.verified?'verified':'no fix'}${p.acc?' · ±'+Math.round(p.acc)+' m':''}${(p.marks||1)>1?' · <span style="color:#DC2626">'+p.marks+'×</span>':''}<br><a target="_blank" rel="noopener" href="https://maps.google.com/?q=${p.lat},${p.lng}">Open in Google Maps</a>`);}
function mapPoints(){
  const out=[];
  (DATA.today.present||[]).forEach(r=>{ if(r.lat&&r.lng) out.push({...r,_s:'P'}); });
  (DATA.today.onLeave||[]).forEach(r=>{ if(r.lat&&r.lng) out.push({...r,_s:'L'}); });
  (DATA.today.absent||[]).forEach(r=>{ if(r.lat&&r.lng) out.push({...r,_s:'A'}); });
  (DATA.month.rows||[]).forEach(r=>{ if(r.lat&&r.lng) out.push({...r,_s:'V',name:r.gp,role:'Village',at:r.date}); });
  return out;
}
function passFilter(p){
  if(MFILTER==='present') return p._s==='P';
  if(MFILTER==='suspect') return p._s==='P'&&suspect(p);
  if(MFILTER==='nofix')   return p._s==='P'&&!p.verified&&!suspect(p);
  if(MFILTER==='absent')  return p._s==='A';
  if(MFILTER==='villages')return p._s==='V';
  return true;
}
function flyTo(name){
  const hit=MARKERS.find(x=>x.p.name===name); if(!hit) return;
  const map=(MAP2&&document.getElementById('map2'))?MAP2:MAP;
  if(map){ map.setView([hit.p.lat,hit.p.lng],15); hit.mk.openPopup(); }
}
function mapTools(){
  const pts=mapPoints();
  const names=[...new Set(pts.map(p=>p.name))].sort();
  return `<div class="mtools">
    <input class="find" id="mFind" list="mNames" placeholder="Find an officer or village on the map" autocomplete="off">

    <select class="rsel" id="mPick"><option value="">Jump to&hellip;</option>${names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select>
    <span class="msp"></span>`+
    [['all','Everything',pts.length],['present','Present',pts.filter(p=>p._s==='P').length],
     ['suspect','Not trustworthy',pts.filter(p=>p._s==='P'&&suspect(p)).length],
     ['nofix','No fix',pts.filter(p=>p._s==='P'&&!p.verified&&!suspect(p)).length],
     ['absent','Not marked',pts.filter(p=>p._s==='A').length],
     ['villages','Villages filed',pts.filter(p=>p._s==='V').length]]
     .map(([k,n,c])=>`<button class="fchip" data-mf="${k}" aria-pressed="${MFILTER===k}">${n} <b>${c}</b></button>`).join('')+
    `<button class="fchip" id="mFit">Fit all</button></div>`;
}
function mapDiag(){
  const P=(DATA.today.present||[]), V=(DATA.month.rows||[]);
  const anyCoord=P.some(r=>r.lat&&r.lng)||V.some(r=>r.lat&&r.lng);
  if(anyCoord) return '';
  if(!P.length&&!V.length) return 'Nothing has been marked or filed today, so there is nothing to place on the map.';
  return 'The district is sending '+P.length+' attendance mark(s) and '+V.length+' filing(s), but NO COORDINATES with them. '+
         'That means the Apps Script on the Sheet is an older version: open Extensions \u25b8 Apps Script, paste the current Code.gs, '+
         'then Deploy \u25b8 Manage deployments \u25b8 edit \u25b8 Version: New version \u25b8 Deploy. The map fills by itself on the next refresh.';
}
function drawMap(id,which){
  GEO=mapPoints();
  const el=document.getElementById(id); if(!el) return null;
  /* the library is inlined now, so this can no longer happen — but a map
     that fails must SAY so, never sit as a silent empty box */
  if(typeof L==='undefined'){
    el.innerHTML='<div style=\"height:100%;display:grid;place-items:center;padding:26px;text-align:center;color:var(--tx-2);font-size:13px;line-height:1.65;background:#F8FAFC;border-radius:12px\">The map library could not load. Reload the page; if this stays, report it with this exact message.</div>';
    return null;
  }
  const diag=mapDiag();
  if(diag){ el.innerHTML='<div style="height:100%;display:grid;place-items:center;padding:26px;text-align:center;'+
    'color:var(--tx-2);font-size:13px;line-height:1.65;background:#F8FAFC;border-radius:12px">'+esc(diag)+'</div>';
    el.classList.remove('leaflet-container'); return null; }
  let map=which==='main'?MAP:MAP2, layer=which==='main'?MLAYER:M2LAYER;
  if(map&&map._container!==el){ try{ map.remove(); }catch(e){} map=null; }
  if(!map){
    /* The wheel must scroll the PAGE, not zoom the map — a map that eats the
       scroll traps the reader half way down the console. Ctrl+wheel zooms. */
    map=L.map(id,{zoomControl:true,attributionControl:true,scrollWheelZoom:false});
    el.addEventListener('wheel',ev=>{ if(ev.ctrlKey){ ev.preventDefault(); map.scrollWheelZoom.enable(); }
      else map.scrollWheelZoom.disable(); },{passive:false});
    const tl=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
    /* tiles come from outside and a strict network may refuse them — the
       pins draw locally either way, and the reader is told which is which */
    let tileWarned=false;
    tl.on('tileerror',()=>{ if(tileWarned) return; tileWarned=true;
      const n=document.createElement('div');
      n.style.cssText='position:absolute;left:8px;bottom:8px;z-index:800;background:#FFF7E6;color:#7C3E06;font-size:11px;padding:4px 10px;border-radius:8px;border:1px solid #F0DCB8';
      n.textContent='The map background is blocked on this network — the pins still stand.';
      el.appendChild(n); });
    layer=L.layerGroup().addTo(map);
    if(which==='main'){MAP=map;MLAYER=layer;}else{MAP2=map;M2LAYER=layer;}
  }
  layer.clearLayers(); MARKERS=[];
  const shown=GEO.filter(passFilter);
  if(shown.length){ shown.forEach(p=>{ const mk=marker(p); MARKERS.push({p:p,mk:mk}); layer.addLayer(mk); });
    map.fitBounds(L.latLngBounds(shown.map(p=>[p.lat,p.lng])).pad(0.25)); }
  else map.setView([17.72,79.15],10);   /* Jangaon, when nothing is marked yet */
  setTimeout(()=>map.invalidateSize(),60);
  return map;
}

function briefHTML(t){
  const SEC={'THE DAY IN ONE LINE':['#2563EB','var(--blue-2)'],'THE TREND':['#5B6B84','#F1F4F8'],
    'DOING WELL':['var(--st-ok)','var(--green-2)'],'NEEDS FOCUS':['var(--st-bad)','var(--red-2)'],
    'ORDERS TO PASS':['var(--gold)','var(--amber-2)'],'WATCH':['var(--st-warn)','var(--amber-2)']};
  const names=Object.keys(SEC);
  const lines=String(t).split(/\r?\n/);
  let html='', cur=null, buf=[];
  const flush=()=>{ if(cur===null){ if(buf.join('').trim()) html+='<p style="margin:0 0 10px">'+esc(buf.join('\n').trim())+'</p>'; buf=[]; return; }
    const [col,bg]=SEC[cur];
    const body=buf.join('\n').trim();
    const items=body.split(/\n/).map(x=>x.trim()).filter(Boolean).map(x=>{
      const m=x.match(/^(\d+)\.\s*(.*)$/); if(m) return '<li style="margin:4px 0"><b style="color:'+col+'">'+m[1]+'.</b> '+esc(m[2])+'</li>';
      return '<li style="margin:4px 0;list-style:none">'+esc(x.replace(/^[\u2022\-\*]\s*/,'\u2022 '))+'</li>';});
    html+='<div style="border:1px solid var(--line);border-left:4px solid '+col+';background:'+bg+
      ';border-radius:10px;padding:10px 14px;margin:0 0 10px">'+
      '<b style="display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:'+col+';margin-bottom:5px">'+esc(cur)+'</b>'+
      (items.length?'<ul style="margin:0;padding-left:6px">'+items.join('')+'</ul>':'<span style="color:var(--tx-3);font-size:12.5px">Nothing today.</span>')+'</div>';
    buf=[]; };
  lines.forEach(ln=>{ const up=ln.trim().toUpperCase().replace(/[:.]$/,'');
    if(names.includes(up)){ flush(); cur=up; } else buf.push(ln); });
  flush();
  return html||esc(t);
}
function briefFacts(j,A){
  const L=[];
  L.push('Date: '+new Date().toDateString()+'. Month '+j.ym+'.');
  L.push('Officers on the roll: '+A.officersDue+'. Present today '+A.present+', on sanctioned leave '+A.onLeave+', not marked '+A.absent+'. Marked before 10am: '+A.by10+'.');
  const bad=j.today.present.filter(suspect);
  if(bad.length) L.push('Marks whose location cannot be trusted ('+bad.length+'): '+bad.map(r=>r.name+' of '+r.mandal+(r.acc>250?' accuracy '+Math.round(r.acc)+'m':'')+(r.tz&&!/Calcutta|Kolkata/i.test(r.tz)?' timezone '+r.tz:'')).join('; ')+'.');
  if(A.absent) L.push('Not marked today: '+j.today.absent.slice(0,40).map(o=>o.name+' ('+o.role+', '+o.mandal+')').join('; ')+'.');
  L.push('Villages evaluated this month: '+A.filed+' of '+A.cov.t+'. District average '+(A.avg==null?'n/a':A.avg)+(A.prevAvg!=null?' against '+A.prevAvg+' last month':'')+'. Grades A'+j.month.grades.A+' B'+j.month.grades.B+' C'+j.month.grades.C+' D'+j.month.grades.D+'.');
  L.push('Red-flagged villages ('+j.month.rfCount+'): '+(j.month.rows.filter(r=>String(r.rf||'').trim()).map(r=>r.gp+' RF'+r.rf+' score '+r.score).join('; ')||'none')+'.');
  const worst=[...j.month.rows].sort((a,b)=>a.score-b.score).slice(0,8);
  if(worst.length) L.push('Lowest scoring villages: '+worst.map(r=>r.gp+' ('+r.mandal+') '+r.score+'/100 grade '+r.grade+' filed by '+String(r.officer||'').replace(/\s*\(\d+\)$/,'')).join('; ')+'.');
  L.push('Mandal coverage: '+j.coverage.map(c=>c.mandal+' '+c.done+'/'+c.total).join('; ')+'. Needed per remaining working day: '+A.needPerDay+'.');
  L.push('Leave awaiting orders: '+j.leave.pending.length+(j.leave.pending.length?' — '+j.leave.pending.map(l=>l.name+' '+l.type+' '+l.days+'d').join('; '):'')+'.');
  return L.join('\n');
}

/* ---------------- the ask desk ----------------
   Everything the Collector might ask after, in one plain-text record. The
   most question-worthy sections ride first, so if the backend ever trims
   the tail it loses mark-in times, never the gaps. */
function askFacts(j,A){
  const L=[];
  const off=r=>r.name+' ('+r.role+', '+(r.mandal||'—')+')';
  L.push('AS OF '+new Date().toString().slice(0,21)+' · month under review '+j.ym+' · Jangaon district.');
  L.push('ROLL: '+A.officersDue+' officers due to mark (the Collector is not counted). TODAY: present '+A.present+', on sanctioned leave '+A.onLeave+', not marked '+A.absent+'; marked before 10am '+A.by10+'.');
  L.push('NOT MARKED TODAY ('+A.absent+'): '+(j.today.absent.map(off).join('; ')||'none')+'.');
  L.push('ON LEAVE TODAY ('+A.onLeave+'): '+(j.today.onLeave.map(r=>off(r)+(r.leaveType?' · '+r.leaveType:'')).join('; ')||'none')+'.');
  const bad=j.today.present.filter(suspect);
  L.push('MARKS WHOSE LOCATION IS NOT TRUSTWORTHY ('+bad.length+'): '+(bad.map(r=>r.name+' of '+(r.mandal||'—')).join('; ')||'none')+'.');
  const noFix=j.today.present.filter(r=>!r.verified&&!suspect(r));
  L.push('MARKED WITHOUT A LOCATION FIX ('+noFix.length+'): '+(noFix.map(r=>r.name).join('; ')||'none')+'.');
  const mm={}; j.coverage.forEach(c=>{mm[c.mandal]={p:0,l:0,a:0,done:c.done,total:c.total};});
  j.today.present.forEach(r=>{if(mm[r.mandal])mm[r.mandal].p++;});
  j.today.onLeave.forEach(r=>{if(mm[r.mandal])mm[r.mandal].l++;});
  j.today.absent.forEach(r=>{if(mm[r.mandal])mm[r.mandal].a++;});
  L.push('MANDAL TABLE (present/leave/not-marked today · villages evaluated of total): '+
    Object.keys(mm).sort().map(k=>{const v=mm[k];return k+' '+v.p+'/'+v.l+'/'+v.a+' · '+v.done+' of '+v.total;}).join('; ')+'.');
  L.push('MONTH '+j.ym+': villages evaluated '+A.filed+' of '+A.cov.t+'; district average '+(A.avg==null?'n/a':A.avg)+
    (A.prevAvg!=null?' (last month '+A.prevAvg+')':'')+'; grades A '+j.month.grades.A+', B '+j.month.grades.B+', C '+j.month.grades.C+', D '+j.month.grades.D+
    '; red-flagged '+j.month.rfCount+'; needed per remaining working day '+A.needPerDay+' ('+A.wdLeft+' working day'+(A.wdLeft>1?'s':'')+' left).');
  const fl=j.month.rows.filter(r=>String(r.rf||'').trim());
  L.push('RED-FLAG VILLAGES ('+fl.length+'): '+(fl.map(r=>r.gp+' ('+r.mandal+') RF '+r.rf+' score '+r.score).join('; ')||'none')+'.');
  if(A.off) L.push('TODAY IS OFF: '+A.off+'. Attendance is optional and not counted; no notice can arise today; any marks are voluntary.');
  if(j.notices){ const nth=x=>x+(x===1?'st':x===2?'nd':x===3?'rd':'th');
    if(j.notices.reminders) L.push('REMINDERS (informal, sent automatically, never on the register, never a deduction): sent today '+j.notices.reminders.today+', this month '+j.notices.reminders.month+'. Latest: '+((j.notices.reminders.rows||[]).slice(0,20).map(r=>r.name+' ('+(r.mandal||'—')+') '+r.date+' \u2014 '+r.reason).join('; ')||'none')+'.');
    L.push('SHOW-CAUSE NOTICES (lifecycle: the 1st and 2nd unmarked days of a month draw reminders only; the '+(j.notices.scnFrom||3)+'rd unmarked day PROPOSES a notice; nothing is served, numbered or emailed until the Collector approves on the console; from that '+(j.notices.scnFrom||3)+'rd unmarked day each further unmarked working day debits 1 CL after the day closes): awaiting the Collector\u2019s approval '+((j.notices.proposed||[]).length)+
      (((j.notices.proposed||[]).length)?' ('+j.notices.proposed.slice(0,30).map(p=>p.name+' ('+(p.mandal||'—')+') for '+p.date).join('; ')+')':'')+
      '; served today '+j.notices.today+'; served awaiting acknowledgement '+j.notices.pending+'; served this month '+j.notices.month+' with '+j.notices.debitsMonth+' CL debit(s). Latest register entries: '+
      ((j.notices.rows||[]).slice(0,25).map(n=>(n.no||'unnumbered')+' '+n.name+' ('+(n.mandal||'—')+') for '+n.date+', '+
        (n.status==='PROPOSED'?'PROPOSED (unserved)':n.status==='DROPPED'?'dropped':nth(n.seq)+' of month, '+(n.status==='ACK'?'acknowledged':'PENDING'))+
        (n.clDebited?', 1 CL debited':'')).join('; ')||'none')+'.'); }
  L.push('LEAVE AWAITING ORDERS ('+j.leave.pending.length+'): '+
    (j.leave.pending.map(l=>l.name+' ('+(l.mandal||'—')+') '+l.type+' '+l.days+'d from '+l.from+', applied '+String(l.appliedAt).slice(0,10)).join('; ')||'none')+'.');
  L.push('RECENT LEAVE ORDERS: '+(j.leave.recent.slice(0,15).map(l=>l.name+' '+l.type+' '+l.days+'d — '+l.status).join('; ')||'none')+'.');
  L.push('LAST 14 DAYS (date · present/leave): '+j.att14.map(a=>a.date.slice(5)+' '+a.present+'/'+a.leave).join('; ')+'.');
  const M=matrixData(j);
  if(M){ const low=M.rows.filter(r=>r.pct<80).slice(0,20);
    if(low.length) L.push('LOWEST ATTENDANCE OVER THE LAST '+M.wdN+' WORKING DAYS: '+
      low.map(r=>r.name+' ('+(r.mandal||'—')+') '+(r.p+r.l)+'/'+M.wdN+' = '+r.pct+'%').join('; ')+'.'); }
  L.push('VILLAGES STILL TO EVALUATE THIS MONTH, BY MANDAL: '+j.coverage.map(c=>{
    const p=c.pending||[]; return c.mandal+' ('+p.length+'): '+(p.slice(0,25).join(', ')||'—')+(p.length>25?' +'+(p.length-25)+' more':'');}).join(' | ')+'.');
  const filed=[...j.month.rows].sort((a,b)=>a.score-b.score);
  L.push('VILLAGES EVALUATED THIS MONTH ('+filed.length+'), worst first — village (mandal) score/grade[ RF] by officer on date: '+
    (filed.slice(0,320).map(r=>r.gp+' ('+r.mandal+') '+r.score+'/'+r.grade+(String(r.rf||'').trim()?' RF'+r.rf:'')+
      ' by '+String(r.officer||'').replace(/\s*\(\d+\)$/,'')+' on '+r.date).join('; ')||'none')+'.');
  L.push('PRESENT TODAY WITH MARK-IN TIME: '+
    (j.today.present.map(r=>r.name+' ('+(r.mandal||'—')+') '+hm(r.at)+((r.marks||1)>1?' ×'+r.marks:'')).join('; ')||'none')+'.');
  return L.join('\n');
}
function chatHTML(){
  if(!CHAT.length&&!ASKING)
    return '<div class="msg a" style="color:var(--tx-2)">Ask a question — the desk answers from the live figures on this screen alone, and says so where the record is silent.</div>';
  let h=CHAT.map(m=>`<div class="msg ${m.role==='user'?'q':(m.err?'err':'a')}">${esc(m.content)}</div>`).join('');

async function decideNotices(mode){
  if(NTC_DECIDING||!DATA) return;
  const ids=[...document.querySelectorAll('.ntcCk')].filter(c=>c.checked).map(c=>c.dataset.id);
  const msg=$('#ntcDecMsg');
  if(!ids.length){ if(msg) msg.textContent='Nothing is ticked.'; return; }
  if(mode==='drop' && !confirm(ids.length+' proposal(s) will be dropped — no number, never served. Proceed?')) return;
  NTC_DECIDING=true;
  if(msg) msg.textContent=(mode==='approve'?'Serving':'Dropping')+' '+ids.length+'\u2026';
  try{
    const r=await fetch(ST.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({kind:'noticeDecide',token:ST.token,
        approve:mode==='approve'?ids:[], drop:mode==='drop'?ids:[]})});
    const j=await r.json();
    if(j.ok){
      ids.forEach(id=>delete NTC_UNCHK[id]);
      const bits=[];
      if(j.served) bits.push(j.served+' served ('+j.mailed+' emailed)');
      if(j.cured) bits.push(j.cured+' cured — attendance had reached the district after all, so nothing was served');
      if(j.dropped) bits.push(j.dropped+' dropped');
      if(msg) msg.textContent=bits.join(' · ')+' · '+j.proposed+' still awaiting';
      LASTOK=0; pull();
    } else if(msg) msg.textContent='Refused: '+(j.error||'unknown')+(/unknown request/i.test(String(j.error))?' — the Sheet needs the 6.7 Code.gs.':'');
  }catch(e){ if(msg) msg.textContent='Could not reach the Sheet — try again.'; }
  NTC_DECIDING=false;
}
async function sendAsk(q){
  q=String(q||'').trim(); if(!q||ASKING||!DATA) return;
  CHAT.push({role:'user',content:q}); ASKING=true; render(DATA); scrollChat();
  try{
    const A=analyse(DATA);
    const hist=CHAT.filter(m=>!m.err).slice(-8).map(m=>({role:m.role,content:m.content}));
    const r=await fetch(ST.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({kind:'ask',token:ST.token,facts:askFacts(DATA,A),messages:hist})});
    const j=await r.json();
    if(j.ok) CHAT.push({role:'assistant',content:j.text||'(no answer)'});
    else{
      const e=String(j.error||'refused'); let cure='';
      if(/UrlFetchApp|external_request|permission/i.test(e))
        cure=' Run authoriseBriefing once in Apps Script and redeploy — the briefing button above carries the full steps.';
      else if(/No briefing key/i.test(e))
        cure=' Set ANTHROPIC_API_KEY with setBriefKey in Apps Script.';
      else if(/unknown request/i.test(e))
        cure=' The Sheet is running an older Code.gs — paste the 6.5 backend and deploy a new version; the rest of the console works meanwhile.';
      CHAT.push({role:'assistant',err:true,content:'Could not answer: '+e+cure});
    }
  }catch(e){ CHAT.push({role:'assistant',err:true,content:'Could not reach the district: '+e.message}); }
  ASKING=false; if(DATA) render(DATA); scrollChat();
}

const ROSTER_HEAD=['Officer','Role','Mandal','Status','Leave type','Marked at','Marks','Location','Latitude','Longitude','± m'];
function matrixData(j){
  if(!j||!j.attm||!Array.isArray(j.attm.dates)||!Array.isArray(j.attm.rows)||!j.attm.rows.length) return null;
  const dates=j.attm.dates, hol={};
  (j.attm.off||[]).forEach(d=>hol[d]=true);
  const offd=dates.map(d=>new Date(d+'T00:00:00').getDay()===0||!!hol[d]);   /* Sunday or Holidays-tab date */
  const sun=dates.map(d=>new Date(d+'T00:00:00').getDay()===0);
  const wdN=offd.filter(s=>!s).length;
  const rows=j.attm.rows.map(r=>{
    const name=r[0],role=r[1],mandal=r[2],days=String(r[3]||'');
    let pw=0,lw=0;
    const cells=dates.map((d,i)=>{const c=days[i]||'-';
      if(c==='P'){ if(!offd[i])pw++; return 'P'; }
      if(c==='L'){ if(!offd[i])lw++; return 'L'; }
      return sun[i]?'S':hol[d]?'H':'A'; });
    const aw=Math.max(0,wdN-pw-lw);
    return {name,role,mandal,cells,p:pw,l:lw,a:aw,pct:wdN?Math.round((pw+lw)*100/wdN):0};
  }).sort((x,y)=>x.pct-y.pct||String(x.mandal).localeCompare(String(y.mandal))||String(x.name).localeCompare(String(y.name)));
  return {dates,sun,offd,hol,rows,wdN};
}
function matrixRows(M){

    .concat(['Present','Leave','Not marked','Attendance %']);
  const rows=M.rows.map(r=>[r.name,r.role,r.mandal||''].concat(r.cells).concat([r.p,r.l,r.a,r.pct+'%']));
  rows.push([]); rows.push(['P present · L on leave · A not marked · S Sunday · H holiday','','','% counts working days only — Sundays and holidays are excluded']);
  return [head].concat(rows);

function mandalCompare(j){
  const m={}; const bump=(r,k)=>{const mm=r.mandal||'—'; m[mm]=m[mm]||{p:0,l:0,a:0,p14:0,w14:0}; m[mm][k]++;};
  j.today.present.forEach(r=>bump(r,'p')); j.today.onLeave.forEach(r=>bump(r,'l')); j.today.absent.forEach(r=>bump(r,'a'));
  const M=matrixData(j);
  if(M) M.rows.forEach(r=>{const mm=r.mandal||'—'; m[mm]=m[mm]||{p:0,l:0,a:0,p14:0,w14:0}; m[mm].p14+=r.p+r.l; m[mm].w14+=M.wdN;});
  return Object.keys(m).sort().map(k=>{const v=m[k],t=v.p+v.l+v.a;
    return [k,t,v.p,v.l,v.a,t?Math.round((v.p+v.l)*100/t)+'%':'—',v.w14?Math.round(v.p14*100/v.w14)+'%':'—'];});
}
function loadXLSX(){
  /* the Excel writer ships WITH the app and loads from our own address —

     hosts left the Collector pressing a button that did nothing. */
  if(window.XLSX) return Promise.resolve();
  if(XLSXP) return XLSXP;
  const tryScript=src=>new Promise((res,rej)=>{const s=document.createElement('script');
    s.src=src; s.onload=()=>res(); s.onerror=()=>{s.remove(); rej();}; document.head.appendChild(s);});

  rows.forEach(r=>{ byM[r.mandal]=byM[r.mandal]||{sum:0,n:0,rf:0};
    byM[r.mandal].sum+=r.score; byM[r.mandal].n++; if(String(r.rf||'').trim())byM[r.mandal].rf++; });
  const ms=Object.entries(byM).map(([k,v])=>({k,avg:Math.round(v.sum/v.n),n:v.n,rf:v.rf}))
    .filter(m=>m.n>=1).sort((a,b)=>b.avg-a.avg);
  const line=(lbl,name,sub,val,col)=>`<div style="display:flex;align-items:baseline;gap:9px;padding:7px 0;border-bottom:1px solid var(--line-2)">
    <span style="font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx-3);width:74px;flex:none">${lbl}</span>
    <div style="min-width:0;flex:1"><b style="font-size:13px">${esc(name)}</b>
      <span style="display:block;font-size:11.5px;color:var(--tx-3)">${esc(sub)}</span></div>
    <b style="font-family:var(--mono);font-size:16px;color:${col}">${val}</b></div>`;
  let h='<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:6px">';
  h+=line('Best village', s[0].gp, s[0].mandal+' · '+String(s[0].officer||'').replace(/\s*\(\d+\)$/,''), s[0].score, 'var(--green)');
  h+=line('Worst village', s[s.length-1].gp, s[s.length-1].mandal+' · '+String(s[s.length-1].officer||'').replace(/\s*\(\d+\)$/,''), s[s.length-1].score, 'var(--red)');
  if(ms.length){
    h+=line('Best mandal', ms[0].k, ms[0].n+' filed'+(ms[0].rf?' · '+ms[0].rf+' flagged':''), ms[0].avg, 'var(--green)');
    const w=ms[ms.length-1];
    h+=line('Worst mandal', w.k, w.n+' filed'+(w.rf?' · '+w.rf+' flagged':''), w.avg, 'var(--red)');
  }
  const flagged=rows.filter(r=>String(r.rf||'').trim());
  h+=`<div style="padding:9px 0 2px;font-size:12px;color:var(--tx-2)">
    Spread ${s[s.length-1].score}–${s[0].score} · median ${s[Math.floor(s.length/2)].score}
    ${flagged.length?' · '+flagged.length+' flagged':''}</div></div>`;
  return h;
}
/* DISTRICT HEALTH. This was a ring with a number in the hole — a two-slice
   donut, which is a stat tile in a costume: it spends a whole card drawing
   one figure worse than the figure would read on its own. A meter says the
   same thing plainly, and has room to name what the score is out of. */
function donutHealth(v){
  const col = v >= 80 ? Charts.ST.ok : v >= 60 ? Charts.ST.warn : Charts.ST.bad;
  return Charts.meter(clamp(v, 0, 100), 100, {
    color: col, show: v, unit: '',
    sub: 'out of 100 · ' + (v >= 80 ? 'sound' : v >= 60 ? 'needs watching' : 'needs orders')
  });
}

/* ============================================================================
 * GPDP AND ADVISORY · the two registers of documents
 * ----------------------------------------------------------------------------
 * Both answer one question the Collector asks out loud: who has, and who has
 * not. Both are read from their own endpoint rather than the dashboard
 * payload, because neither changes minute to minute and the dashboard cache is
 * already at its ceiling.
 * ========================================================================== */
let GPDP=null, ADV=null, GPFILTER='all', ADVFILTER='all', GPBUSY=false, ADVBUSY=false;

function pullGpdp(){
  return fetch(ST.url+'?op=gpdp&token='+encodeURIComponent(ST.token))
    .then(r=>r.json()).then(j=>{ if(j&&j.ok){ GPDP=j; if(VIEW==='gpdp'&&DATA) render(DATA); } })
    .catch(()=>{});
}
function pullAdv(){
  return fetch(ST.url+'?op=advisory&token='+encodeURIComponent(ST.token))
    .then(r=>r.json()).then(j=>{ if(j&&j.ok){ ADV=j; if(VIEW==='advisory'&&DATA) render(DATA); } })
    .catch(()=>{});
}
const docWhen = s => { const d=new Date(s); return isNaN(d) ? '' : (dm(String(s).slice(0,10))+' '+hm(s)); };

  h+=kpi('Still to file',IC.u,T.pending,'', T.pending?'tap for the names':'every officer has filed','gp:pending');
  h+=kpi('Coverage',IC.s,pct(T.uploaded,Math.max(1,T.due))+'%','', 'of the officers called for','');
  h+=kpi('Accepted formats',IC.c,(GPDP.accepts||[]).length,'', (GPDP.accepts||[]).join(' · ')+' · up to '+GPDP.maxMB+' MB','');
  h+=kpi('Held in Drive',IC.h,T.uploaded,'', GPDP.folderUrl?'tap to open the folder':'no folder yet',

  h+='</div>';

  h+=panel('c5','Mandal by mandal','filed of called for',
    '<div class="plot">'+Charts.stackRows((GPDP.coverage||[]).map(c=>({

       .map(([k,n,c])=>`<button class="fchip" data-gpf="${k}" aria-pressed="${GPFILTER===k}">${n} <b>${c}</b></button>`).join('')+
     `<button class="fchip" id="gpCsv">CSV of this register</button>
      ${GPDP.folderUrl?`<a class="fchip" href="${esc(GPDP.folderUrl)}" target="_blank" rel="noopener">Open the Drive folder</a>`:''}
