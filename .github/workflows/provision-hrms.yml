# ============================================================================
# STAND UP THE DISTRICT HRMS REGISTER — once, from a button.
# ----------------------------------------------------------------------------
# Steps 1 to 4 of DEPLOY-HRMS.md, done by the pipeline instead of by an
# evening in the browser. It:
#
#   1. creates a new Google Sheet with an Apps Script project bound to it,
#      under the SAME account that owns the other two registers — the one
#      CLASPRC_JSON belongs to, not whichever account a laptop is logged in as;
#   2. writes ONE generated line telling that project it is the HRMS register;
#   3. records the project in hrms/project.json and commits it AT ONCE, before
#      anything that can fail, so a second run resumes rather than making a
#      second register;
#   4. pushes backend/ and deploys it as a web app;
#   5. asks the new address what register it is, and does not call the job done
#      unless it says HRMS — all three projects run identical backend files, so
#      "ok:true" proves only that something answered;
#   6. commits hrms/config.js, which is what makes the app appear at /hrms/.
#
# WHAT IT DELIBERATELY DOES NOT DO: put one employee on the roll. The
# establishment is pasted into the console over HTTPS under the Collector's own
# token (step 6 of the document) and never through this public repository, the
# same rule the two rosters have. His own first row is typed by hand into the
# Users tab (step 5) and claimed from the app — he writes the row and he claims
# it, both halves himself.
#
# AND THERE IS NO BOOTSTRAP KEY. The Gram Palana pipeline planted one in the
# project it created so that 134 personal mobile numbers could be posted
# straight to an empty register. This register needs none: the establishment
# comes through the console under a token, so there is nothing for a key to
# carry. A key never planted is a key that cannot be left behind in a live
# project.
#
# THE SALT IS NOT SET HERE EITHER, because the register mints its own on the
# first request that needs one — under a lock, into Script Properties, and
# nowhere else. Asking a person to invent one is the step most likely to be
# skipped, mistyped, or copied from another register, which would make the same
# PIN hash identically on two of them.
#
# IT REFUSES TO MAKE A SECOND REGISTER. hrms/project.json is written and
# committed in the same step as creation, so a run that falls over at the
# consent screen is COMPLETED by the next one rather than restarted. Creation
# is the one act here that cannot be undone by repeating it: a second Sheet
# would orphan the first with the establishment in it.
# ============================================================================
name: Provision the District HRMS register

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Name for the new Google Sheet'
        required: true
        default: 'District HRMS - Jangaon'
      confirm:
        description: 'Type the word CREATE here. It makes a new Sheet and Apps Script project in the district Drive.'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  provision:
    name: Create, push, deploy and publish
    runs-on: ubuntu-latest
    steps:
      # THE BOX IS A SPEED BUMP, NOT A SPELLING TEST. It exists so that
      # creating a Google Sheet and an Apps Script project in the district's
      # Drive is a deliberate act and never an accidental click. A trailing
      # space, or the word in lower case, is a man who meant it — refusing
      # those costs a wasted run and teaches nothing. Typing the word is still
      # required, which is the whole of the safeguard.
      - name: Refuse unless confirmed
        id: confirm
        run: |
          SAID=$(printf '%s' "${{ github.event.inputs.confirm }}" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          if [ "$SAID" != "CREATE" ]; then
            echo "::error::The confirm box must say CREATE. It said '${{ github.event.inputs.confirm }}'. Nothing has been created; run the workflow again with the word typed in."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Sign in with the stored credential
        run: |
          if [ -z '${{ secrets.CLASPRC_JSON }}' ]; then
            echo "::error::CLASPRC_JSON is not set. It is the stored Google credential the other two registers deploy with; without it this cannot create anything."
            exit 1
          fi
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Assemble what the new project will hold
        run: |
          mkdir -p hrmsbuild
          # EVERY .gs, NOT A LIST OF NAMES. The Gram Palana pipeline named
          # three files and got away with it only because the first routine
          # deploy copies backend/*.gs and quietly repaired it. This register
          # cannot get away with it: FeatureHrms.gs IS the register — the
          # employee's claim, the establishment, the enrolment code and the
          # Collector's bounded read of what is waiting for orders. Provisioned
          # without it the register would answer, report itself as HRMS, and be
          # unable to enrol one employee or sanction one day of leave.
          cp backend/*.gs backend/appsscript.json hrmsbuild/
          # THE ONE GENERATED LINE. It lives here and never in backend/, so the
          # sanitation register's deploy job — rootDir: backend — cannot pick it
          # up even by accident. The register writes what it is onto its own
          # bound spreadsheet's Config tab the first time it reads this, so the
          # identity survives a deploy that forgot to assemble the file.
          {
            echo "/* Written by the provisioning pipeline. This file exists ONLY in the"
            echo "   District HRMS project and is never in backend/, so it cannot reach"
            echo "   either of the other two registers. A Script Property named TENANT,"
            echo "   and the Config tab of the bound spreadsheet, both outrank it. */"
            echo "var TENANT_OVERLAY = 'HRMS';"
          } > hrmsbuild/Tenant.gs
          echo "--- hrmsbuild ---"; ls -1 hrmsbuild

      # CREATION AND THE RECORD OF IT ARE ONE STEP. The Gram Palana pipeline
      # guarded against a second register with a repository VARIABLE that a
      # person had to set afterwards — so a run that stopped at the consent
      # screen, which is the usual way a first run stops, could be re-run and
      # make a second Sheet. The record is committed here instead, by the
      # pipeline, before anything that can fail.
      - name: Create the Sheet and its bound project, if it does not exist yet
        id: create
        run: |
          if [ -f hrms/project.json ]; then
            SID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('hrms/project.json','utf8')).scriptId)")
            echo "script_id=$SID" >> "$GITHUB_OUTPUT"
            echo "Already created: $SID - resuming rather than making a second register."
            exit 0
          fi
          clasp create --type sheets --title "${{ github.event.inputs.title }}" --rootDir hrmsbuild
          # clasp writes .clasp.json INTO --rootDir, not into the working
          # directory. Reading it from the wrong place once failed a run whose
          # Sheet and script had in fact been created perfectly well.
          CJ=hrmsbuild/.clasp.json; [ -f "$CJ" ] || CJ=.clasp.json
          SID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$CJ','utf8')).scriptId)")
          echo "script_id=$SID" >> "$GITHUB_OUTPUT"
          mkdir -p hrms
          node -e "require('fs').writeFileSync('hrms/project.json', JSON.stringify({scriptId:process.argv[1],note:'Written by provision-hrms. The deploy pipeline reads this to keep the HRMS backend up to date, and its absence is what tells the pipeline the register has not been stood up. A script id is not a credential: access to the project is governed by Drive, and the live /exec address in config.js is public already.'},null,2)+String.fromCharCode(10))" "$SID"
          git config user.name  "SJGP deploy"
          git config user.email "deploy@users.noreply.github.com"
          git add hrms/project.json
          git commit -m "provision: the District HRMS project exists, recorded before anything that can fail"
          git pull --rebase --autostash || true
          git push
          echo "Created script $SID, and recorded it."

      - name: Point clasp at the project
        run: |
          printf '{"scriptId":"%s","rootDir":"hrmsbuild"}\n' "${{ steps.create.outputs.script_id }}" > .clasp.json
          rm -f hrmsbuild/.clasp.json
          cat .clasp.json

      - name: Push the backend into it
        run: clasp push --force

      - name: Deploy it as a web app
        id: deploy
        run: |
          OUT=$(clasp deploy -d "provisioned by the pipeline, run ${{ github.run_number }}")
          echo "$OUT"
          DID=$(echo "$OUT" | grep -oE 'AKfyc[A-Za-z0-9_-]+' | head -n1)
          if [ -z "$DID" ]; then echo "::error::clasp did not report a deployment id."; exit 1; fi
          echo "deployment_id=$DID" >> "$GITHUB_OUTPUT"
          echo "exec_url=https://script.google.com/macros/s/$DID/exec" >> "$GITHUB_OUTPUT"

      - name: Ask the new address what register it is
        id: verify
        continue-on-error: true
        run: |
          URL='${{ steps.deploy.outputs.exec_url }}?op=diag'
          for i in 1 2 3 4 5 6 7 8; do
            sleep 15
            OUT=$(curl -sL --max-time 45 "$URL" || true)
            if echo "$OUT" | grep -q '"tenant":"HRMS"'; then
              echo "It answered, and it knows it is the District HRMS register."
              echo "ok=yes" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if echo "$OUT" | grep -q '"ok":true'; then
              echo "::warning::It answered but does not report tenant HRMS."
              echo "$OUT" | head -c 300; echo
            fi
            echo "attempt $i: $(echo "$OUT" | tr -d '\n' | head -c 140)"
          done
          echo "ok=no" >> "$GITHUB_OUTPUT"
          echo "::warning::The new web app has not answered yet. A first deployment has to have its OAuth scopes approved once in the browser - open the script, Run any function, accept. There is no API for granting consent; it is a security boundary, not a gap. Then re-run this workflow: the project is already recorded, so it resumes and makes nothing twice."

      # NOTHING IS PUBLISHED AT /hrms/ UNTIL THE SERVER ANSWERS AS HRMS. An app
      # whose backend returns 403 is worse than no app: an employee installs it,
      # cannot sign in, and stops trusting the register. And an app pointed at a
      # server that reports itself as SJGP would file the district's leave into
      # the sanitation register, which is the one mistake the whole isolation
      # exists to prevent.
      - name: Publish the app by committing hrms/config.js
        if: steps.verify.outputs.ok == 'yes'
        run: |
          mkdir -p hrms
          {
            echo "/* Written by the provisioning pipeline, run ${{ github.run_number }}."
            echo "   A publish never carries config.js, so nothing here is overwritten."
            echo ""
            echo "   There is no SJGP_TENANT here: this app serves one register and one"
            echo "   only. What register the SERVER is remains its own business, and the"
            echo "   app has no say in it. */"
            echo "window.SJGP_SERVER = '${{ steps.deploy.outputs.exec_url }}';"
          } > hrms/config.js
          node -e "const f='hrms/project.json',fs=require('fs');const j=JSON.parse(fs.readFileSync(f,'utf8'));j.deploymentId=process.argv[1];j.execUrl=process.argv[2];fs.writeFileSync(f,JSON.stringify(j,null,2)+String.fromCharCode(10))" "${{ steps.deploy.outputs.deployment_id }}" "${{ steps.deploy.outputs.exec_url }}"
          git config user.name  "SJGP deploy"
          git config user.email "deploy@users.noreply.github.com"
          git add hrms/config.js hrms/project.json
          git diff --staged --quiet || git commit -m "provision: the District HRMS register is live at /hrms/"
          git pull --rebase --autostash || true
          git push

      # AND IT SAYS WHERE IT GOT TO ON THE PAGE, NOT ONLY IN THE LOG. The one
      # thing a half-finished run needs is a link to the consent screen, and
      # putting it forty lines down a collapsed log is how a register sits
      # unprovisioned for a week. This runs whatever happened above.
      - name: Say where this got to, in the run summary
        if: always()
        run: |
          S="$GITHUB_STEP_SUMMARY"
          SID='${{ steps.create.outputs.script_id }}'
          EXEC='${{ steps.deploy.outputs.exec_url }}'
          if [ "${{ steps.verify.outputs.ok }}" = "yes" ]; then
            {
              echo "# The District HRMS register is stood up"
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| App | https://jangaoncdm.github.io/sjscore-app/hrms/ |"
              echo "| Console | https://jangaoncdm.github.io/sjscore-app/dashboard.html |"
              echo "| Server | \`$EXEC\` |"
              echo "| Script | https://script.google.com/d/$SID/edit |"
              echo ""
              echo "It answered \`\"tenant\":\"HRMS\"\`, so \`hrms/config.js\` has been"
              echo "committed and the app is published. Give the deploy run a minute to"
              echo "put the site up."
              echo ""
              echo "## Two things remain, both deliberate"
              echo ""
              echo "**1. Your own row, by hand.** Open the new Sheet, go to the \`Users\`"
              echo "tab, and type one row — the number, the name, Role \`COLLECTOR\`,"
              echo "Active \`TRUE\`, an \`EmpId\` of your choosing, and **Hash left empty**."
              echo "Then open \`/hrms/\` and claim it: the app asks for that \`EmpId\` and"
              echo "lets you choose your own PIN. Nobody issues it to you and the"
              echo "register keeps no copy. Step 5 of DEPLOY-HRMS.md has the exact row."
              echo ""
              echo "**2. The establishment, through the console.** Switch the register"
              echo "picker to District HRMS and paste the office list there. It goes from"
              echo "your screen to your register over HTTPS and through nothing else:"
              echo "those are personal mobile numbers and this repository is public."
            } >> "$S"
          elif [ -n "$SID" ]; then
            {
              echo "# Stopped one click short"
              echo ""
              # THE ADVICE MATCHES WHAT ACTUALLY STOPPED. A deployment that
              # never happened is not a consent screen, and telling him to
              # accept permissions that are not the obstacle sends him round
              # a loop that cannot end.
              if [ -n "$EXEC" ]; then
                echo "The project and the deployment exist. The new web app has not"
                echo "answered as HRMS yet, which on a first run almost always means its"
                echo "OAuth scopes have not been approved — a newly created web app"
                echo "returns 403 until a person accepts them, and there is no API for"
                echo "granting consent. It is a security boundary, not a gap."
                echo ""
                echo "## Do this"
                echo ""
                echo "1. Open **https://script.google.com/d/$SID/edit**"
                echo "2. Press **Run** on any function and **accept** the permissions."
                echo "3. **Re-run this workflow.**"
              else
                echo "The project exists but the deployment did not complete, so there"
                echo "is no address to ask anything of yet. This is not the consent"
                echo "screen; the log above says what happened."
                echo ""
                echo "## Do this"
                echo ""
                echo "1. Read the failing step in the log above."
                echo "2. **Re-run this workflow** once the cause is dealt with."
              fi
              echo ""
              echo "Either way it **resumes on the same project** —"
              echo "\`hrms/project.json\` was committed before anything that could fail,"
              echo "so nothing is created twice and no second register can appear."
              echo ""
              echo "Nothing is published at \`/hrms/\` until the address answers as"
              echo "HRMS, so no employee can reach a half-made register in the meantime."
            } >> "$S"
          elif [ "${{ steps.confirm.outcome }}" = "failure" ]; then
            # A SUMMARY THAT GUESSES AT THE CAUSE IS WORSE THAN ONE THAT SAYS
            # NOTHING. The first cut of this had only two branches, and when
            # the run stopped at the confirm box it told the district its
            # Google credential had expired — sending him to look at the one
            # thing that was in perfect order while the real reason sat in the
            # annotation directly above. The same uselessness as a decoder
            # that says only "no code found".
            {
              echo "# The confirm box did not say CREATE"
              echo ""
              echo "Nothing was created, nothing was touched, and there is nothing to"
              echo "clean up. The box is there so that making a Google Sheet and an"
              echo "Apps Script project in the district's Drive is a deliberate act."
              echo ""
              echo "## Do this"
              echo ""
              echo "**Run workflow** again, and type **\`CREATE\`** in the second box"
              echo "before pressing the green button. Capitals are not required and a"
              echo "stray space does not matter; the word does."
            } >> "$S"
          else
            {
              echo "# Nothing was created"
              echo ""
              echo "The run stopped before the project was made, so there is nothing to"
              echo "clean up and nothing was half-done. **The failing step in the log"
              echo "above says why** — do not take a guess from this page. If it is the"
              echo "\`clasp\` sign-in, the stored Google credential (\`CLASPRC_JSON\`) has"
              echo "expired and DEPLOY-HRMS.md section 2 is the way through by hand."
            } >> "$S"
          fi

      # AND IT ONLY SAYS SO IF IT IS. Without this condition the step ran
      # whatever the verification found — continue-on-error means a register
      # that never answered does not stop the run — and printed "the District
      # HRMS register is stood up" over a 403.
      - name: What is left to a person
        if: steps.verify.outputs.ok == 'yes'
        run: |
          echo "=============================================================="
          echo " The District HRMS register is stood up."
          echo ""
          echo "   Script  https://script.google.com/d/${{ steps.create.outputs.script_id }}/edit"
          echo "   Server  ${{ steps.deploy.outputs.exec_url }}"
          echo "   App     https://jangaoncdm.github.io/sjscore-app/hrms/"
          echo "   Console https://jangaoncdm.github.io/sjscore-app/dashboard.html"
          echo ""
          echo " TWO THINGS REMAIN, and both are deliberate:"
          echo ""
          echo " 1. YOUR OWN ROW, BY HAND. Open the new Sheet, go to the Users"
          echo "    tab, and type one row: the number, the name, Role COLLECTOR,"
          echo "    Active TRUE, an EmpId of your choosing, and Hash left EMPTY."
          echo "    Then open /hrms/ and claim it - the app asks for that EmpId"
          echo "    and lets you choose your own PIN. Nobody issues it to you."
          echo "    Step 5 of DEPLOY-HRMS.md has the exact row."
          echo ""
          echo " 2. THE ESTABLISHMENT, through the console. Switch the register"
          echo "    picker to District HRMS and paste the office list there. It"
          echo "    travels from your screen to your register over HTTPS and"
          echo "    through nothing else: those are personal mobile numbers and"
          echo "    this repository is public."
          echo ""
          echo " The register makes its own salt on first use. Nothing to paste,"
          echo " no Script Property to set, no bootstrap key anywhere."
          echo "=============================================================="
