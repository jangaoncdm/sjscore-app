# ============================================================================
# SJGP — one commit, everything deployed
# ----------------------------------------------------------------------------
# What this does when anything is committed to main:
#   1. copies the files in app/ to the root of the site, so GitHub Pages
#      publishes the new app and console — but NEVER touches config.js,
#      which holds the district's server address;
#   2. pushes backend/Code.gs and backend/Admin.gs into the Apps Script
#      project and creates a NEW DEPLOYMENT VERSION, which is the step that
#      actually puts the backend live;
#   3. refuses the whole run if a secret has crept into the repository.
#
# One-time setup is in DEPLOY.md. After that there is nothing to paste, no
# SALT to restore, and no Deploy menu to click.
# ============================================================================
name: Deploy SJGP
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  guard:
    name: Tests and secret check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: No real SALT anywhere in the repository
        run: |
          BAD=$(grep -rIn --exclude-dir=.git --exclude-dir=.github \
                 -E "SALT_FALLBACK[[:space:]]*=[[:space:]]*'" . 2>/dev/null \
                 | grep -v "CHANGE-THIS-LONG-RANDOM-SALT" || true)
          if [ -n "$BAD" ]; then
            echo "$BAD"
            echo "::error::A real salt is present in the repository. It belongs in Script Properties."
            exit 1
          fi
          if grep -rIn --exclude-dir=.git -E "ANTHROPIC_API_KEY[[:space:]]*=[[:space:]]*'sk-" . ; then
            echo "::error::An API key is present in the repository."
            exit 1
          fi
          echo "Clean."
      - name: The whole suite, against the real backend files
        run: npm test

  site:
    name: Publish the app and console
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Copy app/ to the site root, leaving config.js alone
        run: |
          for f in index.html app.js sw.js dashboard.html manifest.webmanifest privacy.html xlsx.full.min.js; do
            [ -f "app/$f" ] && cp "app/$f" "./$f" && echo "published $f"
          done
          [ -d app/icons ] && cp -r app/icons ./ || true
          [ -d app/screenshots ] && cp -r app/screenshots ./ || true
          if [ ! -f config.js ]; then
            echo "::error::config.js is missing. Copy app/config.example.js to config.js once, with the district's /exec address."
            exit 1
          fi
      - name: Publish the Gram Palana app to gp/, leaving its config.js alone
        # THE SECOND REGISTER IS THE SAME BYTES AT A SECOND ADDRESS. Its
        # config.js says which register it is and where its server lives, and
        # like the root one it is never carried by a publish. The console is
        # NOT copied: there is one console, it is the Collector's, and it
        # reaches the second register through its tenant switch.
        #
        # It publishes only once gp/config.js exists, so nothing appears at
        # /gp/ until the district has actually made the deployment. A folder
        # of app that answers to no server is worse than no folder.
        run: |
          if [ ! -f gp/config.js ]; then
            echo "gp/config.js does not exist yet — the Gram Palana app is not published. See DEPLOY-GP.md."
            exit 0
          fi
          mkdir -p gp
          for f in index.html app.js sw.js; do
            [ -f "app/$f" ] && cp "app/$f" "gp/$f" && echo "published gp/$f"
          done
          # THE MANIFEST AND THE PRIVACY PAGE ARE THIS REGISTER'S OWN, and are
          # the two files that are NOT the same bytes. Publishing the
          # sanitation manifest here put both registers on the identical
          # "id": in.jangaon.sjscore -- an id is resolved against the ORIGIN
          # and not the folder, so the browser saw one installable app, on the
          # one device that has to hold both: the Collector's. It also named
          # the Gram Palana app "SJGP" on the officer's home screen and
          # described it as a sanitation evaluation it does not take.
          cp app/manifest-gp.webmanifest gp/manifest.webmanifest && echo "published gp/manifest.webmanifest"
          cp app/privacy-gp.html         gp/privacy.html        && echo "published gp/privacy.html"
          [ -d app/icons ] && cp -r app/icons gp/ || true
      - name: Commit whatever changed
        # The commit message travels as an environment variable, never pasted
        # into the script: a ${{ }} substitution is raw text, and a message
        # carrying quotes once broke the shell and failed the whole publish.
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          git config user.name  "SJGP deploy"
          git config user.email "deploy@users.noreply.github.com"
          git add -A ':!backend' ':!.github'
          git diff --staged --quiet || git commit -m "publish: $(printf '%s' "$MSG" | head -n 1)"
          git push

  # THE SAME Code.gs GOES TO BOTH PROJECTS. Which register a project is, is a
  # Script Property on it (TENANT=GP) and never a line in the file — so there
  # is no build to get wrong, and no way for a GP-shaped file to reach the
  # sanitation project. This job does nothing at all until GP_SCRIPT_ID is set.
  backend-gp:
    name: Push and deploy the Gram Palana backend
    needs: guard
    runs-on: ubuntu-latest
    if: ${{ vars.GP_SCRIPT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2
      - name: Sign in with the stored credential
        run: echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json
      - name: Push the code, WITH the line that says which register this is
        run: |
          # `clasp push --force` DELETES REMOTE FILES THAT ARE NOT PRESENT
          # LOCALLY. Pushing rootDir: backend therefore removed Tenant.gs from
          # the Gram Palana project on the first routine deploy after it was
          # provisioned, and the register quietly reverted to reporting itself
          # as SJGP — which would have switched the show-cause ladder ON for
          # Gram Palana Officers, who are expressly not under it.
          #
          # The verify step below caught it, which is the only reason this is a
          # footnote rather than an incident. Every deploy now re-assembles the
          # overlay alongside backend/, so the identity cannot be pushed away.
          mkdir -p gpbuild
          cp backend/Code.gs backend/Admin.gs backend/appsscript.json gpbuild/
          {
            echo "/* Written by the deploy pipeline. This file exists ONLY in the Gram"
            echo "   Panchayat project — it is assembled here and is never in backend/,"
            echo "   so it cannot reach the sanitation register. A Script Property named"
            echo "   TENANT, and the Config tab of the bound spreadsheet, both outrank it. */"
            echo "var TENANT_OVERLAY = 'GP';"
          } > gpbuild/Tenant.gs
          printf '{"scriptId":"%s","rootDir":"gpbuild"}\n' "${{ vars.GP_SCRIPT_ID }}" > .clasp.json
          clasp push --force
      - name: Deploy a new version
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          clasp deploy -i "${{ vars.GP_DEPLOYMENT_ID }}" -d "auto ${{ github.run_number }}: $(printf '%s' "$MSG" | head -n 1 | cut -c1-120)"
      - name: Confirm the Gram Palana register is answering, AND that it knows which register it is
        # The stamp alone is not enough here. Both projects run the same bytes,
        # so a diag that says ok:true proves only that SOMETHING answered — it
        # would say exactly the same if TENANT had never been set and the GP
        # address were serving the sanitation register's shape. The tenant is
        # read back and checked by name.
        run: |
          URL="${{ vars.GP_EXEC_URL }}?op=diag"
          # NOT YET AUTHORISED IS NOT A REGRESSION. A newly created web app
          # returns 403 and a Google consent page until its OAuth scopes are
          # approved once in a browser, and there is no API for granting
          # consent — it is a security boundary, not a gap. Failing the whole
          # pipeline for it turns every push red and mails the district about
          # a register that is simply waiting for a click, which is how people
          # learn to ignore a red build. It warns, and says exactly what to do.
          # Anything else still fails: once the register has answered, a
          # silence from it is a real fault.
          CODE=$(curl -sL -o /tmp/gp.out -w '%{http_code}' --max-time 45 "$URL" || echo 000)
          if [ "$CODE" = "403" ] && grep -qi 'accounts.google\|ppConfig\|permission' /tmp/gp.out; then
            echo "::warning::The Gram Palana register is deployed but its scopes have not been approved yet, so it answers 403. Open https://script.google.com/d/${{ vars.GP_SCRIPT_ID }}/edit , run any function once and accept the permissions. Nothing else is outstanding; re-run this workflow afterwards."
            exit 0
          fi
          for i in 1 2 3 4 5 6; do
            sleep 15
            OUT=$(curl -sL --max-time 45 "$URL" || true)
            if echo "$OUT" | grep -q '"ok":true'; then
              if echo "$OUT" | grep -q '"tenant":"GP"'; then
                echo "The Gram Palana register answered on attempt $i, and knows it is GP."
                exit 0
              fi
              echo "::error::That address answered, but it does NOT report tenant GP. Set the Script Property TENANT=GP on the GP project before anyone signs in."
              echo "$OUT" | tr -d '\n' | head -c 200
              exit 1
            fi
            echo "attempt $i: not yet — $(echo "$OUT" | tr -d '\n' | head -c 100)"
          done
          echo "::error::The Gram Palana register did not answer with ok:true after deploying."
          exit 1

  backend:
    name: Push and deploy the Apps Script backend
    needs: guard
    runs-on: ubuntu-latest
    if: ${{ vars.SJGP_SCRIPT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2
      - name: Sign in with the stored credential
        run: echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json
      - name: Push the code
        run: |
          printf '{"scriptId":"%s","rootDir":"backend"}\n' "${{ vars.SJGP_SCRIPT_ID }}" > .clasp.json
          clasp push --force
      - name: Deploy a new version
        # Same rule as the publish step: the message rides an environment
        # variable, first line only, so no commit message can break the shell.
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          clasp deploy -i "${{ vars.SJGP_DEPLOYMENT_ID }}" -d "auto ${{ github.run_number }}: $(printf '%s' "$MSG" | head -n 1 | cut -c1-120)"
      - name: Confirm the district is answering on the new code
        # Six attempts over ~two minutes, because Google's /exec endpoint can
        # serve a transient "unable to open the file" page for a short while
        # after a fresh deployment — one such page once failed a run whose
        # deploy had in fact fully landed.
        run: |
          URL="${{ vars.SJGP_EXEC_URL }}?op=diag"
          for i in 1 2 3 4 5 6; do
            sleep 15
            OUT=$(curl -sL --max-time 45 "$URL" || true)
            if echo "$OUT" | grep -q '"ok":true'; then echo "The district answered on attempt $i."; exit 0; fi
            echo "attempt $i: not yet — $(echo "$OUT" | tr -d '\n' | head -c 100)"
          done
          echo "::error::The district did not answer with ok:true after deploying (6 attempts over ~2 minutes)."
          exit 1
