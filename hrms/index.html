<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A40CE">
<title>District HRMS · Jangaon</title>
<link rel="manifest" href="manifest.webmanifest">
<!-- iPhone: opened from the Home Screen it runs as an app, without Safari's
     bars, and carries its own name and icon — the same three lines the
     sanitation app has carried since its first day -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HRMS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/apple-touch-icon-120.png">
<style>
/* DISTRICT HRMS · the employee's own app, rebuilt 18.10.2026 on the draft the
   Collector passed that morning. The shape is Workday's — a home that answers
   what do I have, what is coming, what needs me; one rail of balances; a
   request in two steps; every request with a journey — on the house's own
   tokens: the indigo the field app carries since 14.10.2026, Material You
   surfaces and 20px cards, Base's heavy tight headlines. System font only,
   and no webfont ever: this opens on a handset with no signal. */
:root{
  --primary:#4A40CE; --on-primary:#FFFFFF; --primary-container:#E4E1FF; --on-primary-container:#15006B;
  --secondary:#0E7C86; --secondary-container:#D2F2F4; --on-secondary-container:#003B40;
  --surface:#FBFAFF; --surface-low:#F3F4F9; --surface-mid:#ECEDF6; --surface-high:#E4E5EF; --surface-bright:#FFFFFF;
  --on-surface:#1B1B22; --on-surface-2:#4B4A57; --on-surface-3:#767D93; --outline:#78777F; --outline-v:#D6D5E0;
  --ok:#1B7F4B; --ok-container:#DDF3E6; --warn:#9A5B00; --warn-container:#FFE9C7; --err:#B3261E; --err-container:#FCE2DE;
  /* the leave heat ramp — the console's own validated multi-hue sequence, one order, pale to deep */
  --hm0:#EEF0F6; --hm1:#F4E97A; --hm2:#8FD38B; --hm3:#2FB5A0; --hm4:#2E7FBF; --hm5:#3B2F8F; --hm-lo:#1B1B22; --hm-hi:#FFFFFF;
  --shadow:0 1px 2px rgba(27,27,34,.10),0 2px 10px rgba(27,27,34,.07);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.32,.72,0,1);
  --tabh:calc(80px + env(safe-area-inset-bottom));
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --primary:#C5BFFF; --on-primary:#2A1E8E; --primary-container:#3B30B5; --on-primary-container:#E4E1FF;
  --secondary:#86D6DE; --secondary-container:#0E5D65; --on-secondary-container:#D2F2F4;
  --surface:#121318; --surface-low:#1A1B21; --surface-mid:#1F2027; --surface-high:#2A2B33; --surface-bright:#30313A;
  --on-surface:#E5E2EC; --on-surface-2:#C7C5D0; --on-surface-3:#9A98A6; --outline:#918F9A; --outline-v:#48474F;
  --ok:#7ED8A4; --ok-container:#0F4A2C; --warn:#F2BE62; --warn-container:#5A3600; --err:#F2B8B5; --err-container:#6F1A14;
  --hm0:#2A2B33; --hm1:#F6EB85; --hm2:#97D994; --hm3:#3CC1AC; --hm4:#4A95D1; --hm5:#7A6DD6; --hm-lo:#121318; --hm-hi:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 2px 10px rgba(0,0,0,.35); color-scheme:dark; } }
:root[data-theme="dark"]{
  --primary:#C5BFFF; --on-primary:#2A1E8E; --primary-container:#3B30B5; --on-primary-container:#E4E1FF;
  --secondary:#86D6DE; --secondary-container:#0E5D65; --on-secondary-container:#D2F2F4;
  --surface:#121318; --surface-low:#1A1B21; --surface-mid:#1F2027; --surface-high:#2A2B33; --surface-bright:#30313A;
  --on-surface:#E5E2EC; --on-surface-2:#C7C5D0; --on-surface-3:#9A98A6; --outline:#918F9A; --outline-v:#48474F;
  --ok:#7ED8A4; --ok-container:#0F4A2C; --warn:#F2BE62; --warn-container:#5A3600; --err:#F2B8B5; --err-container:#6F1A14;
  --hm0:#2A2B33; --hm1:#F6EB85; --hm2:#97D994; --hm3:#3CC1AC; --hm4:#4A95D1; --hm5:#7A6DD6; --hm-lo:#121318; --hm-hi:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 2px 10px rgba(0,0,0,.35); color-scheme:dark; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--surface)}
body{color:var(--on-surface);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}

/* ---------- the brand canvas ----------
   The one gradient the house allows, indigo to teal, with two soft orbs that
   drift on transform alone — motion that costs nothing to load and nothing on
   a weak phone. The welcome is the whole screen of it; the sign-in keeps the
   top of it as a hero and raises a sheet over the rest. */
.canvas{position:relative;overflow:hidden;color:#fff;background:linear-gradient(160deg,#4A40CE 0%,#3A4BD6 45%,#0E7C86 100%)}
.canvas .orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.55;pointer-events:none;will-change:transform}
.canvas .orb.a{width:62vmax;height:62vmax;left:-26vmax;top:-30vmax;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.55),rgba(255,255,255,0) 62%);animation:orb-a 16s ease-in-out infinite alternate}
.canvas .orb.b{width:54vmax;height:54vmax;right:-24vmax;bottom:-22vmax;background:radial-gradient(circle at 60% 60%,rgba(134,214,222,.7),rgba(134,214,222,0) 64%);animation:orb-b 19s ease-in-out infinite alternate}
.canvas .orb.c{width:26vmax;height:26vmax;right:8vmax;top:12vmax;background:radial-gradient(circle,rgba(197,191,255,.55),rgba(197,191,255,0) 66%);animation:orb-c 13s ease-in-out infinite alternate}
.canvas .grain{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:22px 22px;opacity:.5;pointer-events:none;mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),rgba(0,0,0,.2))}
@keyframes orb-a{from{transform:translate(0,0) scale(1)}to{transform:translate(9vmax,6vmax) scale(1.12)}}
@keyframes orb-b{from{transform:translate(0,0) scale(1)}to{transform:translate(-8vmax,-7vmax) scale(1.08)}}
@keyframes orb-c{from{transform:translate(0,0)}to{transform:translate(-5vmax,9vmax)}}

/* ---------- welcome ----------
   In front of sign-in on every opening, for people and not for robots. It
   goes by itself after 2.8 s and a tap takes it away at once; it is removed
   from the document, never hidden, so nothing can sit under it. A driven
   browser (navigator.webdriver) is never shown it, so the render passes see
   the app. */
#welcome{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:40px 28px 36px;cursor:pointer;transition:opacity .4s var(--ease),transform .4s var(--ease)}
#welcome.off{opacity:0;transform:scale(1.03);pointer-events:none}
#welcome .seal{position:relative;width:148px;height:148px;display:grid;place-items:center;z-index:1}
#welcome .halo{position:absolute;inset:0;border-radius:50%}
#welcome .halo i{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(255,255,255,.9);opacity:0;animation:w-halo 2400ms ease-out 600ms infinite}
#welcome .halo i:nth-child(2){animation-delay:1400ms}
#welcome .emb{width:148px;height:148px;border-radius:50%;background:#fff;padding:11px;box-shadow:0 18px 50px rgba(0,0,0,.28),0 0 0 10px rgba(255,255,255,.12);position:relative;z-index:1;animation:w-emb 1000ms cubic-bezier(.2,.9,.3,1.15) both}
#welcome .emb img{width:100%;height:100%;display:block;border-radius:50%}
#welcome .gov{position:relative;z-index:1;margin-top:28px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;opacity:.9;animation:w-rise 600ms ease-out 500ms both}
#welcome h1{position:relative;z-index:1;margin:10px 0 0;font-size:44px;font-weight:800;letter-spacing:-.045em;line-height:1;color:#fff}
#welcome h1 span{display:inline-block;animation:w-rise 650ms var(--ease) both;animation-delay:650ms}
#welcome h1 span:nth-child(2){animation-delay:790ms}#welcome h1 span:nth-child(3){animation-delay:930ms}
#welcome .place{position:relative;z-index:1;margin-top:10px;font-size:16px;font-weight:600;letter-spacing:.01em;opacity:.95;animation:w-rise 600ms ease-out 1050ms both}
#welcome .place::before,#welcome .place::after{content:"";display:inline-block;width:22px;height:1px;background:rgba(255,255,255,.6);vertical-align:middle;margin:0 10px}
#welcome .chips{position:relative;z-index:1;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}
#welcome .chips span{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:15px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px);animation:w-pop 520ms cubic-bezier(.2,.9,.3,1.2) both}
#welcome .chips span:nth-child(1){animation-delay:1250ms}#welcome .chips span:nth-child(2){animation-delay:1400ms}#welcome .chips span:nth-child(3){animation-delay:1550ms}
#welcome .foot{position:absolute;left:28px;right:28px;bottom:calc(env(safe-area-inset-bottom) + 58px);font-size:12px;opacity:.78;animation:w-fade 400ms ease-out 1500ms both;z-index:1}
#welcome .prog{position:absolute;left:28px;right:28px;bottom:calc(env(safe-area-inset-bottom) + 40px);height:3px;border-radius:2px;overflow:hidden;background:rgba(255,255,255,.22);animation:w-fade 400ms ease-out 1200ms both;z-index:1}
#welcome .prog i{display:block;height:100%;width:100%;background:#fff;transform-origin:left;animation:w-prog 1500ms cubic-bezier(.4,0,.2,1) 1300ms both}
#welcome .hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 16px);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono);opacity:0;animation:w-fade 500ms ease-out 2000ms both;z-index:1}
@keyframes w-emb{from{opacity:0;transform:scale(.6) translateY(8px)}to{opacity:1;transform:none}}
@keyframes w-halo{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.95)}}
@keyframes w-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes w-pop{from{opacity:0;transform:scale(.8) translateY(6px)}to{opacity:1;transform:none}}
@keyframes w-fade{from{opacity:0}to{opacity:1}}
@keyframes w-prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ---------- sign in and the claim: a hero and a sheet ----------
   The canvas holds the top of the screen with the seal and the name; the
   form rises from the foot on a white sheet, as a phone's own sign-in does.
   Fields are filled pills with a leading mark and a floating label, 52px
   tall for a thumb; the PIN can be shown. */
.entry{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--surface)}
.entry .hero{flex:0 0 auto;min-height:38vh;padding:calc(env(safe-area-inset-top) + 28px) 24px 56px;display:flex;flex-direction:column;justify-content:flex-end}
.entry .hero .seal{width:64px;height:64px;border-radius:50%;background:#fff;padding:5px;box-shadow:0 10px 28px rgba(0,0,0,.22);animation:w-emb 700ms cubic-bezier(.2,.9,.3,1.15) both;position:relative;z-index:1}
.entry .hero .seal img{width:100%;height:100%;border-radius:50%;display:block}
.entry .hero .gov{position:relative;z-index:1;margin-top:18px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.9;animation:w-rise 500ms ease-out 150ms both}
.entry .hero h1{position:relative;z-index:1;margin:6px 0 0;font-size:38px;font-weight:800;letter-spacing:-.04em;line-height:1.02;animation:w-rise 550ms var(--ease) 250ms both}
.entry .hero p{position:relative;z-index:1;margin:8px 0 0;font-size:14.5px;opacity:.9;max-width:30ch;animation:w-rise 550ms var(--ease) 380ms both}
.entry .hero.sm{min-height:26vh;padding-bottom:48px}
.entry .hero.sm h1{font-size:28px}
.entry .sheetin{flex:1;position:relative;margin-top:-30px;background:var(--surface-bright);border-radius:30px 30px 0 0;box-shadow:0 -14px 40px rgba(16,18,28,.14);padding:22px 24px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:sheet-up 560ms var(--ease) both;max-width:560px;width:100%;margin-left:auto;margin-right:auto}
@media (min-width:600px){.entry .sheetin{border-radius:30px;margin-bottom:28px}}
@keyframes sheet-up{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
.entry .sheetin>*{animation:w-rise 480ms var(--ease) both}
.entry .sheetin>:nth-child(2){animation-delay:80ms}.entry .sheetin>:nth-child(3){animation-delay:140ms}.entry .sheetin>:nth-child(4){animation-delay:200ms}.entry .sheetin>:nth-child(5){animation-delay:260ms}.entry .sheetin>:nth-child(6){animation-delay:320ms}.entry .sheetin>:nth-child(7){animation-delay:380ms}
.entry .grab{width:36px;height:4px;border-radius:2px;background:var(--outline-v);margin:-6px auto 2px}
.entry h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.4px}
.entry h2+p{margin:-6px 0 0;color:var(--on-surface-2);font-size:14.5px;line-height:1.45}
.fld{position:relative;display:flex;align-items:center;gap:12px;min-height:58px;padding:0 14px 0 16px;border-radius:18px;background:var(--surface-low);border:1.5px solid transparent;transition:border-color .18s,background .18s,box-shadow .18s}
.fld:focus-within{border-color:var(--primary);background:var(--surface-bright);box-shadow:0 0 0 4px var(--primary-container)}
.fld .mk{width:22px;height:22px;color:var(--on-surface-3);flex:0 0 auto}
.fld:focus-within .mk{color:var(--primary)}
.fld .in{flex:1;min-width:0;position:relative;display:flex;align-items:center;min-height:58px}
.fld label{position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:15.5px;color:var(--on-surface-3);pointer-events:none;transition:opacity .14s var(--ease)}
.fld input{width:100%;border:0;background:none;font:inherit;font-size:17px;color:var(--on-surface);padding:0;outline:none;letter-spacing:.02em;line-height:1.3}
/* the label is the placeholder: it goes the moment the field is focused or
   holds a value, and the value stands centred on its own (18.10.2026 — on a
   phone with a larger system font the shrunk caption sat on the number) */
.fld input:focus+label,.fld input:not(:placeholder-shown)+label{opacity:0}
.fld input::placeholder{color:transparent}
.fld .eye{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--on-surface-3);flex:0 0 auto;margin-right:-6px}
.fld .eye:active{background:var(--surface-mid)}
.entry .btn.filled{min-height:54px;font-size:16.5px;box-shadow:0 10px 24px -10px rgba(74,64,206,.65)}
.entry .btn.filled .arr{transition:transform .18s}
.entry .btn.filled:active .arr{transform:translateX(3px)}
.entry .or{display:flex;align-items:center;gap:12px;color:var(--on-surface-3);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono)}
.entry .or::before,.entry .or::after{content:"";flex:1;height:1px;background:var(--outline-v)}
.entry .first{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--secondary-container);color:var(--on-secondary-container);text-align:left}
.entry .first b{display:block;font-size:14.5px}
.entry .first span{display:block;font-size:12.5px;opacity:.85;margin-top:1px}
.entry .first .chev{border-color:currentColor;margin-left:auto}
.entry .foot{margin-top:auto;padding-top:8px}

/* ---------- motion across the app ----------
   A screen arrives rather than appears; a sheet rises; a pressed card gives.
   Transform and opacity only, and one frame under reduced motion. */
#screen>*{animation:s-in .26s var(--ease) both}
@keyframes s-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.row,.card[data-go],.bal,.btn,.nav button{transition:transform .14s var(--ease),opacity .14s}
.row:active,.card[data-go]:active,.bal:active{transform:scale(.985)}
.btn:active{transform:scale(.97)}
.nav button:active .pill{transform:scale(.92)}
.nav button .pill{transition:background .18s,transform .14s var(--ease)}
@media (prefers-reduced-motion:reduce){ #welcome *,.canvas .orb,.entry .sheetin,.entry .sheetin>*,.entry .hero *,#screen>*{animation-duration:1ms!important;animation-iteration-count:1!important;animation-delay:0ms!important} }

/* ---------- the shell: one page, the tab bar fixed at the foot ---------- */
#screen{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.bar{min-height:64px;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 4px) 8px 0 16px;flex:0 0 auto;position:sticky;top:0;z-index:20;background:var(--surface)}
.bar h1{font-size:24px;font-weight:800;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.5px}
.bar .ic{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;flex:0 0 auto}
.bar .ic:active{background:var(--surface-mid)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary-container);color:var(--on-primary-container);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.3px}
.scroll{flex:1;padding:0 16px 24px;display:flex;flex-direction:column;gap:12px}
.scroll>*{flex:0 0 auto}
.scroll.tabbed{padding-bottom:calc(var(--tabh) + 16px)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;height:var(--tabh);background:var(--surface-low);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:10px 4px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--outline-v)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--on-surface-2);position:relative}
.nav button .pill{width:60px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .18s}
.nav button[aria-current]{color:var(--on-surface)}
.nav button[aria-current] .pill{background:var(--secondary-container);color:var(--on-secondary-container)}
.nav button[aria-current] svg{stroke-width:2.4}
.nav .cnt{position:absolute;top:4px;left:50%;margin-left:8px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--err);color:#fff;font:700 10.5px/17px var(--mono);text-align:center;border:2px solid var(--surface-low);box-sizing:content-box}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
svg.i.s{width:20px;height:20px}

/* ---------- components ---------- */
.card{background:var(--surface-low);border-radius:20px;padding:16px}
.card.bright{background:var(--surface-bright);box-shadow:var(--shadow)}
.card.tonal{background:var(--primary-container);color:var(--on-primary-container)}
.card.tight{padding:4px 16px}
.card.flag{background:var(--err-container);color:var(--err)}
.card.warn{background:var(--warn-container);color:var(--warn)}
.eyebrow{font-size:11.5px;font-weight:700;color:var(--on-surface-3);letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono)}
.card.tonal .eyebrow,.card.flag .eyebrow,.card.warn .eyebrow{color:inherit;opacity:.8}
.title-l{font-size:24px;font-weight:800;line-height:1.2;letter-spacing:-.4px;margin:0}
.title-m{font-size:17px;font-weight:700;letter-spacing:-.2px;margin:0}
.body{font-size:15px;color:var(--on-surface-2);margin:0}
.small{font-size:12.5px;color:var(--on-surface-3);margin:0;line-height:1.45}
.display{font-size:36px;font-weight:800;letter-spacing:-1px;line-height:1.05;margin:0}
.hdr{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:6px 2px -4px}
.hdr button{font-size:13px;font-weight:600;color:var(--primary)}
.btn{min-height:48px;border-radius:24px;padding:0 24px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;width:100%}
.btn.filled{background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn.text{color:var(--primary);min-height:40px}
.btn.outl{border:1px solid var(--outline-v);color:var(--on-surface)}
.btn.err{background:var(--err-container);color:var(--err)}
.btn:disabled{opacity:.45;pointer-events:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;align-items:center;gap:14px;min-height:56px;padding:8px 0;width:100%}
.row+.row{border-top:1px solid var(--outline-v)}
.row .lead,.lead{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface-mid);color:var(--on-surface);flex:0 0 auto;font-weight:700;font-size:14px}
.lead.ok{background:var(--ok-container);color:var(--ok)}.lead.warn{background:var(--warn-container);color:var(--warn)}.lead.err{background:var(--err-container);color:var(--err)}.lead.pri{background:var(--primary-container);color:var(--on-primary-container)}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block;font-weight:600;font-size:15.5px;letter-spacing:-.1px}
.row .txt span{display:block;font-size:13px;color:var(--on-surface-2);margin-top:1px}
.row .trail{color:var(--outline);display:flex;align-items:center;gap:8px;flex:0 0 auto}
.chev{width:9px;height:9px;border-right:2.2px solid var(--outline);border-bottom:2.2px solid var(--outline);transform:rotate(-45deg);flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:10px;font-size:13.5px;font-weight:600;border:1px solid var(--outline-v);background:var(--surface-bright);color:var(--on-surface)}
.chip.on{background:var(--secondary-container);color:var(--on-secondary-container);border-color:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap}
.badge.ok{background:var(--ok-container);color:var(--ok)}
.badge.warn{background:var(--warn-container);color:var(--warn)}
.badge.err{background:var(--err-container);color:var(--err)}
.badge.neu{background:var(--surface-high);color:var(--on-surface-2)}
.msg{font-size:13.5px;line-height:1.55;padding:10px 14px;border-radius:12px;display:none}
.msg.on{display:block}
.msg.bad{background:var(--err-container);color:var(--err)}
.msg.ok{background:var(--ok-container);color:var(--ok)}
.msg.info{background:var(--primary-container);color:var(--on-primary-container)}

/* the balance rail */
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .bal{scroll-snap-align:start;flex:0 0 150px;background:var(--surface-bright);box-shadow:var(--shadow);border-radius:18px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rail .bal .k{font-size:12.5px;font-weight:600;color:var(--on-surface-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail .bal .v{font-size:30px;font-weight:800;letter-spacing:-.9px;line-height:1.05;margin-top:6px}
.rail .bal .v small{font-size:13px;font-weight:600;color:var(--on-surface-3);letter-spacing:0;margin-left:3px}
.rail .bal .m{height:5px;border-radius:3px;background:var(--surface-mid);margin-top:10px;overflow:hidden}
.rail .bal .m i{display:block;height:100%;background:var(--primary);border-radius:3px}
.rail .bal .m i.lo{background:var(--warn)}.rail .bal .m i.out{background:var(--err)}
.rail .bal .s{font-size:11.5px;color:var(--on-surface-3);margin-top:4px}
.rail .bal.sel{box-shadow:var(--shadow),inset 0 0 0 2px var(--primary)}

/* the journey of one application */
.steps{display:flex;flex-direction:column}
.step{display:flex;gap:14px;padding:10px 0;position:relative}
.step+.step::before{content:"";position:absolute;left:13px;top:-12px;height:22px;width:2px;background:var(--outline-v)}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--surface-high);color:var(--on-surface-2);flex:0 0 auto}
.step.done .n{background:var(--ok);color:#fff}
.step.busy .n{background:var(--primary);color:var(--on-primary);box-shadow:0 0 0 5px var(--primary-container)}
.step.bad .n{background:var(--err);color:#fff}
.step.neu .n{background:var(--outline);color:#fff}
.step b{display:block;font-size:15.5px;font-weight:600}
.step span{display:block;font-size:13px;color:var(--on-surface-2)}

/* fields */
.field{background:var(--surface-low);border-radius:12px 12px 4px 4px;border-bottom:2px solid var(--outline);padding:10px 16px 8px}
.field label{display:block;font-size:12px;color:var(--on-surface-2)}
.field input,.field select,.field textarea{width:100%;border:0;background:none;font:inherit;font-size:16px;color:var(--on-surface);padding:4px 0 0;outline:none;resize:none;min-height:30px}
.field input::placeholder,.field textarea::placeholder{color:var(--on-surface-3)}
.sw{display:flex;align-items:center;gap:12px;padding:10px 0}
.sw .txt{flex:1;min-width:0}.sw .txt b{display:block;font-weight:600;font-size:15px}.sw .txt span{display:block;font-size:13px;color:var(--on-surface-2)}
.tog{width:52px;height:32px;border-radius:16px;background:var(--surface-high);position:relative;flex:0 0 auto;transition:background .18s;border:2px solid var(--outline)}
.tog::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--outline);transition:all .18s}
.tog[aria-checked=true]{background:var(--primary);border-color:var(--primary)}
.tog[aria-checked=true]::after{left:24px;background:var(--on-primary)}

/* the calendar — the date picker and the heat map share one grid */
.cal{display:flex;flex-direction:column;gap:6px}
.cal .mh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal .mh b{font-size:16px;font-weight:700}
.cal .mh button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.cal .mh button:active{background:var(--surface-mid)}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .g .dw{font-size:11px;color:var(--on-surface-3);text-align:center;font-weight:600;padding:2px 0}
.cal .g .d{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:13.5px;font-weight:600;color:var(--on-surface);background:var(--surface-bright);box-shadow:inset 0 0 0 1px var(--outline-v);position:relative;min-width:0}
.cal .g .d.o{opacity:0;pointer-events:none}
.cal .g .d.off{color:var(--on-surface-3);background:var(--surface-low);box-shadow:none}
.cal .g .d.hol::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--warn)}
.cal .g .d.gone{color:var(--on-surface-3);background:var(--surface-low);box-shadow:none;opacity:.7}
.cal .g .d.today{box-shadow:inset 0 0 0 2px var(--warn)}
.cal .g .d.in{background:var(--primary-container);color:var(--on-primary-container);box-shadow:none;border-radius:4px}
.cal .g .d.a,.cal .g .d.b{background:var(--primary);color:var(--on-primary);box-shadow:none;border-radius:10px}
.cal .g .d.mine{box-shadow:inset 0 0 0 2px var(--primary)}
.cal .g .d.oh{box-shadow:inset 0 0 0 1.5px var(--secondary)}
.cal .g .d.k0{background:var(--hm0);box-shadow:none;color:var(--on-surface-2)}
.cal .g .d.k1{background:var(--hm1);color:var(--hm-lo);box-shadow:none}.cal .g .d.k2{background:var(--hm2);color:var(--hm-lo);box-shadow:none}.cal .g .d.k3{background:var(--hm3);color:var(--hm-lo);box-shadow:none}
.cal .g .d.k4{background:var(--hm4);color:var(--hm-hi);box-shadow:none}.cal .g .d.k5{background:var(--hm5);color:var(--hm-hi);box-shadow:none}
.cal .g .d small{position:absolute;bottom:3px;right:5px;font-size:9px;font-weight:700;opacity:.85}
.cal.mini .g .d{font-size:11px;border-radius:7px}
.cal.mini .g .d small{font-size:8px;bottom:2px;right:3px}
.leg{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:11.5px;color:var(--on-surface-3);align-items:center}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}

/* twelve months */
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.months .m{aspect-ratio:1/1.35;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;color:var(--on-surface-3);background:var(--hm0);min-width:0}
.months .m b{font-size:12px;font-weight:800;color:inherit;font-variant-numeric:tabular-nums}
.months .m.k1{background:var(--hm1);color:var(--hm-lo)}.months .m.k2{background:var(--hm2);color:var(--hm-lo)}.months .m.k3{background:var(--hm3);color:var(--hm-lo)}.months .m.k4{background:var(--hm4);color:var(--hm-hi)}.months .m.k5{background:var(--hm5);color:var(--hm-hi)}
.months .m.k1 span,.months .m.k2 span,.months .m.k3 span{color:var(--hm-lo);opacity:.8}.months .m.k4 span,.months .m.k5 span{color:var(--hm-hi);opacity:.85}
.months .m.w{box-shadow:inset 0 0 0 2px var(--warn)}
.months .m.cur{outline:2px solid var(--on-surface);outline-offset:-2px}

/* sheet, scrim, toast */
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface-bright);border-radius:28px 28px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -8px 40px rgba(0,0,0,.25);transform:translateY(105%);transition:transform .22s ease;z-index:85;max-height:82vh;overflow:auto}
.sheet.on{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
.scrim.on{opacity:1;pointer-events:auto}
.handle{width:32px;height:4px;border-radius:2px;background:var(--outline-v);margin:4px auto 14px}
.sheet h2{font-size:22px;font-weight:800;letter-spacing:-.4px;margin:0 0 6px}
.sheet p{color:var(--on-surface-2);margin:0 0 14px;line-height:1.5}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tabh) + 12px);max-width:528px;margin:0 auto;background:var(--on-surface);color:var(--surface);border-radius:12px;padding:12px 16px;font-size:14px;opacity:0;transform:translateY(8px);transition:all .2s;z-index:95;pointer-events:none}
.toast.on{opacity:1;transform:none}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--outline-v);font-size:14px}
.kv div:first-child{border-top:0}
.kv span{color:var(--on-surface-2)}.kv b{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.away{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.away::-webkit-scrollbar{display:none}
.away .p{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;font-size:11px;color:var(--on-surface-2);text-align:center;line-height:1.3}
.away .p .av{width:48px;height:48px;border-radius:50%;background:var(--surface-high);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--on-surface)}
.away .p b{display:block;font-weight:600;color:var(--on-surface);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px}
.empty{text-align:center;color:var(--on-surface-3);font-size:13.5px;padding:18px 6px}
.foot{text-align:center;font-size:12px;color:var(--on-surface-3);line-height:1.6;padding:4px 10px 0}
</style>
</head>

<div id="welcome" class="canvas" hidden aria-hidden="true">

</div>

<main id="screen"></main>
